name: Build installers

# Собирает установщики и прикладывает их к релизу, чтобы их можно было
# скачать одной кнопкой — без git, без консоли, без сборки на своей машине.
#
# Запуск: пуш тега вида v1.0.0 либо кнопка «Run workflow» во вкладке Actions.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v1.0.0). Пусто — только собрать, релиз не создавать.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build tools
        working-directory: packaging/windows
        run: npm ci
      - name: Build setup and portable
        working-directory: packaging/windows
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            packaging/windows/out/Phy.Sim-Setup-*.exe
            packaging/windows/out/Phy.Sim-portable-*.exe

  fedora:
    name: Fedora package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # electron-builder делает rpm через fpm, а тому нужен rpmbuild.
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install build tools
        working-directory: packaging/windows
        run: npm ci
      - name: Build rpm
        working-directory: packaging/windows
        run: npm run dist:fedora
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: packaging/windows/out/Phy.Sim-*.rpm

  android:
    name: Android APK
    runs-on: ubuntu-latest
    # Ключ подписи объявлен на уровне задания: его видит и сборка, и проверка
    # «а настроен ли он вообще».
    env:
      PHYSIM_KEYSTORE_B64:   ${{ secrets.ANDROID_KEYSTORE_B64 }}
      PHYSIM_KEYSTORE_PASS:  ${{ secrets.ANDROID_KEYSTORE_PASS }}
      PHYSIM_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # android-all.jar (Robolectric) поставляется с байт-кодом уровня Java 21
      # (class file version 65.0); javac 17 читать такие классы не умеет и
      # падает "class file has wrong version 65.0, should be 61.0" ещё на
      # импортах android.*, отсюда и десятки "cannot find symbol" следом.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # android-all.jar весит 190 МБ — качать его на каждый прогон незачем.
      - name: Cache Android build tools
        uses: actions/cache@v4
        with:
          path: packaging/android/.tools
          key: android-tools-v1
      # Выравнивание и подпись v1+v2+v3. Без v2 пакет не ставится при
      # targetSdkVersion 30+, а Play Protect зовёт его вредоносным.
      # На образе GitHub эти инструменты есть в Android SDK, но не в PATH —
      # пакеты ставим, чтобы сборка не зависела от состава образа.
      - name: Install apksigner and zipalign
        run: sudo apt-get update && sudo apt-get install -y apksigner zipalign
      # Ключ подписи берётся из секрета репозитория: Android ставит обновление
      # поверх старой версии, только если обе подписаны одним ключом, иначе
      # придётся удалять приложение — вместе с прогрессом ученика.
      # Как завести секрет — см. packaging/README.md.
      - name: Build apk
        working-directory: packaging/android
        run: node build-apk.mjs
      # Проверяем env, а не secrets: контекст secrets в условиях if недоступен,
      # и с ним весь файл workflow перестаёт разбираться —
      # «Unrecognized named-value: secrets».
      - name: Предупредить, если ключ не настроен
        if: ${{ env.PHYSIM_KEYSTORE_B64 == '' }}
        run: |
          echo "::warning title=APK подписан временным ключом::Секрет ANDROID_KEYSTORE_B64 не задан. Этот apk нельзя поставить поверх предыдущей версии — у пользователей сотрётся прогресс. Инструкция: packaging/README.md"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: packaging/android/out/*.apk

  release:
    name: Attach to release
    needs: [windows, fedora, android]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # При запуске по тегу берём имя тега; при ручном запуске gh создаёт тег
      # сам — на том коммите, с которого запущен прогон.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          set -eu
          VER="${TAG#v}"
          # Ограничитель в кавычках: внутри текста есть обратные кавычки, и без
          # этого оболочка приняла бы их за подстановку команд. Номер версии
          # поэтому вписываем меткой и заменяем следом — иначе имена файлов
          # в описании отставали бы от выпуска (в v1.1.0 они остались 1.0.0).
          # Числа здесь держатся в согласии с таблицей «What's inside» в README:
          # когда там пересчитывают симуляции, темы, формулы и задачи, эту
          # строку правят следом. Иначе описание релиза начинает отставать —
          # ровно так в v1.2.0 задач осталось 380 вместо 384.
          cat > notes.md <<'EOF'
          **Phy.Sim — a physics course you revise by running it.** 76 live simulations,
          34 topics, 78 step-by-step derivations, 252 formulas and 384 problems. Runs
          offline, asks for nothing, sends nothing.

          **Fix: on the web the page could load and then do nothing.** The service
          worker cached under one fixed name and refreshed files one at a time.
          index.html weighs a few kilobytes and arrived first; app.js is half a
          megabyte and often did not. Close the tab before everything caught up and
          the next visit got a mixture — the markup of one release with the script of
          another. Handlers are bound at the top level of the script, so one missing
          element threw a TypeError on the first line and the whole application died
          behind a fully painted page. That is what "only the picture loads" was.
          This never affected the .apk, which ships one consistent set of files and no
          service worker at all.

          Three changes. The cache name now carries the release, so a new version
          wipes the old cache whole instead of replacing it file by file. The page
          itself is fetched network-first — it decides which release everything else
          in that visit belongs to — with the cache still behind it, so offline is
          unchanged. And every top-level handler is bound through a null-tolerant
          lookup: a missing button now costs a button, not the whole handbook.

          For anyone already stuck there is a watchdog in the page: if the script does
          not report a complete load, or reports a different release than the markup,
          the page clears the cache and the service worker and reloads itself once. If
          that does not help it says so plainly instead of showing a dead screen.

          **The x-axis of a compiled graph can be a parameter, not only time.**
          37 of the 76 simulations are timeless — nothing about them depends on time,
          they carry no graphs at all, and the compiler used to refuse them outright.
          That is all of quantum mechanics, most of optics, nuclear physics and
          electrostatics. The dependence is there, it is simply not on time. Put a
          parameter on the x-axis and every point becomes a separate run of the model:
          the range against the angle of throw, the field against the distance, the
          efficiency against the cold-side temperature. Nothing is written per
          simulation — the axes are built from the parameters and the readouts — so
          73 of the 76 can be compiled now instead of 36. Checked against Coulomb's
          law: outside a charged sphere `E·r²` holds constant to 2e-16 relative spread.

          **The tools are fewer and the rest are properly adjustable.** Gone: the
          protractor, the guide line, box-zoom, the coordinate probe and body trails.
          The vector and the dimension line are now settings of the ruler, which also
          measures in km, m, mm or nm to 0-3 decimals and can show the angle to the
          horizontal. In their place, a selection tool: click a mark, rubber-band
          several, drag them where they belong.

          Colour opens a colour wheel, with the three most recent colours next to it.
          Thickness is typed in pixels instead of picked from four presets; opacity is
          a slider instead of three steps. What stays in the bar is what you change
          while drawing; the rest moved into "⋯".

          **Notes became cards** with a title, a body that folds away, a size you can
          drag, deletion behind a confirmation, and "#" / "##" for larger lines. Cards
          link to each other, and a linked card is read without leaving the one you are
          on. They save themselves per simulation and export to a file.

          Also fixed: the undo button only ever undid parameters, so on a phone a
          drawing could not be undone at all; hiding the simulation while it was
          fullscreen left a blank screen; and the introduction and the section recaps
          kept the previous topic's simulation running beside the text.

          ### Must read

          This application was developed by the creator Somi together with Claude. The AI
          assistant wrote practically all of the course notes on its own; the only places I
          stepped in were the introduction and a few other topics. The mobile adaptation and
          the entire architecture of this project were likewise built by Claude, and may well
          contain plenty of bugs. Bug reports are welcome in Issues.

          ### What to download

          | System | File |
          |---|---|
          | Windows 10/11 | `Phy.Sim-Setup-__VER__.exe` — setup wizard, pick your folder and shortcuts, no admin rights |
          | Windows, no install | `Phy.Sim-portable-__VER__.exe` — runs from a flash drive |
          | Fedora | `Phy.Sim-__VER__.x86_64.rpm` — double-click, or `sudo dnf install ./Phy.Sim-__VER__.x86_64.rpm` |
          | Android | `phy-sim.apk` — zero permissions. Installs over an earlier version, keeping your progress. |
          | Anything else | `phy-sim-standalone.html` in the repository — one file, opens in any browser |

          The course content is in Russian; the code and documentation are in English.
          Licensed under GPL-3.0.
          EOF
          sed -i "s/__VER__/$VER/g" notes.md
          # Повторный выпуск того же тега не должен падать: описание правим,
          # файлы перезаписываем.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Phy.Sim $TAG" --notes-file notes.md
            gh release upload "$TAG" artifacts/*/* --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Phy.Sim $TAG" \
              --notes-file notes.md \
              artifacts/*/*
          fi
