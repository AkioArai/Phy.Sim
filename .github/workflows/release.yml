name: Build installers

# Собирает установщики и прикладывает их к релизу, чтобы их можно было
# скачать одной кнопкой — без git, без консоли, без сборки на своей машине.
#
# Запуск: пуш тега вида v1.0.0 либо кнопка «Run workflow» во вкладке Actions.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v1.0.0). Пусто — только собрать, релиз не создавать.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build tools
        working-directory: packaging/windows
        run: npm ci
      - name: Build setup and portable
        working-directory: packaging/windows
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            packaging/windows/out/Phy.Sim-Setup-*.exe
            packaging/windows/out/Phy.Sim-portable-*.exe

  fedora:
    name: Fedora package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # electron-builder делает rpm через fpm, а тому нужен rpmbuild.
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install build tools
        working-directory: packaging/windows
        run: npm ci
      - name: Build rpm
        working-directory: packaging/windows
        run: npm run dist:fedora
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: packaging/windows/out/Phy.Sim-*.rpm

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # android-all.jar весит 190 МБ — качать его на каждый прогон незачем.
      - name: Cache Android build tools
        uses: actions/cache@v4
        with:
          path: packaging/android/.tools
          key: android-tools-v1
      # Ключ подписи скрипт создаёт сам, и на каждом прогоне он новый: поставить
      # новый apk «поверх» старого не выйдет, сначала удалите прежнюю версию.
      - name: Build apk
        working-directory: packaging/android
        run: node build-apk.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: packaging/android/out/*.apk

  release:
    name: Attach to release
    needs: [windows, fedora, android]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # При запуске по тегу берём имя тега; при ручном запуске gh создаёт тег
      # сам — на том коммите, с которого запущен прогон.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          **Phy.Sim — an interactive physics textbook.** 76 live simulations, 34 topics,
          252 formulas and 380 problems. Runs offline, asks for nothing, sends nothing.

          ### Must read

          This application was developed by the creator Somi together with Claude. The AI
          assistant wrote practically all of the course notes on its own; the only places I
          stepped in were the introduction and a few other topics. The mobile adaptation and
          the entire architecture of this project were likewise built by Claude, and may well
          contain plenty of bugs. Bug reports are welcome in Issues.

          ### What to download

          | System | File |
          |---|---|
          | Windows 10/11 | `Phy.Sim-Setup-1.0.0.exe` — setup wizard, pick your folder and shortcuts, no admin rights |
          | Windows, no install | `Phy.Sim-portable-1.0.0.exe` — runs from a flash drive |
          | Fedora | `Phy.Sim-1.0.0.x86_64.rpm` — double-click, or `sudo dnf install ./Phy.Sim-1.0.0.x86_64.rpm` |
          | Android | `phy-sim.apk` — zero permissions. Each build is signed with a fresh key, so remove any older version first |
          | Anything else | `phy-sim-standalone.html` in the repository — one file, opens in any browser |

          The course content is in Russian; the code and documentation are in English.
          Licensed under GPL-3.0.
          EOF
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Phy.Sim $TAG" \
            --notes-file notes.md \
            artifacts/*/*
