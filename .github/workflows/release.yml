name: Build installers

# Собирает установщики и прикладывает их к релизу, чтобы их можно было
# скачать одной кнопкой — без git, без консоли, без сборки на своей машине.
#
# Запуск: пуш тега вида v1.0.0 либо кнопка «Run workflow» во вкладке Actions.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v1.0.0). Пусто — только собрать, релиз не создавать.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build tools
        working-directory: packaging/windows
        run: npm ci
      - name: Build setup and portable
        working-directory: packaging/windows
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            packaging/windows/out/Phy.Sim-Setup-*.exe
            packaging/windows/out/Phy.Sim-portable-*.exe

  fedora:
    name: Fedora package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # electron-builder делает rpm через fpm, а тому нужен rpmbuild.
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install build tools
        working-directory: packaging/windows
        run: npm ci
      - name: Build rpm
        working-directory: packaging/windows
        run: npm run dist:fedora
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: packaging/windows/out/Phy.Sim-*.rpm

  android:
    name: Android APK
    runs-on: ubuntu-latest
    # Ключ подписи объявлен на уровне задания: его видит и сборка, и проверка
    # «а настроен ли он вообще».
    env:
      PHYSIM_KEYSTORE_B64:   ${{ secrets.ANDROID_KEYSTORE_B64 }}
      PHYSIM_KEYSTORE_PASS:  ${{ secrets.ANDROID_KEYSTORE_PASS }}
      PHYSIM_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # android-all.jar (Robolectric) поставляется с байт-кодом уровня Java 21
      # (class file version 65.0); javac 17 читать такие классы не умеет и
      # падает "class file has wrong version 65.0, should be 61.0" ещё на
      # импортах android.*, отсюда и десятки "cannot find symbol" следом.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # android-all.jar весит 190 МБ — качать его на каждый прогон незачем.
      - name: Cache Android build tools
        uses: actions/cache@v4
        with:
          path: packaging/android/.tools
          key: android-tools-v1
      # Выравнивание и подпись v1+v2+v3. Без v2 пакет не ставится при
      # targetSdkVersion 30+, а Play Protect зовёт его вредоносным.
      # На образе GitHub эти инструменты есть в Android SDK, но не в PATH —
      # пакеты ставим, чтобы сборка не зависела от состава образа.
      - name: Install apksigner and zipalign
        run: sudo apt-get update && sudo apt-get install -y apksigner zipalign
      # Ключ подписи берётся из секрета репозитория: Android ставит обновление
      # поверх старой версии, только если обе подписаны одним ключом, иначе
      # придётся удалять приложение — вместе с прогрессом ученика.
      # Как завести секрет — см. packaging/README.md.
      - name: Build apk
        working-directory: packaging/android
        run: node build-apk.mjs
      # Проверяем env, а не secrets: контекст secrets в условиях if недоступен,
      # и с ним весь файл workflow перестаёт разбираться —
      # «Unrecognized named-value: secrets».
      - name: Предупредить, если ключ не настроен
        if: ${{ env.PHYSIM_KEYSTORE_B64 == '' }}
        run: |
          echo "::warning title=APK подписан временным ключом::Секрет ANDROID_KEYSTORE_B64 не задан. Этот apk нельзя поставить поверх предыдущей версии — у пользователей сотрётся прогресс. Инструкция: packaging/README.md"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: packaging/android/out/*.apk

  release:
    name: Attach to release
    needs: [windows, fedora, android]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # При запуске по тегу берём имя тега; при ручном запуске gh создаёт тег
      # сам — на том коммите, с которого запущен прогон.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          set -eu
          VER="${TAG#v}"
          # Ограничитель в кавычках: внутри текста есть обратные кавычки, и без
          # этого оболочка приняла бы их за подстановку команд. Номер версии
          # поэтому вписываем меткой и заменяем следом — иначе имена файлов
          # в описании отставали бы от выпуска (в v1.1.0 они остались 1.0.0).
          # Числа здесь держатся в согласии с таблицей «What's inside» в README:
          # когда там пересчитывают симуляции, темы, формулы и задачи, эту
          # строку правят следом. Иначе описание релиза начинает отставать —
          # ровно так в v1.2.0 задач осталось 380 вместо 384.
          cat > notes.md <<'EOF'
          **Phy.Sim — a physics course you revise by running it.** 102 live simulations,
          48 topics, 119 step-by-step derivations, 351 formulas and 499 problems. Runs
          offline, asks for nothing, sends nothing.

          ## 6.4.0 — one simulation per topic; solids, circuits, machines, three-phase current

          No simulation opens from two topics any more, and a test keeps it so. Three new topics — solids,
          circuits and measurements, three-phase current — and nine simulations: capillary rise, a rod
          stretched and heated, the Otto and Diesel cycles, electron drift in a wire, p–n and vacuum
          diodes, a Wheatstone bridge with ammeter and voltmeter, a damped LC circuit, a DC motor, and
          three-phase star/delta with a rotating field. More notes in thermodynamics and electromagnetism
          and university-level sections for six more topics.

          ## 6.3.0 — real gases, transport phenomena, current in different media

          Three new topics with five simulations: van der Waals isotherms with Maxwell's construction, heat
          conduction in a rod, Brownian motion against Einstein's formula, an electron beam between capacitor
          plates, and electrolysis by Faraday's law. University-level sections for all of thermodynamics and
          electricity. Section icons are plain coloured marks until real logos are drawn. Fixed: the energy
          diagram can be hidden; switching School / University keeps full screen.

          ## 6.2.0 — a soap film, momentum and fluids, university-level mechanics

          The home screen is a soap film whose colours are computed from thin-film interference and the
          CIE colour-matching functions; a finger stirs it. Two new topics — «Momentum. Jet propulsion»
          and «Fluid mechanics» — with three new simulations (a ball hitting a wall and a mat, a draining
          vessel, a ball in a viscous liquid). Jerk, angular kinematics, inertial forces, the
          parallel-axis theorem and self-sustained oscillations are added to the notes, and every
          mechanics topic gets a university-level section.

          ## 6.1.0 — a light home screen, real thermodynamics, links to experiments

          The home screen follows the light and dark themes. The gas sits between a hot and a cold wall:
          a temperature gradient settles and heat flows on screen; a live speed histogram is drawn
          against Maxwell's curve. Section icons are minimal one-colour lines. *Link to this experiment*
          shares a simulation with its parameters. Full-screen simulation always takes the whole width.

          ## 6.0.0 — the phone redesigned, a gas on the home screen

          **Phone:** the simulation screen follows the author's sketch — notes, simulation picker in a
          visible box, parameters and ⋮ on top; time bar, readouts and one row of buttons below
          (undo, redo, speed, play/stop, reset, tools, more). Notes and parameters with graphs are
          full-screen pages; settings live in one place.

          **New splash and home:** the Φ logo draws itself; the home screen is an ideal gas coloured by
          speed that your finger warms, with the problem of the day lying right in it. Every section has
          its own logo; new course and tool icons.

          **Content:** 96 interesting facts instead of common mistakes; a School / University switch with
          university-level sections in five topics (vectors and derivatives, momentum and Tsiolkovsky,
          deterministic chaos, the Maxwell distribution, Maxwell's equations).

          ## 5.1.0 — a remote for the phone, and a logo

          **The remote:** every parameter is a chip under the scene; pick one and drag the ruler with
          your thumb — the scene recomputes as you go, with a light buzz on every tick. Switches flip
          with a tap, lists become buttons. One-row transport, double-tap to fit, sliders in the
          full parameter list.

          **A logo:** the letter Φ built from an orbit, an axis and a particle — on the app icon, the
          tab and the top bar. **Sections** are now a large number, a line icon and the first topics.
          **The home field responds:** your finger or cursor becomes a charge.

          ## 5.0.0 — a clean sheet

          **The biggest redesign so far, and mostly by taking things away.** Bundled Inter,
          Inter Tight and JetBrains Mono; a home screen with a full-width live electric field and a
          small live picture for every section; topics without boxes and chips; a lighter phone
          layout with five top-bar buttons and readouts only where parameters are set.

          **Removed:** reading aloud, "predict first", the activity diary, the question-of-the-day
          and tools blocks, repeated labels and captions. Lesson mode and the glossary moved to the
          *More* menu and search.

          ## 4.0.0 — a new design and tools for learning

          **New look:** a dark ink top bar with the logo, bold headings, firm cards and a calmer palette;
          the old light bar is one switch away in the settings.

          **New home:** a live scene that cycles through Kepler's orbit, interference and a damped
          oscillator; a problem of the day from the topics you are ready for; an activity diary with
          a 20-week map of the days you studied. No streaks, no badges.

          **Glossary:** 91 terms. The first mention in the notes is underlined — hover or tap for the
          definition and the topic where it is introduced; the whole glossary is searchable.

          **Lesson mode:** a topic as slides — key points, theory by subheadings, experiments, formulas,
          pitfalls and questions — with the live scene beside it. Arrows, space, Esc; swipe on a phone.

          **Predict first:** an option hides the outcome of each experiment until you have made a guess.
          **Read aloud:** the notes are read paragraph by paragraph by the system voice.

          ## 3.5.0 — room for the scene on a phone, optics redone

          **Phone:** one-row transport with a "⋯" card; sideways the bar no longer covers the scene;
          readouts as cards; the strip above the notes shows the moving bodies.

          **Optics:** wavefronts and dispersion in refraction, Fresnel brightness, F and F′ as in
          textbooks, telescopes on a distant object, wave fields in Young's experiment and the grating,
          the secant law in the ionosphere, captions under every picture.

          **Finite rotations:** up to 100 moves in three orders, with the drift after every move.

          ## 3.4.0 — scenes that stay readable

          **Vector arrows drawn properly** over the letter everywhere — on the scene, in readouts,
          parameters and presets.

          **Five scenes rebuilt as panels:** quarks (with live confinement), radioactive decay, neutron
          beta decay, the nucleus with a stability map, band theory. Captions stay inside their frames.

          **The picture avoids every floating panel**, the force legend picks a free corner, the readouts
          panel is compact, words are shown as words and numbers as 1.7·10⁴. Overlapping captions fixed in
          a dozen scenes.

          ## 3.3.0 — right-handed 3D, a laser you can follow

          **3D where it helps.** Minkowski's diagram in 2+1 dimensions with a real light cone and two
          "now" planes; the EM wave with E and B in perpendicular planes; a helix for a charge moving along
          B; rings of field around a wire; crystal lattices you can turn.

          **Right-handed at last.** The 3D projection was a mirror image; now x is right, z up, y into the
          screen. Vertical drag is inverted by default, with settings for both directions.

          **Clearer scenes.** One smooth photon glyph everywhere; the laser split into an "avalanche" of
          copied photons and the full resonator; annihilation trails and detector hits fixed; relativity
          scenes no longer hidden under the readouts; the Lorentz-force field sign corrected.

          ## 3.2.0 — motion in space, quantum scenes that move, the laser

          **A third axis in mechanics.** A projectile thrown at an azimuth, in a 3D view you can
          turn, with a side wind that bends its shadow. A new rigid-body scene explains the vector
          of an elementary rotation angle dφ⃗, ω⃗ on the axis and v⃗ = ω⃗ × r⃗ — and shows with two
          books why a finite rotation is not a vector. The conical pendulum is flat again.

          **Quantum scenes redrawn.** Compton with an energy balance and the momentum triangle;
          electrons building fringes one by one behind a crystal; a wave packet that really
          spreads; the particle in a box as water in a trough — a wave and its reflection making
          a standing wave, in 3D; a hydrogen spectrum with a spectroscope; an X-ray tube whose
          spectrum builds up photon by photon while the anode atom shows where Kα comes from.

          **Matter and nuclei.** Bonds shown forming close up; free electrons at the Fermi speed
          with a magnifier on the Fermi edge; fission and fusion with an energy balance;
          annihilation firing a PET detector ring, and pair-production spirals.

          **New topic: the laser.** Inversion, the four-level scheme, a resonator running on the
          rate equations — threshold, clamped gain, linear output, relaxation spikes.

          ## 3.1.0 — quantum physics you can see

          **Hydrogen orbitals in 3D.** Every state up to n = 6 — s, p, d, f, g, h — as a cloud
          sampled from the exact wavefunction. Drag to turn it; colour shows the sign of ψ; a
          thin slice shows the nodes; the radial distribution marks every node and ⟨r⟩.

          **Photoeffect as Stoletov's experiment.** A vacuum tube, an anode voltage, an ammeter,
          electrons turned back by a retarding field, the current–voltage curve and its stopping
          voltage.

          **New topics.** The double slit one electron at a time — fringes build up dot by dot
          and vanish with a which-path detector. Spin and the Stern–Gerlach experiment — two
          spots, cos²(θ/2) at a tilted magnet, and z–x–z.

          **Fixes.** Bohr atom drawn at the scale of its orbit with correct level labels; a real
          18-column periodic table; Hund's rule in subshells; a taller tunnelling picture; the
          Minkowski diagram now plays out in time and is no longer hidden under the readouts;
          the AC current swings back and forth instead of racing round.

          ## 3.0.0 — relativity, alternating current and a lab

          The release that rounds the course off.

          **Special relativity** — a new section between optics and quantum physics. A light
          clock whose moving copy ticks γ times slower, with the Pythagorean triangle of its
          light path drawn and a rod carried along shortened by γ. A Minkowski diagram where the
          rocket's axes close towards the light cone, simultaneity comes apart and 0.6c + 0.6c
          is 0.88c. An electron pushed by a constant force in real seconds: momentum grows
          evenly, speed creeps up to c, Newton's answer overtakes light. Five derivations, the
          muon example worked in both frames, fifteen problems.

          **Alternating current** — a series RLC circuit with current running round the
          schematic, rotating phasors and the resonance curve; five derivations, five problems.

          **Scene layers** for every simulation (scene menu): stroboscope marks at equal time
          steps, the previous run as a ghost, a camera that follows the body, one colour per
          force across mechanics with a legend and a scale bar, and a halo under labels. The
          orbit gets engine burns and Kepler's equal areas; the wave shows its phase vector.

          **The lab** (scene menu → Data): readings with adjustable scatter or a whole series,
          straightened axes, a least-squares line with the uncertainties of slope and intercept,
          a table you can copy or save as CSV.

          **Accessibility and speed.** Higher-contrast secondary text in every palette, a
          spoken description of the scene, announced verdicts, named icon buttons; a device
          that keeps falling under 24 fps is switched to economy settings once.

          ## 2.2.1 — a stricter look

          **Design.** Less playful, more precise: corners of 3–7 px on one scale instead of
          rounded pills, short straight transitions without bounce, cards and buttons that no
          longer jump under the cursor, monochrome icons with the section colour kept to a thin
          line, a plainer home screen, difficulty shown as bars instead of coloured dots. The
          ripple on tap is off by default (Settings → Appearance brings it back).

          **Lift.** The stick figure is gone: the load on the scales is a block, and both forces,
          mg and N, act at its centre of mass — the material point of the second law. Problem
          texts follow; your marks on them are kept.

          ## 2.2.0 — quieter, flatter, and out of the way

          **The topic header gets out of the way.** Scroll down to read and the title, summary
          and tabs slide up; the slightest scroll up brings them back. The text underneath does
          not move by a pixel.

          **A new top bar.** Home · Course · My path, in words, and a search box for the whole
          course in the middle. **Reading mode** hides the scene and the topic list in one click
          and brings back exactly what was open.

          **Fewer gradients.** The fades on the topic header, the home screen, the section cards
          and the gloss on buttons are gone; notes use flat cards instead of coloured frames.

          **New simulation: a lift.** In *Dynamics*: a person on bathroom scales, a real ride
          profile (accelerate, cruise, brake) and a cable that can break. The scales read
          m(g + a)/g — weight depends on acceleration, not on speed, and in free fall it is zero
          while gravity is unchanged. Five problems and three new physics checks come with it.

          **Fixes in scene notes.** While editing, clicking the title closed the editor; "delete"
          lost its first click; a tucked note could not be restored with a tap (only a double
          click, which phones do not have); a note near the edge slid off the scene after the
          window shrank or the phone turned; after a dialog the editor did not close on a click
          elsewhere; a note file with missing fields put a card at NaN. All fixed, and the text
          is now saved while you type.

          ### Must read

          This application was developed by the creator Somi together with Claude. The AI
          assistant wrote practically all of the course notes on its own; the only places I
          stepped in were the introduction and a few other topics. The mobile adaptation and
          the entire architecture of this project were likewise built by Claude, and may well
          contain plenty of bugs. Bug reports are welcome in Issues.

          ### What to download

          | System | File |
          |---|---|
          | Windows 10/11 | `Phy.Sim-Setup-__VER__.exe` — setup wizard, pick your folder and shortcuts, no admin rights |
          | Windows, no install | `Phy.Sim-portable-__VER__.exe` — runs from a flash drive |
          | Fedora | `Phy.Sim-__VER__.x86_64.rpm` — double-click, or `sudo dnf install ./Phy.Sim-__VER__.x86_64.rpm` |
          | Android | `phy-sim.apk` — zero permissions. Installs over an earlier version, keeping your progress. |
          | Anything else | `phy-sim-standalone.html` in the repository — one file, opens in any browser |

          The course content is in Russian; the code and documentation are in English.
          Licensed under GPL-3.0.
          EOF
          sed -i "s/__VER__/$VER/g" notes.md
          # Повторный выпуск того же тега не должен падать: описание правим,
          # файлы перезаписываем.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Phy.Sim $TAG" --notes-file notes.md
            gh release upload "$TAG" artifacts/*/* --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Phy.Sim $TAG" \
              --notes-file notes.md \
              artifacts/*/*
          fi
