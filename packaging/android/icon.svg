<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Иконка приложения: параболическая траектория с телом на ней, поверх
       тетрадной клетки. Цвет — акцент пособия (#2f5ea8). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6fbe"/>
      <stop offset="1" stop-color="#22406f"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity=".13" stroke-width="2">
    <path d="M48 0V192M96 0V192M144 0V192M0 48H192M0 96H192M0 144H192"/>
  </g>
  <!-- оси -->
  <g stroke="#ffffff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round">
    <path d="M34 150H162"/>
    <path d="M34 150V38"/>
  </g>
  <!-- траектория -->
  <path d="M34 150 Q 96 8 158 150" fill="none" stroke="#ffd166" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="1 20"/>
  <path d="M34 150 Q 82 34 118 92" fill="none" stroke="#ffffff" stroke-width="9"
        stroke-linecap="round"/>
  <circle cx="118" cy="92" r="15" fill="#ffd166" stroke="#ffffff" stroke-width="5"/>
</svg>
