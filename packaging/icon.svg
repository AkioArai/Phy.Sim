<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- Знак Phy.Sim (5.1.0): буква «Φ», собранная из модели — наклонная орбита,
     ось и частица на орбите. Нижняя дуга проходит перед осью, верхняя —
     за ней: знак читается как объём, а не плоская буква. Цвета — те же,
     что у силовых линий на главной: фиолетовый к голубому. -->
