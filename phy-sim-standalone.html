<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phy.Sim — физика в симуляциях</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>:root{
  --bg:#f6f7f8; --panel:#fff; --panel-2:#eef0f2; --line:#d7dbe0; --line-soft:#e7eaee;
  --ink:#171a1f; --ink-2:#5c6570; --ink-3:#8b939d;
  --accent:#2f5ea8; --accent-soft:#2f5ea81a; --second:#7a4fa3; --measure:#c07615; --danger:#b3452f;
  --grid:#dfe3e8; --grid-major:#c9cfd6; --canvas:#fbfcfd;
  --radius:7px; --fs:12pt;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#101216; --panel:#171a1f; --panel-2:#1e222a; --line:#2a2f38; --line-soft:#22262d;
  --ink:#e6e9ed; --ink-2:#9aa3ae; --ink-3:#6d757f;
  --accent:#6fa2e8; --accent-soft:#6fa2e824; --second:#b18ad6; --measure:#e0a44a; --danger:#e07a62;
  --grid:#232830; --grid-major:#2d333d; --canvas:#14171c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:var(--fs);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}

#app{height:100%;display:flex;flex-direction:column;background:var(--panel);
  /* viewport-fit=cover: без отступа верхняя панель оказывалась под статусбаром телефона */
  padding-top:env(safe-area-inset-top)}
.topbar{display:flex;align-items:center;gap:6px;height:44px;padding:0 max(8px,env(safe-area-inset-left)) 0 max(8px,env(safe-area-inset-left));border-bottom:1px solid var(--line);flex:0 0 auto}
.spacer{flex:1}
.crumb{font-size:12px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;font-family:var(--mono)}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--radius);border:1px solid transparent;color:var(--ink-2);transition:.12s}
.iconbtn:hover{background:var(--panel-2);color:var(--ink)}
.iconbtn.on,.iconbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.body{flex:1;display:flex;min-height:0}

.rail{width:44px;flex:0 0 44px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.rail .sep-h{width:24px;height:1px;background:var(--line);margin:4px 0}

.sidebar{width:280px;flex:0 0 280px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sidebar.hidden{display:none}
.search{padding:8px;border-bottom:1px solid var(--line-soft)}
.search input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);font-size:13px}
.tree{overflow-y:auto;padding:6px;flex:1}
.sec>.hd{display:flex;align-items:center;gap:8px;width:100%;padding:9px 8px;border-radius:var(--radius);font-size:13px;font-weight:550;text-align:left}
.sec>.hd:hover{background:var(--panel-2)}
.sec>.hd .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.sec>.hd .chev{width:13px;height:13px;stroke:var(--ink-3);fill:none;stroke-width:2;transition:transform .15s;flex:0 0 auto}
.sec.open>.hd .chev{transform:rotate(90deg)}
.sec>.hd .dot{width:6px;height:6px;border-radius:2px;background:var(--accent);opacity:.55;flex:0 0 auto}
.sec .kids{display:none;padding:2px 0 6px 10px;border-left:1px solid var(--line-soft);margin-left:14px}
.sec.open .kids{display:block}
.topic-item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:7px 9px;border-radius:6px;font-size:13px;color:var(--ink-2);line-height:1.35}
.topic-item:hover{background:var(--panel-2);color:var(--ink)}
.topic-item.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
/* разделы повышенной сложности: приглушённый серый текст + красная метка */
.sec.hard>.hd{color:var(--ink-3)}
.sec.hard>.hd .dot{background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 18%,transparent)}
.hardtag{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;font-family:var(--mono);
  color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);
  background:color-mix(in srgb,var(--danger) 10%,transparent);
  padding:1px 5px;border-radius:999px;margin-left:6px;white-space:nowrap}
.topic-item.hard{color:var(--ink-3)}
.topic-item.hard .ch{color:var(--danger);opacity:.75}
.topic-item.hard:hover{color:var(--ink-2)}
.topic-item.hard.active{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
/* шапка темы из сложного раздела */
.hardnote{display:flex;align-items:flex-start;gap:8px;margin:0 0 14px;padding:9px 11px;border-radius:8px;
  border:1px solid color-mix(in srgb,var(--danger) 32%,transparent);
  background:color-mix(in srgb,var(--danger) 7%,transparent);color:var(--ink-3);font-size:12.5px;line-height:1.5}
.hardnote b{color:var(--danger);font-weight:600}
.topic-item .ch{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:0 0 auto;width:20px}
.topic-item.wip{opacity:.6}
.topic-item .star{color:var(--ink-3);font-size:12px;flex:0 0 auto}
.topic-item .star.on{color:var(--measure)}
.empty{padding:26px 14px;color:var(--ink-3);font-size:13px;text-align:center;line-height:1.6}

.content{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.chead{padding:24px 34px 0;flex:0 0 auto}
.chead h1{font-size:1.5em;font-weight:650;letter-spacing:-.02em;line-height:1.3}
.chead .sub{color:var(--ink-3);font-size:12px;font-family:var(--mono);margin-top:5px}
.tabs{display:flex;gap:2px;margin-top:16px;border-bottom:1px solid var(--line)}
.tabs button{padding:9px 14px;font-size:13px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.pane{flex:1;overflow-y:auto;padding:22px 34px 64px}
.content.wide .chead{padding:24px 12vw 0}
.content.wide .pane{padding:22px 12vw 64px}

article p{line-height:1.65;margin-bottom:12px}
article ul{margin:0 0 12px 20px;line-height:1.65}
article li{margin-bottom:6px}
article strong{font-weight:600}
article code{font-family:var(--mono);font-size:.86em;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px}
article kbd{font-family:var(--mono);font-size:.8em;background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
.problem kbd{font-family:var(--mono);font-size:.8em;background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
h2.sect{font-size:.72em;font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);margin:28px 0 12px;padding-left:9px;border-left:2px solid var(--accent)}
h3.sub{font-size:.95em;font-weight:600;margin:18px 0 8px}
.callout{border-left:2px solid var(--measure);background:var(--panel-2);padding:12px 15px;border-radius:0 var(--radius) var(--radius) 0;margin:14px 0;font-size:.95em;line-height:1.6;color:var(--ink-2)}

.formula{position:relative;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0;background:var(--panel-2)}
.formula .note{font-size:12.5px;color:var(--ink-2);margin-top:8px;line-height:1.5}

.problem{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.problem .head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.dots{display:flex;gap:2px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}.dots i.f{background:var(--measure)}
.tagsim{font-family:var(--mono);font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:2px 6px;margin-left:auto}
.problem .st{line-height:1.6;margin-bottom:10px}
.answer{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.answer input{width:140px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);font-family:var(--mono);font-size:13px}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:12.5px;color:var(--ink-2);transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.verdict{font-size:12.5px;font-family:var(--mono)}
.verdict.ok{color:#2e7d4f}.verdict.no{color:var(--danger)}
[data-theme="dark"] .verdict.ok{color:#6fcf97}

.splitter{width:5px;flex:0 0 5px;cursor:col-resize;background:var(--line-soft);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.splitter:hover,.splitter.drag{background:var(--accent)}
.simpane{width:470px;flex:0 0 470px;display:flex;flex-direction:column;min-width:0}
.simpane.hidden,.splitter.hidden{display:none}
#app.simfull .content,#app.simfull .splitter{display:none}
/* в полноэкранном режиме список тем не пропадает, а ложится поверх симуляции */
#app.simfull .sidebar{position:absolute;left:0;top:0;bottom:0;z-index:60;height:auto;
  background:var(--panel);border-right:1px solid var(--line);box-shadow:6px 0 28px -14px #0007}
#app.simfull .sidebar.hidden{display:none}
#app.simfull .simpane{padding-left:0}
#app.simfull .simpane{flex:1 1 auto;width:auto}
#simsel{flex:1;min-width:0;padding:4px 6px;color:var(--accent);border-color:var(--accent);border:1px solid var(--line);border-radius:5px;background:var(--panel-2);font-size:12px;font-family:var(--sans);color:var(--ink-2);text-transform:none;letter-spacing:0}
.simhead{display:flex;align-items:center;gap:6px;padding:6px 9px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
/* кнопка «назад к конспекту» нужна только на узких экранах, где симуляция
   ложится поверх всего интерфейса; показывается медиазапросом ниже.
   Именно правилом, а не inline-стилем: inline display:none перебивал
   медиазапрос, и на телефоне симуляцию было невозможно закрыть. */
#btn-simback{display:none}
.warnbar{padding:6px 10px;font-size:12px;line-height:1.45;color:#7a4a08;background:#fdf1dc;border-bottom:1px solid var(--line)}
[data-theme="dark"] .warnbar{color:#f0c987;background:#3a2c12}
.warnbar.hidden{display:none}
.canvas-wrap{position:relative;flex:1;min-height:170px;background:var(--canvas);overflow:hidden}
.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;
  /* без этого на планшете и телефоне перетаскивание тел прокручивало бы страницу */
  touch-action:none; -ms-touch-action:none}
#overlay{pointer-events:none}
/* показатели вынесены в отдельную рамку, чтобы не сливались с рисунком */
.hud{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:11px;color:var(--ink-2);
  background:color-mix(in srgb,var(--panel) 93%,transparent);
  padding:6px 10px 7px;line-height:1.55;white-space:pre;pointer-events:none;
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;
  box-shadow:0 3px 12px -6px rgba(0,0,0,.45)}
.hud::before{content:'ПОКАЗАТЕЛИ';display:block;font-size:9px;letter-spacing:.12em;
  color:var(--ink-3);margin:0 0 5px;padding-bottom:4px;border-bottom:1px solid var(--line-soft)}
.pvbox{position:absolute;right:8px;top:8px;width:320px;background:color-mix(in srgb,var(--canvas) 92%,transparent);
  border:1px solid var(--line-soft);border-radius:8px;pointer-events:auto;overflow:hidden;
  transition:width .18s ease,height .18s ease;font-family:var(--sans)}
.pvbox.hidden{display:none}
.pvbox .pvhead{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 11px;
  cursor:pointer;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line-soft);user-select:none}
.pvbox .pvhead b{font-weight:600}
.pvbox .pvtoggle{font-family:var(--mono);font-size:13px;color:var(--ink-3);line-height:1}
.pvbox .pvbody{padding:6px}
.pvbox.collapsed{width:180px}
.pvbox.collapsed .pvbody{display:none}
.pvbox.collapsed .pvhead{border-bottom:none}
.pvbox svg{display:block;width:100%;height:auto}
.pvbox .pvrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--ink-2);padding:1px 3px}
.pvbox .pvrow span:last-child{color:var(--ink)}
.histobox{position:absolute;right:8px;bottom:8px;background:color-mix(in srgb,var(--canvas) 88%,transparent);
  padding:9px 12px 7px;border-radius:7px;border:1px solid var(--line-soft);pointer-events:none}
.histobox.hidden{display:none}
.histobox .htitle{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:4px}
.histobox .hbars{display:flex;gap:3px;align-items:flex-end;height:96px}
    .histobox .hb{width:13px;background:var(--accent);border-radius:2px 2px 0 0;min-height:1px;transition:height .08s linear}
.histobox .hx{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:2px;text-align:center}
.energybox{position:absolute;right:8px;top:8px;display:flex;gap:10px;align-items:flex-end;
  background:color-mix(in srgb,var(--canvas) 88%,transparent);padding:8px 10px 6px;border-radius:7px;
  border:1px solid var(--line-soft);pointer-events:none}
.energybox.hidden{display:none}
.ebar{display:flex;flex-direction:column;align-items:center;gap:3px;width:34px}
.ebar .track{width:16px;height:78px;background:var(--line);border-radius:3px;position:relative;overflow:hidden}
.ebar .fill{position:absolute;left:0;bottom:0;width:100%;transition:height .05s linear}
.ebar .lab{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);white-space:nowrap}
.ebar .val{font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.energybox .tot{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);align-self:flex-start;margin-left:2px}
.hud.hidden{display:none}
.eventflag{position:absolute;right:8px;bottom:8px;font-family:var(--mono);font-size:11px;color:#fff;background:var(--measure);padding:4px 8px;border-radius:5px;pointer-events:none}
.eventflag.hidden{display:none}
.hsplit{height:6px;flex:0 0 6px;cursor:row-resize;background:var(--line-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.hsplit::after{content:'';width:34px;height:2px;border-radius:2px;background:var(--ink-3);opacity:.45}
.hsplit:hover,.hsplit.drag{background:var(--accent)}
.hsplit:hover::after,.hsplit.drag::after{background:#fff;opacity:.9}
.simbottom{overflow-y:auto;height:300px;flex:0 0 auto}
.simbottom.collapsed{height:0!important;overflow:hidden;border:none}
.gbox{padding:8px 10px 4px}
.gbox.off{display:none}
.gtitle{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin:6px 0 3px;display:flex;gap:8px;align-items:center}
.gtitle .lg{display:flex;gap:4px;align-items:center}
.gtitle .sw{width:14px;height:2px;border-radius:2px;display:inline-block}
.gbox canvas{width:100%;height:84px;display:block;border:1px solid var(--line-soft);border-radius:5px;background:var(--canvas)}
.pbox{padding:8px 12px 16px}
.sec-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:10px 0 6px}

.param{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.param:last-child{border-bottom:none}
.param .name{font-size:13px;color:var(--ink-2);flex:1;line-height:1.3}
.numfield{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:0 0 auto}
.numfield button{width:24px;height:28px;color:var(--ink-3);font-size:13px}
.numfield button:hover{background:var(--panel-2);color:var(--accent)}
.numfield input{width:78px;height:28px;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--panel-2);text-align:center;font-family:var(--mono);font-size:12.5px;-moz-appearance:textfield}
.numfield input::-webkit-outer-spin-button,.numfield input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numfield input:focus{outline:none;background:var(--accent-soft);color:var(--accent)}
.param .unit{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:44px;flex:0 0 auto}
.param .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;flex:1}
.param .chk input{accent-color:var(--accent);width:15px;height:15px}
.param select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);font-size:12.5px;min-width:150px}
.pgroup{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:12px 0 4px;border-bottom:1px solid var(--line-soft)}

.statusbar{height:40px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 8px;border-top:1px solid var(--line)}
.brand{font-family:var(--mono);font-weight:600;font-size:13px}
.brand span{color:var(--accent)}
.group{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.group .iconbtn{border-radius:0;border:none;width:30px;height:28px}
.zoomval{font-family:var(--mono);font-size:12px;width:66px;text-align:center;color:var(--ink-2);background:transparent;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);height:28px}
.clock{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.pop{position:absolute;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 34px -12px #0000004d;padding:6px;min-width:240px}
.pop.hidden{display:none}
.pop .item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 9px;border-radius:5px;font-size:13px;color:var(--ink-2);text-decoration:none}
.pop .item:hover{background:var(--panel-2);color:var(--ink)}
.pop .item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;flex:0 0 auto}
.pop .ttl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:8px 9px 5px}
.pop .field{padding:6px 9px 10px}
.pop .field select{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);font-size:13px}
.pop .field input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{flex:1;padding:5px;font-size:12px;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:#fff}
.preset{display:flex;align-items:center;gap:6px;padding:5px 9px;font-size:12.5px}
.preset button{font-size:12px;color:var(--accent);text-align:left}
.preset .del{color:var(--ink-3);margin-left:auto}
.preset .del:hover{color:var(--danger)}
/* Плотность интерфейса: сжимает или разводит отступы и строки.
   Компактно — больше влезает на экран, просторно — легче попадать пальцем. */
[data-density="compact"]{--dens:0.78}
[data-density="cozy"]{--dens:1}
[data-density="roomy"]{--dens:1.22}
:root{--dens:1}
[data-density] .field{margin-bottom:calc(9px*var(--dens))}
[data-density] .item{padding:calc(7px*var(--dens)) 10px}
[data-density] .pset{padding:calc(13px*var(--dens)) 2px}
[data-density] .topicbtn{padding:calc(7px*var(--dens)) 10px}
[data-density] .frow{padding:calc(10px*var(--dens)) 12px}

/* ===== ПОЛНОЭКРАННЫЕ НАСТРОЙКИ =====
   Раскладка привычная по редакторам: слева разделы, сверху поиск,
   справа список параметров с названием, пояснением и управлением. */
.prefs{position:fixed;inset:0;z-index:120;display:flex;background:var(--bg);animation:prefsIn .14s ease}
.prefs.hidden{display:none}
@keyframes prefsIn{from{opacity:0;transform:scale(.995)}to{opacity:1;transform:none}}
.prefs-side{width:238px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);
  padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.prefs-side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  padding:12px 10px 6px}
.prefs-cat{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;
  border:0;border-radius:6px;background:none;color:var(--ink-2);font:inherit;font-size:13px;cursor:pointer}
.prefs-cat:hover{background:var(--panel-2);color:var(--ink)}
.prefs-cat.on{background:var(--accent-soft);color:var(--accent)}
.prefs-cat svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0}
.prefs-main{flex:1;min-width:0;display:flex;flex-direction:column}
.prefs-top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.prefs-top h3{font-size:15px;flex-shrink:0}
.prefs-search{flex:1;max-width:340px;margin-left:auto;padding:7px 10px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--panel-2);color:var(--ink);font:inherit;font-size:13px}
.prefs-search:focus{outline:none;border-color:var(--accent)}
.prefs-body{flex:1;overflow-y:auto;padding:6px 26px 40px;max-width:920px;width:100%}
.pset-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  margin:24px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.pset{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:13px 2px;
  border-bottom:1px solid var(--line-soft)}
.pset.hide{display:none}
.pset-l{min-width:0}
.pset-name{font-size:13.5px;color:var(--ink)}
.pset-desc{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.pset-c{flex-shrink:0;display:flex;align-items:center;gap:9px}
.pset-c select,.pset-c input[type=range]{font:inherit;font-size:13px}
.pset-c select{padding:6px 9px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel-2);color:var(--ink);min-width:190px}
.pset-c input[type=range]{width:150px}
.pset-val{font-size:12px;color:var(--ink-3);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.pset-reset{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:3px;border-radius:4px;
  opacity:0;transition:opacity .12s}
.pset:hover .pset-reset{opacity:1}
.pset-reset:hover{color:var(--accent);background:var(--panel-2)}
.pset-reset svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
/* переключатель-тумблер, как в современных приложениях */
.sw-t{position:relative;width:38px;height:21px;flex-shrink:0}
.sw-t input{opacity:0;width:0;height:0;position:absolute}
.sw-t i{position:absolute;inset:0;background:var(--line);border-radius:11px;transition:background .15s;cursor:pointer}
.sw-t i::after{content:'';position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;
  background:#fff;transition:transform .15s;box-shadow:0 1px 3px #0004}
.sw-t input:checked + i{background:var(--accent)}
.sw-t input:checked + i::after{transform:translateX(17px)}
.sw-t input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.prefs-empty{padding:40px 4px;color:var(--ink-3);font-size:13px}
.prefs-keys{display:grid;grid-template-columns:1fr auto;gap:0}
.prefs-keys .kb{display:contents}
.prefs-keys .kb span{padding:9px 2px;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--ink-2)}
.prefs-keys .kb kbd{padding:9px 2px;border-bottom:1px solid var(--line-soft);text-align:right}
.prefs-about{font-size:13px;color:var(--ink-2);line-height:1.65}
.prefs-about b{color:var(--ink)}
.prefs-stat{display:flex;gap:26px;flex-wrap:wrap;margin:14px 0 4px}
.prefs-stat div{font-size:12px;color:var(--ink-3)}
.prefs-stat b{display:block;font-size:19px;color:var(--accent);font-weight:600;margin-bottom:2px}
@media (max-width:760px){
  .prefs-side{width:64px}
  .prefs-side .grp,.prefs-cat span{display:none}
  .prefs-cat{justify-content:center}
  .prefs-body{padding:6px 14px 40px}
  .pset{flex-direction:column;align-items:flex-start;gap:10px}
  /* поле поиска настроек должно сжиматься, иначе кнопка «закрыть» уезжала за
     край экрана и настройки нельзя было закрыть без клавиатуры (Esc) */
  .prefs-top{padding:10px 12px;gap:8px}
  .prefs-search{min-width:0}
  .prefs-top h3{font-size:14px}
  #prefs-close{flex:0 0 auto}
}
.modal-bg{position:fixed;inset:0;background:#00000066;z-index:80;display:grid;place-items:center}
.modal-bg.hidden{display:none}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px;width:min(460px,92vw);max-height:80vh;overflow-y:auto}
.modal h3{font-size:15px;margin-bottom:14px}
.kb{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--ink-2)}
.kb kbd{font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 6px;color:var(--ink)}
.toast{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:70vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Мобильные элементы управления: по умолчанию (десктоп) скрыты, включаются
   в медиазапросе узких экранов ниже. ---- */
.mobile-only{display:none}
.mdock{display:none}
.msheet-bg{display:none}
.msheet-head{display:none}

/* ======================= УЗКИЕ ЭКРАНЫ (ТЕЛЕФОН/ПЛАНШЕТ) =======================
   На телефоне бок о бок ничего не помещается: конспект занимает всю ширину, а
   симуляция открывается поверх него целиком. Управление симуляцией вынесено в
   плавающий док и выезжающую снизу шторку — верхняя и нижняя панели десктопа
   на узком экране перекрыты полноэкранной сценой и недоступны. */
@media (max-width:900px){
  .sidebar{position:absolute;z-index:40;height:calc(100% - 84px);
    box-shadow:4px 0 24px -12px #0006;background:var(--panel)}
  .splitter{display:none}
  .simpane{position:fixed;inset:0;z-index:70;width:100%;flex:none;
    background:var(--bg);box-shadow:none;
    /* на телефонах с вырезом шапка (и кнопка «назад») не должна уезжать под статусбар */
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom)}
  .simpane.hidden{display:none}
  #btn-simfull{display:none}
  .content.wide{flex:1}
  .rail{width:40px;flex:0 0 40px}
  .iconbtn{width:40px;height:40px}

  /* ---- Слим-шапка симуляции: [‹]  Название ▾  [⚙] [⋯] ---- */
  .simhead{padding:6px 6px;gap:2px;font-size:13px;text-transform:none;letter-spacing:0;
    border-bottom:1px solid var(--line)}
  .simhead-lbl,#clock,#btn-graph,#btn-makeout{display:none}   /* лишнее из шапки убираем */
  #btn-simback{display:inline-flex}
  .mobile-only{display:inline-flex}
  #simsel{flex:1;min-width:0;max-width:none;font-size:15px;font-weight:600;color:var(--ink);
    border:none;background:none;padding:6px 2px;text-transform:none;letter-spacing:0}

  /* сцена занимает всё оставшееся место */
  .canvas-wrap{flex:1}
  #hsplit{display:none}

  /* компактный HUD, чтобы не заслонял сцену */
  .hud{font-size:10px;padding:5px 8px 6px;left:6px;top:6px;
    background:color-mix(in srgb,var(--panel) 82%,transparent)}
  .hud::before{font-size:8px;margin-bottom:3px}

  /* ---- Нижняя панель превращается в выезжающую шторку ---- */
  #simbottom{position:fixed;left:0;right:0;bottom:0;z-index:78;height:auto!important;max-height:74vh;
    background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    box-shadow:0 -12px 34px -14px #0009;overflow-y:auto;
    transform:translateY(110%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  #simbottom.msheet-open{transform:none}
  #simbottom.collapsed{height:auto!important}     /* десктопное «свернуть» на мобильном не действует */
  .gbox.off{display:none}
  .msheet-head{display:flex;align-items:center;gap:10px;padding:14px 14px 8px;position:sticky;top:0;
    background:var(--panel);border-bottom:1px solid var(--line-soft);z-index:1}
  .msheet-head b{font-size:14px;flex:1}
  .msheet-head .iconbtn{width:34px;height:34px}
  .msheet-grip{position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:38px;height:4px;border-radius:2px;background:var(--line)}
  .msheet-bg{display:block;position:fixed;inset:0;z-index:77;background:#0006;opacity:0;
    pointer-events:none;transition:opacity .26s}
  .msheet-bg.show{opacity:1;pointer-events:auto}

  /* ---- Плавающий док управления ---- */
  .mdock{display:flex;align-items:center;gap:5px;position:fixed;z-index:76;
    left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
    padding:6px;border-radius:34px;background:color-mix(in srgb,var(--panel) 93%,transparent);
    border:1px solid var(--line);box-shadow:0 8px 30px -8px #0008;backdrop-filter:blur(8px)}
  .mdock .mdock-btn{width:44px;height:44px;border-radius:50%}
  .mdock .mspeed{min-width:32px;text-align:center;font-family:var(--mono);font-size:13px;
    color:var(--ink-2);font-variant-numeric:tabular-nums}
  .mplay{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
    background:var(--accent);color:#fff;border:none;box-shadow:0 4px 14px -4px var(--accent);cursor:pointer}
  .mplay svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .mplay #ic-mplay{fill:currentColor}

  /* попапы (меню симуляции) должны быть выше полноэкранной сцены */
  .pop{z-index:200}
  .crumb{display:none}
}
/* Телефон в альбомной ориентации: экономим высоту — док и шапка компактнее. */
@media (max-width:900px) and (orientation:landscape){
  .simhead{padding:4px 8px}
  .mdock{bottom:calc(8px + env(safe-area-inset-bottom));gap:4px}
  .mdock .mdock-btn{width:40px;height:40px}
  .mplay{width:50px;height:50px}
  .mplay svg{width:23px;height:23px}
  #simbottom{max-height:90vh}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="iconbtn" id="btn-rail" title="Скрыть/открыть панель тем (Tab)" aria-pressed="true">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <div class="sep"></div>
    <button class="iconbtn on" id="tab-topics" title="Разделы"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button class="iconbtn" id="tab-search" title="Поиск (Ctrl+K)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="iconbtn" id="tab-marks" title="Закладки"><svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg></button>
    <div class="spacer"></div>
    <div class="crumb" id="crumb">Phy.Sim</div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btn-simmenu" title="Меню симуляции"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg></button>
    <button class="iconbtn" id="btn-simhide" title="Скрыть симуляцию (H)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    <button class="iconbtn" id="btn-simfull" title="Симуляция во весь экран (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5"/></svg></button>
  </div>

  <div class="body">
    <div class="rail">
      <button class="iconbtn tool on" data-tool="pan" title="Перемещение (V)"><svg viewBox="0 0 24 24"><path d="m5 3 6 16 2.2-6.8L20 10z"/></svg></button>
      <div class="sep-h"></div>
      <button class="iconbtn tool" data-tool="pencil" title="Карандаш (P)"><svg viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg></button>
      <button class="iconbtn tool" data-tool="ruler" title="Линейка (L)"><svg viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8" rx="1" transform="rotate(-20 12 12)"/><path d="M7 9.5v2M11 8v3M15 6.5v3"/></svg></button>
      <button class="iconbtn tool" data-tool="vector" title="Векторная линия (Y)"><svg viewBox="0 0 24 24"><path d="M4 20 19 5m0 0h-6m6 0v6"/></svg></button>
      <button class="iconbtn tool" data-tool="eraser" title="Резинка (E)"><svg viewBox="0 0 24 24"><path d="m6 16 6-6 6 6-3 3H9zM12 10l4-4 6 6-4 4"/></svg></button>
      <div class="sep-h"></div>
      <button class="iconbtn" id="btn-snap" title="Анкерная привязка: тела, узлы сетки (A)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      <div class="sep-h"></div>
      <button class="iconbtn" id="btn-clear" title="Стереть пометки"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button>
    </div>

    <aside class="sidebar" id="sidebar">
      <div class="search"><input id="search" type="search" placeholder="Поиск по темам и формулам…"></div>
      <div class="tree" id="tree"></div>
    </aside>

    <main class="content" id="content">
      <div class="chead">
        <h1 id="t-title">—</h1>
        <div class="sub" id="t-sub"></div>
        <div class="tabs" id="tabs">
          <button data-tab="notes" class="on">Конспект</button>
        </div>
      </div>
      <div class="pane" id="pane"></div>
    </main>

    <div class="splitter" id="splitter"></div>

    <section class="simpane" id="simpane">
      <div class="simhead">
        <span class="simhead-lbl" style="flex:0 0 auto">симуляция:</span>
        <button class="iconbtn" id="btn-simback" title="Назад к конспекту">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <select id="simsel" title="Симуляции этой темы"></select>
        <span id="simtitle" style="display:none"></span>
        <div class="spacer"></div>
        <button class="iconbtn" id="btn-makeout" title="Создать вывод B в конце цепи" style="display:none;width:auto;padding:0 8px;height:24px;font-size:11px;font-family:var(--mono)">вывод B</button>
        <button class="iconbtn" id="btn-graph" title="Графики" aria-pressed="true" style="width:26px;height:24px">
          <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M7 15l4-5 3 3 5-7"/></svg></button>
        <span class="clock" id="clock">t = 0.00 c</span>
        <button class="iconbtn mobile-only" id="m-settings" title="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 13a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <button class="iconbtn mobile-only" id="m-menu" title="Меню симуляции"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg></button>
      </div>
      <div class="warnbar hidden" id="warnbar"></div>
      <div class="canvas-wrap" id="cwrap">
        <canvas id="scene"></canvas><canvas id="overlay"></canvas>
        <div class="hud" id="hud"></div>
        <div class="histobox hidden" id="histobox"></div>
        <div class="pvbox hidden" id="pvbox">
          <div class="pvhead" id="pvhead"><b>PV-диаграмма</b><span class="pvtoggle" id="pvtoggle">▾</span></div>
          <div class="pvbody" id="pvbody"></div>
        </div>
        <div class="energybox hidden" id="energybox"></div>
        <div class="eventflag hidden" id="eventflag"></div>
        <div class="empty" id="nosim" style="position:absolute;inset:0;display:grid;place-items:center;background:var(--canvas)">
          Нажмите ▷ в углу формулы — здесь откроется её симуляция.</div>
      </div>
      <div class="hsplit" id="hsplit" title="Потяните, чтобы изменить высоту панели. Двойной клик — свернуть"></div>
      <div class="simbottom" id="simbottom">
        <div class="msheet-head" id="msheet-head">
          <span class="msheet-grip"></span>
          <b>Параметры и графики</b>
          <button class="iconbtn" id="msheet-close" title="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="gbox" id="gbox"></div>
        <div class="pbox">
          <div class="sec-label">Параметры</div>
          <div id="params"></div>
        </div>
      </div>

      <!-- Мобильное управление: выезжающая шторка перекрывается фоном, а плавающий
           док даёт доступ к пуску/паузе/сбросу/скорости прямо поверх сцены.
           На десктопе оба элемента скрыты (см. .mdock/.msheet-bg display:none). -->
      <div class="msheet-bg" id="msheet-bg"></div>
      <div class="mdock" id="mdock">
        <button class="iconbtn mdock-btn" id="m-reset" title="Сбросить"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        <button class="iconbtn mdock-btn" id="m-slow" title="Медленнее"><svg viewBox="0 0 24 24"><path d="M11 5 5 12l6 7M19 5l-6 7 6 7"/></svg></button>
        <div class="mspeed" id="m-speed">1×</div>
        <button class="iconbtn mdock-btn" id="m-fast" title="Быстрее"><svg viewBox="0 0 24 24"><path d="m13 5 6 7-6 7M5 5l6 7-6 7"/></svg></button>

<script>'use strict';
/* =============================================================================
   PHY.SIM — ЯДРО. Контракт:

   SIMS[id] = {
     title,
     params:[ {key,label,unit,min,max,step,default}
            | {key,label,type:'check',default}
            | {key,label,type:'select',options:[{v,t}],default}
            | {key,type:'group',label}  // визуальный разделитель
     ],
     init(p)->state,                       // state.t — время, обязательно
     step(s,dt,p),                         // может выставить s.__stop = 'текст' → таймер встаёт
     draw(ctx,s,view,p),                   // мировые координаты, y вверх
     anchors(s,p)->[{x,y}],
     readouts(s,p)->[[label,value,unit]],  // HUD
     graphs:[{label,unit,series?:[n1,n2],get(s,p)->[y1,y2|null]}],
     presets?:[{name,values:{...}}],       // готовые наборы (примеры из учебника)
     fit(p,{W,H})->{x,y,scale}
   }
   TOPIC = { id, ch, title, theory, formulas:[{tex,note,sim?}], problems:[] }
   ============================================================================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const DT=1/240, PX_PER_M=40;
const EMPTY_DASH=[];                 // переиспользуем: setLineDash([]) на каждом кадре плодил мусор

/* Реестр симуляций: каждый файл js/sims/* добавляет сюда свои определения. */
const SIMS={};

;
'use strict';
/* ====================== СИМУЛЯЦИЯ: ОДНОМЕРНОЕ ДВИЖЕНИЕ ================== */
const mkBody=(x0,v0,a,t0)=>({x0,v0,a,t0,x:x0,v:0,path:0,started:false,landed:false});

/* наименьший положительный корень y0 + v0τ + aτ²/2 = 0 (время падения на уровень y = 0) */
function fallTime(y0,v0,a){
  if(y0<=0 && v0<=0) return 0;
  if(Math.abs(a)<1e-12) return v0<0 ? -y0/v0 : Infinity;
  const D=v0*v0-2*a*y0; if(D<0) return Infinity;
  const q=Math.sqrt(D);
  const r=[(-v0+q)/a,(-v0-q)/a].filter(t=>t>1e-9).sort((x,y)=>x-y);
  return r.length?r[0]:Infinity;
}

/* точное время касания плоскости x = G: x0 + v0τ + aτ²/2 = G.
   Важно: тело, стартующее прямо С плоскости вверх, не должно «приземляться» в момент старта,
   поэтому нулевой корень отбрасывается — берём первый строго положительный.            */
function groundTau(b,G){
  if(b.x0<=G+1e-9 && b.v0<=0) return 0;            // уже лежит и никуда не летит
  const A=0.5*b.a, B=b.v0, C=b.x0-G;
  if(Math.abs(A)<1e-12){ const t=Math.abs(B)<1e-12?NaN:-C/B; return (t>1e-6)?t:NaN; }
  const D=B*B-4*A*C; if(D<0) return NaN;
  const q=Math.sqrt(D);
  const r=[(-B+q)/(2*A),(-B-q)/(2*A)].filter(x=>x>1e-6).sort((x,y)=>x-y);
  return r.length?r[0]:NaN;
}

function bodyAt(b,t){                   // точное решение: x = x0 + v0τ + aτ²/2
  const tau=t-b.t0;
  if(tau<0) return {x:b.x0, v:0, started:false};
  return {x:b.x0+b.v0*tau+0.5*b.a*tau*tau, v:b.v0+b.a*tau, started:true};
}
/* аналитическое время встречи двух тел (нужно и симуляции, и задачам) */
function meetTime(p){
  const A=0.5*(p.a1-p.a2);
  const d=p.delay;
  // x1(t) = x01 + v01 t + a1 t²/2 ; x2(t) = x02 + v02 (t−d) + a2 (t−d)²/2 , t ≥ d
  const B=p.v01-p.v02+p.a2*d;
  const C=p.x01-p.x02+p.v02*d-0.5*p.a2*d*d;
  const roots=[];
  if(Math.abs(A)<1e-12){ if(Math.abs(B)>1e-12) roots.push(-C/B); }
  else{
    const D=B*B-4*A*C;
    if(D>=0){ const q=Math.sqrt(D); roots.push((-B+q)/(2*A),(-B-q)/(2*A)); }
  }
  const good=roots.filter(t=>t>=Math.max(d,0)-1e-9).sort((a,b)=>a-b);
  return good.length?good[0]:NaN;
}


Object.assign(SIMS,{
kin1d:{
  title:'Одномерное движение',
  params:[
    {key:'bodies',label:'Система',type:'select',default:'1',
     options:[{v:'1',t:'Одно тело'},{v:'2',t:'Два тела'}]},
    {key:'axis',label:'Ось движения',type:'select',default:'x',
     options:[{v:'x',t:'Горизонтальная (x)'},{v:'y',t:'Вертикальная (вверх)'}]},

    {type:'group',label:'Тело 1'},
    {key:'x01',label:'Начальная координата x₀',unit:'м',   min:-500,max:500,step:0.5,default:0},
    {key:'v01',label:'Начальная скорость v₀',  unit:'м/с', min:-100,max:100,step:0.5,default:20},
    {key:'a1', label:'Ускорение a',            unit:'м/с²',min:-50, max:50, step:0.1,default:-9.8},

    {type:'group',label:'Тело 2'},
    {key:'x02',  label:'Начальная координата x₀',unit:'м',   min:-500,max:500,step:0.5,default:0},
    {key:'v02',  label:'Начальная скорость v₀',  unit:'м/с', min:-100,max:100,step:0.5,default:20},
    {key:'a2',   label:'Ускорение a',            unit:'м/с²',min:-50, max:50, step:0.1,default:-9.8},
    {key:'delay',label:'Задержка старта Δt',     unit:'с',   min:0,   max:60, step:0.1,default:1},

    {type:'group',label:'Плоскость (опора)'},
    {key:'ground',    label:'Добавить плоскость',type:'check',default:false},
    {key:'gx',        label:'Координата плоскости',unit:'м',min:-500,max:500,step:0.5,default:0},
    {key:'rest',      label:'Коэффициент восстановления e (0 — тело остаётся)',min:0,max:1,step:0.05,default:0},
    {key:'stopGround',label:'Останавливать при касании плоскости',type:'check',default:false},

    {type:'group',label:'Остановка таймера'},
    {key:'tStop',   label:'Остановить в момент t (0 — не останавливать)',unit:'с',min:0,max:600,step:0.1,default:0},
    {key:'stopMeet',label:'Останавливать при встрече тел (пересечение x(t))',type:'check',default:true}
  ],
  init(p){
    return {t:0, prevD:null, event:null, __stop:null,
      b:[ mkBody(p.x01,p.v01,p.a1,0), mkBody(p.x02,p.v02,p.a2,p.delay) ]};
  },
  step(s,dt,p){
    if(s.event) return;
    const n=(p.bodies==='2')?2:1;
    const t=s.t+dt;

    // событие: заданное время
    if(p.tStop>0&&t>=p.tStop&&!(s.done&&s.done.time)){ this.setT(s,p,p.tStop,n);
      s.event={t:p.tStop,type:'time'};
      s.__stop=`Остановка по времени: t = ${p.tStop.toFixed(2)} с`; return; }

    this.setT(s,p,t,n,dt);

    // плоскость: посадка / отскок
    if(p.ground){
      const G=p.gx;
      for(let i=0;i<n;i++){
        const b=s.b[i];
        if(!b.started||b.landed||b.x>=G-1e-9) continue;
        const tau=groundTau(b,G);                 // точное время касания
        const tl=isFinite(tau)?b.t0+tau:t;
        const vHit=isFinite(tau)?b.v0+b.a*tau:b.v;
        b.x=G; b.v=vHit;
        if(p.rest>0 && Math.abs(vHit)>0.2){       // отскок: тело «перезапускается» от плоскости
          b.x0=G; b.v0=-p.rest*vHit; b.t0=tl; b.v=b.v0;
        } else { b.landed=true; b.v=0; }
        if(p.stopGround && !s.event){
          s.t=tl; s.event={t:tl,type:'ground',x:G};
          s.__stop=`Касание плоскости телом ${i+1}: t = ${tl.toFixed(3)} с, v = ${vHit.toFixed(2)} м/с`;
          return;
        }
      }
    }

    // событие: встреча тел (пересечение графиков x(t))
    if(n===2 && p.stopMeet){
      const D=s.b[0].x-s.b[1].x;
      /* Точное равенство нулю у чисел с плавающей точкой практически недостижимо,
         поэтому «встреча» ловится по зазору EPS и по смене знака разности. */
      const EPS=1e-9;
      if(s.prevD!==null && t>p.delay && (Math.abs(D)<EPS || Math.sign(D)!==Math.sign(s.prevD))){
        let tm=meetTime(p);
        const dD=D-s.prevD;
        if(!isFinite(tm)||tm<t-dt-1e-6||tm>t+1e-6)
          tm = Math.abs(dD)>EPS ? t-dt*D/dD : t;      // без зазора интерполяция дала бы бесконечность
        this.setT(s,p,tm,n);
        const x=s.b[0].x;
        s.event={t:tm,type:'meet',x};
        s.__stop=`Встреча тел: t = ${tm.toFixed(3)} с, координата ${x.toFixed(2)} м`;
        return;
      }
      s.prevD=D;
    }
  },
  setT(s,p,t,n,dt){
    for(let i=0;i<2;i++){
      const b=s.b[i];
      if(b.landed){ b.v=0; continue; }
      const r=bodyAt(b,t);
      if(i<n && r.started && dt) b.path += Math.abs(r.v)*dt;   // пройденный путь
      b.x=r.x; b.v=r.v; b.started=r.started;
    }
    s.t=t;
  },
  anchors(s,p){
    const n=(p.bodies==='2')?2:1, out=[{x:0,y:0}];
    const P=(x)=>p.axis==='y'?{x:0,y:x}:{x,y:0};
    for(let i=0;i<n;i++){ out.push(P(s.b[i].x)); out.push(P(s.b[i].x0)); }
    if(s.event&&s.event.type==='meet') out.push(P(s.event.x));
    return out;
  },
  readouts(s,p){
    const n=(p.bodies==='2')?2:1, r=[['t',s.t,'с']];
    for(let i=0;i<n;i++){
      const b=s.b[i], tag=n===2?` ${i+1}`:'';
      r.push([`x${tag}`,b.x,'м'],[`v${tag}`,b.v,'м/с'],[`a${tag}`,b.started?b.a:0,'м/с²'],
             [`путь${tag}`,b.path,'м'],[`перемещение${tag}`,b.x-b.x0,'м']);
    }
    return r;
  },
  graphs:[
    {label:'x(t) — координата', unit:'м',
     get:(s,p)=>[s.b[0].x, p.bodies==='2'?s.b[1].x:null]},
    {label:'v(t) — скорость (наклон x(t))', unit:'м/с',
     get:(s,p)=>[s.b[0].v, p.bodies==='2'?s.b[1].v:null]},
    {label:'a(t) — ускорение (наклон v(t))', unit:'м/с²',
     get:(s,p)=>[s.b[0].started?p.a1:0, p.bodies==='2'?(s.b[1].started?p.a2:0):null]}
  ],
  /* вписываем весь «прогон»: считаем координаты обоих тел до события/до 12 с */
  presets:[
    {name:'Свободное падение с высоты 20 м',
     values:{bodies:'1',axis:'y',x01:20,v01:0,a1:-9.8,ground:true,gx:0,rest:0,stopGround:true,tStop:0}},
    {name:'Два мяча вверх с интервалом 1 с',
     values:{bodies:'2',axis:'y',x01:0,v01:20,a1:-9.8,x02:0,v02:20,a2:-9.8,delay:1,
             stopMeet:true,ground:false,tStop:0}},
    {name:'Торможение: v₀ = 20 м/с, a = −4 м/с²',
     values:{bodies:'1',axis:'x',x01:0,v01:20,a1:-4,ground:false,tStop:0,stopMeet:false}},
    {name:'Мяч прыгает: e = 0,7',
     values:{bodies:'1',axis:'y',x01:10,v01:0,a1:-9.8,ground:true,gx:0,rest:0.7,stopGround:false,tStop:12}}
  ],
  fit(p,vp){
    const n=(p.bodies==='2')?2:1;
    const bodies=[mkBody(p.x01,p.v01,p.a1,0), mkBody(p.x02,p.v02,p.a2,p.delay)];
    let T = p.tStop>0 ? p.tStop : 12;
    if(n===2 && p.stopMeet){ const tm=meetTime(p); if(isFinite(tm)&&tm>0) T=Math.min(T,tm*1.15); }
    if(p.ground){ for(let i=0;i<n;i++){ const tg=groundTau(bodies[i],p.gx);
      if(isFinite(tg)&&tg>0) T=Math.min(T,bodies[i].t0+tg*1.1); } }
    T=clamp(T,0.5,60);
    let lo=Infinity, hi=-Infinity;
    for(let i=0;i<n;i++){
      for(let k=0;k<=60;k++){
        const x=bodyAt(bodies[i],T*k/60).x;
        if(p.ground&&x<p.gx) continue;
        lo=Math.min(lo,x); hi=Math.max(hi,x);
      }
    }
    if(p.ground){ lo=Math.min(lo,p.gx); hi=Math.max(hi,p.gx); }
    if(!isFinite(lo)){ lo=-10; hi=10; }
    let span=Math.max(hi-lo,2)*1.25, c=(lo+hi)/2;
    const W=(vp&&vp.W)||460, H=(vp&&vp.H)||320;
    const px=(p.axis==='y'?H:W)-40;
    const scale=clamp(px/(span*PX_PER_M),0.002,30);
    return p.axis==='y' ? {x:0,y:c,scale} : {x:c,y:0,scale};
  },
  draw(ctx,s,v,p){
    const vert=p.axis==='y', n=(p.bodies==='2')?2:1;
    const P=x=>vert?[0,x]:[x,0];
    const L=1e4;
    // ось движения
    ctx.strokeStyle=v.c('--ink-3'); ctx.lineWidth=v.lw(1.5);
    ctx.beginPath();
    if(vert){ ctx.moveTo(0,-L); ctx.lineTo(0,L); } else { ctx.moveTo(-L,0); ctx.lineTo(L,0); }
    ctx.stroke();
    v.label(ctx,vert?'x, м (вверх)':'x, м',...P(0),vert?8:-16,vert?-14:16,v.c('--ink-3'));

    // плоскость (опора)
    if(p.ground){
      const G=p.gx, w=6, h=0.6;
      ctx.strokeStyle=v.c('--ink-2'); ctx.lineWidth=v.lw(2.5);
      ctx.beginPath();
      if(vert){ ctx.moveTo(-w,G); ctx.lineTo(w,G); } else { ctx.moveTo(G,-w); ctx.lineTo(G,w); }
      ctx.stroke();
      ctx.lineWidth=v.lw(1); ctx.strokeStyle=v.c('--ink-3');
      for(let k=-w;k<w;k+=0.5){
        ctx.beginPath();
        if(vert){ ctx.moveTo(k,G); ctx.lineTo(k-h*0.6,G-h); }
        else { ctx.moveTo(G,k); ctx.lineTo(G-h,k-h*0.6); }
        ctx.stroke();
      }
      v.label(ctx,'плоскость',...(vert?[w,G]:[G,w]),vert?-64:6,vert?14:-6,v.c('--ink-3'));
    }

    const cols=[v.c('--accent'),v.c('--second')];
    for(let i=0;i<n;i++){
      const b=s.b[i], [bx,by]=P(b.x), [sx,sy]=P(b.x0);
      // начальная точка
      ctx.strokeStyle=v.c('--line'); ctx.lineWidth=v.lw(1); ctx.setLineDash([v.lw(3),v.lw(3)]);
      ctx.beginPath();
      if(vert){ ctx.moveTo(-1.2,sy); ctx.lineTo(1.2,sy); } else { ctx.moveTo(sx,-1.2); ctx.lineTo(sx,1.2); }
      ctx.stroke(); ctx.setLineDash([]);
      // перемещение (от x0 до x)
      ctx.strokeStyle=cols[i]; ctx.globalAlpha=.35; ctx.lineWidth=v.lw(5);
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(bx,by); ctx.stroke(); ctx.globalAlpha=1;
      // тело
      const off=vert?(i?0.9:-0.9):(i?-0.9:0.9);
      const [cx,cy]=vert?[off,by]:[bx,off];
      ctx.fillStyle=cols[i]; ctx.beginPath(); ctx.arc(cx,cy,v.lw(7),0,7); ctx.fill();
      ctx.strokeStyle=cols[i]; ctx.lineWidth=v.lw(1); ctx.setLineDash([v.lw(2),v.lw(2)]);
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(bx,by); ctx.stroke(); ctx.setLineDash([]);
      // вектор скорости
      if(b.started&&Math.abs(b.v)>0.02){
        const e=vert?[off,by+b.v*0.25]:[bx+b.v*0.25,off];
        v.arrow(ctx,cx,cy,e[0],e[1],v.c('--measure'));
      }
      v.label(ctx,n===2?`тело ${i+1}`:'тело',cx,cy,10,-12,cols[i]);
      if(!b.started) v.label(ctx,`старт через ${(b.t0-s.t).toFixed(1)} с`,cx,cy,10,4,v.c('--ink-3'));
    }
    // точка встречи
    if(s.event&&s.event.type==='meet'){
      const [ex,ey]=P(s.event.x);
      ctx.strokeStyle=v.c('--measure'); ctx.lineWidth=v.lw(1.6);
      ctx.beginPath(); ctx.arc(ex,ey,v.lw(11),0,7); ctx.stroke();
      v.label(ctx,`встреча: t=${s.event.t.toFixed(2)} с, x=${s.event.x.toFixed(2)} м`,ex,ey,14,-16,v.c('--measure'));
    }
  }
},

/* ---------------- ДВУМЕРНОЕ ДВИЖЕНИЕ: движение снаряда ---------------- */
proj2d:{
  title:'Баллистика: движение снаряда',
  params:[
    {key:'bodies',label:'Система',type:'select',default:'1',
     options:[{v:'1',t:'Одно тело'},{v:'2',t:'Два тела'}]},

    {type:'group',label:'Тело 1'},
    {key:'x01',label:'Начальная координата x₀',unit:'м',  min:-1000,max:1000,step:0.5,default:0},
    {key:'y01',label:'Начальная высота y₀',    unit:'м',  min:0,    max:1000,step:0.5,default:0},
    {key:'v01',label:'Начальная скорость v₀',  unit:'м/с',min:0,    max:400, step:0.5,default:25},
    {key:'a01',label:'Угол броска θ',          unit:'°',  min:0,    max:360, step:1,  default:45},

    {type:'group',label:'Тело 2'},
    {key:'x02',  label:'Начальная координата x₀',unit:'м',  min:-1000,max:1000,step:0.5,default:40},
    {key:'y02',  label:'Начальная высота y₀',    unit:'м',  min:0,    max:1000,step:0.5,default:25},
    {key:'v02',  label:'Начальная скорость v₀',  unit:'м/с',min:0,    max:400, step:0.5,default:0},
    {key:'a02',  label:'Угол броска θ',          unit:'°',  min:0,    max:360, step:1,  default:0},
    {key:'delay',label:'Задержка старта Δt',     unit:'с',  min:0,    max:60,  step:0.1,default:0},

    {type:'group',label:'Общее'},
    {key:'ay',  label:'Ускорение вдоль оси y (равно −g)',unit:'м/с²',min:-50,max:50,step:0.1,default:-9.8},
    {key:'comp',  label:'Проекции скорости vx и vy',type:'check',default:true},
    {key:'guides',label:'Высшая точка и дальность (тело 1)',type:'check',default:true},
    {key:'trail', label:'Траектории',type:'check',default:true},

    {type:'group',label:'Остановка таймера'},
    {key:'tStop',   label:'Остановить в момент t (0 — не останавливать)',unit:'с',min:0,max:600,step:0.1,default:0},
    {key:'stopLand',label:'Останавливать при падении на землю',type:'check',default:true},
    {key:'stopHit', label:'Останавливать при встрече тел (попадание)',type:'check',default:true},
    {key:'hitR',    label:'Радиус попадания',unit:'м',min:0.1,max:20,step:0.1,default:0.6}
  ],

  presets:[
    {name:'Классический бросок: v₀ = 25, θ = 45°',
     values:{bodies:'1',x01:0,y01:0,v01:25,a01:45,ay:-9.8,stopLand:true,tStop:0}},
    {name:'Два угла — одна дальность (30° и 60°)',
     values:{bodies:'2',x01:0,y01:0,v01:25,a01:30,x02:0,y02:0,v02:25,a02:60,delay:0,
             ay:-9.8,stopLand:false,stopHit:false,tStop:0}},
    {name:'«Попади в обезьяну» (цель 40 м, 25 м)',
     values:{bodies:'2',x01:0,y01:0,v01:35,a01:32,x02:40,y02:25,v02:0,a02:0,delay:0,
             ay:-9.8,stopHit:true,hitR:0.6,stopLand:true,tStop:0}},
    {name:'Горизонтальный бросок с высоты 45 м',
     values:{bodies:'1',x01:0,y01:45,v01:15,a01:0,ay:-9.8,stopLand:true,tStop:0}},
    {name:'Без тяготения: ускорение по y = 0',
     values:{bodies:'1',x01:0,y01:0,v01:25,a01:45,ay:0,stopLand:false,tStop:8}}
  ],
  /* параметры тела i (0/1) */
  bodyP(p,i){ return i? {x0:p.x02,y0:p.y02,v0:p.v02,ang:p.a02,t0:p.delay}
                      : {x0:p.x01,y0:p.y01,v0:p.v01,ang:p.a01,t0:0}; },
  /* точное положение тела i в момент t (с посадкой на землю y = 0) */
  posOf(p,i,t){
    const b=this.bodyP(p,i), tau=t-b.t0, a=p.ay;
    const th=b.ang*Math.PI/180, vx=b.v0*Math.cos(th), vy0=b.v0*Math.sin(th);
    const tf=fallTime(b.y0,vy0,a);                       // время до земли (может быть ∞)
    if(tau<=0) return {x:b.x0,y:b.y0,vx:0,vy:0,started:false,landed:false,tf,tLand:b.t0+tf};
    const tt=Math.min(tau,tf);
    const landed=tau>=tf;
    return {x:b.x0+vx*tt, y:Math.max(0,b.y0+vy0*tt+0.5*a*tt*tt),
            vx:landed?0:vx, vy:landed?0:(vy0+a*tt),
            started:true, landed, tf, tLand:b.t0+tf};
  },
  dist(p,t){ const A=this.posOf(p,0,t), B=this.posOf(p,1,t); return Math.hypot(A.x-B.x,A.y-B.y); },

  init(p){
    const A=this.posOf(p,0,0), B=this.posOf(p,1,0);
    return {t:0, trails:[[[A.x,A.y]],[[B.x,B.y]]], hmax:[A.y,B.y],
            landed:[false,false], event:null, __stop:null};
  },
  put(s,p,t,n){
    s.t=t;
    for(let i=0;i<n;i++){
      const r=this.posOf(p,i,t);
      if(r.y>s.hmax[i]) s.hmax[i]=r.y;
      const tr=s.trails[i], l=tr[tr.length-1];
      if(r.started && (!l || Math.hypot(r.x-l[0],r.y-l[1])>0.02)) tr.push([r.x,r.y]);
      if(tr.length>6000) tr.shift();
    }
  },
  step(s,dt,p){
    if(s.event) return;
    const n=(p.bodies==='2')?2:1, t=s.t+dt;

    if(p.tStop>0&&t>=p.tStop&&!(s.done&&s.done.time)){ this.put(s,p,p.tStop,n);
      s.event={t:p.tStop,type:'time'}; s.__stop=`Остановка по времени: t = ${p.tStop.toFixed(2)} с`; return; }

    // встреча (попадание) двух тел: |r₁ − r₂| ≤ радиуса попадания
    if(n===2 && p.stopHit){
      const d0=this.dist(p,s.t), d1=this.dist(p,t);
      if(d1<=p.hitR && d0>p.hitR){
        let lo=s.t, hi=t;
        for(let k=0;k<50;k++){ const m=(lo+hi)/2; if(this.dist(p,m)<=p.hitR) hi=m; else lo=m; }
        this.put(s,p,hi,n);
        const A=this.posOf(p,0,hi);
        s.event={t:hi,type:'hit',x:A.x,y:A.y};
        s.__stop=`Встреча тел: t = ${hi.toFixed(3)} с, точка (${A.x.toFixed(2)}; ${A.y.toFixed(2)}) м`;
        return;
      }
    }

    // падение на землю
    for(let i=0;i<n;i++){
      const r=this.posOf(p,i,t);
      if(r.started && r.landed && !s.landed[i]){
        s.landed[i]=true;
        const tl=r.tLand;
        this.put(s,p,Math.min(t,tl),n);
        if(p.stopLand){
          const L=this.posOf(p,i,tl);
          s.event={t:tl,type:'land',x:L.x,y:0,i};
          s.__stop=`Тело ${i+1} упало: t = ${tl.toFixed(3)} с, x = ${L.x.toFixed(2)} м`;
          return;
        }
      }
    }
    this.put(s,p,t,n);
  },

  anchors(s,p){
    const n=(p.bodies==='2')?2:1, out=[{x:0,y:0}];
    for(let i=0;i<n;i++){
      const b=this.bodyP(p,i), r=this.posOf(p,i,s.t);
      const th=b.ang*Math.PI/180, vx=b.v0*Math.cos(th), vy0=b.v0*Math.sin(th);
      out.push({x:b.x0,y:b.y0},{x:r.x,y:r.y});
      if(vy0>0&&p.ay<0) out.push({x:b.x0-vx*vy0/p.ay, y:b.y0-vy0*vy0/(2*p.ay)});   // высшая точка
      out.push({x:this.posOf(p,i,r.tLand).x, y:0});                       // точка падения
    }
    if(s.event&&s.event.type==='hit') out.push({x:s.event.x,y:s.event.y});
    return out;
  },
  readouts(s,p){
    const n=(p.bodies==='2')?2:1, out=[['t',s.t,'с']];
    for(let i=0;i<n;i++){
      const r=this.posOf(p,i,s.t), tag=n===2?` ${i+1}`:'';
      const v=Math.hypot(r.vx,r.vy);
      const ang=v>1e-6?(Math.atan2(r.vy,r.vx)*180/Math.PI+360)%360:0;
      out.push([`x${tag}`,r.x,'м'],[`y${tag}`,r.y,'м'],[`v${tag}`,v,'м/с'],
               [`vx${tag}`,r.vx,'м/с'],[`vy${tag}`,r.vy,'м/с'],[`угол v${tag}`,ang,'°'],
               [`H max${tag}`,s.hmax[i],'м'],
               [`t полёта${tag}`,r.tLand,
                 isFinite(r.tLand)?'с':'не приземлится: ускорение направлено вверх']);
    }
    if(n===2) out.push(['расстояние',this.dist(p,s.t),'м']);
    return out;
  },
  graphs:[
    {label:'y(t) — высота', unit:'м', get(s,p){ const t=s.t;
      return [SIMS.proj2d.posOf(p,0,t).y, p.bodies==='2'?SIMS.proj2d.posOf(p,1,t).y:null]; }},
    {label:'x(t) — дальность', unit:'м', get(s,p){ const t=s.t;
      return [SIMS.proj2d.posOf(p,0,t).x, p.bodies==='2'?SIMS.proj2d.posOf(p,1,t).x:null]; }},
    {label:'v<sub>x</sub>(t) — горизонтальная проекция', unit:'м/с', get(s,p){ const t=s.t;
      return [SIMS.proj2d.posOf(p,0,t).vx, p.bodies==='2'?SIMS.proj2d.posOf(p,1,t).vx:null]; }},
    {label:'v<sub>y</sub>(t) — вертикальная проекция', unit:'м/с', get(s,p){ const t=s.t;
      return [SIMS.proj2d.posOf(p,0,t).vy, p.bodies==='2'?SIMS.proj2d.posOf(p,1,t).vy:null]; }}
  ],
  fit(p,vp){
    const n=(p.bodies==='2')?2:1;
    let T=p.tStop>0?p.tStop:0;
    for(let i=0;i<n;i++){ const tl=this.posOf(p,i,0).tLand; if(isFinite(tl)) T=Math.max(T,tl); }
    T=clamp(T||8,0.5,120);
    let x0=0,x1=0,y1=1;
    for(let i=0;i<n;i++) for(let k=0;k<=80;k++){
      const r=this.posOf(p,i,T*k/80);
      x0=Math.min(x0,r.x); x1=Math.max(x1,r.x); y1=Math.max(y1,r.y);
    }
    const spanX=Math.max(x1-x0,2)*1.2, spanY=Math.max(y1,2)*1.35;
    const W=(vp&&vp.W)||460, H=(vp&&vp.H)||320;
    const scale=clamp(Math.min((W-60)/(spanX*PX_PER_M),(H-50)/(spanY*PX_PER_M)),0.002,30);
    return {x:(x0+x1)/2, y:y1*0.42, scale};
  },
  draw(ctx,s,v,p){
    const n=(p.bodies==='2')?2:1;
    const cols=[v.c('--accent'),v.c('--second')];
    let T=0; for(let i=0;i<n;i++){ const tl=this.posOf(p,i,0).tLand; if(isFinite(tl)) T=Math.max(T,tl); }
    if(!T) T=Math.max(s.t,8);
    const span=Math.max(Math.abs(this.posOf(p,0,T).x-p.x01),20);

    // земля и оси координат
    ctx.strokeStyle=v.c('--ink-2'); ctx.lineWidth=v.lw(2);
    ctx.beginPath(); ctx.moveTo(-span*0.35,0); ctx.lineTo(span*1.35,0); ctx.stroke();
    ctx.strokeStyle=v.c('--ink-3'); ctx.lineWidth=v.lw(1);
    for(let k=-span*0.35;k<span*1.35;k+=Math.max(span/45,0.4)){
      const d=Math.max(span/80,0.25);
      ctx.beginPath(); ctx.moveTo(k,0); ctx.lineTo(k-d,-d); ctx.stroke();
    }
    const H=Math.max(...s.hmax.slice(0,n),span*0.3);
    v.arrow(ctx,0,0,span*1.3,0,v.c('--ink-3'));          // ось X
    v.arrow(ctx,0,0,0,H*1.25,v.c('--ink-3'));            // ось Y
    v.label(ctx,'x, м',span*1.3,0,6,14,v.c('--ink-3'));
    v.label(ctx,'y, м',0,H*1.25,8,-6,v.c('--ink-3'));

    for(let i=0;i<n;i++){
      const b=this.bodyP(p,i), r=this.posOf(p,i,s.t);
      const th=b.ang*Math.PI/180, vx0=b.v0*Math.cos(th), vy0=b.v0*Math.sin(th);
      // траектория
      if(p.trail&&v.quality!=='low'&&s.trails[i].length>1){
        ctx.strokeStyle=cols[i]; ctx.lineWidth=v.lw(1.8); ctx.beginPath();
        s.trails[i].forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.stroke();
      }
      // старт: высота и угол
      if(b.y0>0){
        ctx.strokeStyle=v.c('--line'); ctx.lineWidth=v.lw(1); ctx.setLineDash([v.lw(4),v.lw(4)]);
        ctx.beginPath(); ctx.moveTo(b.x0,0); ctx.lineTo(b.x0,b.y0); ctx.stroke(); ctx.setLineDash([]);
        v.label(ctx,`y₀ = ${b.y0} м`,b.x0,b.y0/2,6,0,v.c('--ink-3'));
      }
      if(b.v0>0){
        const rr=Math.max(span*0.07,0.8);
        ctx.strokeStyle=cols[i]; ctx.lineWidth=v.lw(1.3); ctx.globalAlpha=.8;
        ctx.beginPath(); ctx.arc(b.x0,b.y0,rr,0,th,th<0); ctx.stroke(); ctx.globalAlpha=1;
        v.label(ctx,`θ${n===2?(i+1):''} = ${b.ang}°`,
          b.x0+rr*1.1*Math.cos(th/2), b.y0+rr*1.1*Math.sin(th/2), 6,-4, cols[i]);
      }
      // высшая точка и дальность (для тела 1)
      if(p.guides&&i===0&&vy0>0&&p.ay<0){
        const ax=b.x0-vx0*vy0/p.ay, ay=b.y0-vy0*vy0/(2*p.ay), lx=this.posOf(p,0,r.tLand).x;
        ctx.strokeStyle=v.c('--line'); ctx.lineWidth=v.lw(1); ctx.setLineDash([v.lw(4),v.lw(4)]);
        ctx.beginPath(); ctx.moveTo(ax,0); ctx.lineTo(ax,ay); ctx.moveTo(0,ay); ctx.lineTo(ax,ay); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle=v.c('--measure'); ctx.beginPath(); ctx.arc(ax,ay,v.lw(3.5),0,7); ctx.fill();
        v.label(ctx,`H = ${ay.toFixed(2)} м`,ax,ay,8,-10,v.c('--measure'));
        const yy=-Math.max(H*0.1,0.6);
        v.arrow(ctx,b.x0,yy,lx,yy,v.c('--measure'));
        v.label(ctx,`L = ${(lx-b.x0).toFixed(2)} м`,(b.x0+lx)/2,yy,-24,14,v.c('--measure'));
      }
      // векторы скорости
      const k=Math.max(span/(Math.max(b.v0,1)*6),0.04);
      if(r.started&&!r.landed){
        if(p.comp&&(Math.abs(r.vx)+Math.abs(r.vy))>0.05){
          v.arrow(ctx,r.x,r.y,r.x+r.vx*k,r.y,cols[i]);
          v.arrow(ctx,r.x,r.y,r.x,r.y+r.vy*k,cols[i]);
          ctx.strokeStyle=v.c('--line'); ctx.lineWidth=v.lw(1); ctx.setLineDash([v.lw(3),v.lw(3)]);
          ctx.beginPath(); ctx.moveTo(r.x+r.vx*k,r.y); ctx.lineTo(r.x+r.vx*k,r.y+r.vy*k);
          ctx.lineTo(r.x,r.y+r.vy*k); ctx.stroke(); ctx.setLineDash([]);
          v.label(ctx,`vx = ${r.vx.toFixed(1)}`,r.x+r.vx*k,r.y,4,14,cols[i]);
          v.label(ctx,`vy = ${r.vy.toFixed(1)}`,r.x,r.y+r.vy*k,8,-4,cols[i]);
        }
        v.arrow(ctx,r.x,r.y,r.x+r.vx*k,r.y+r.vy*k,v.c('--measure'));
        v.label(ctx,`v = ${Math.hypot(r.vx,r.vy).toFixed(1)} м/с`,r.x+r.vx*k,r.y+r.vy*k,8,-10,v.c('--measure'));
      }
      ctx.fillStyle=cols[i]; ctx.beginPath(); ctx.arc(r.x,r.y,v.lw(6),0,7); ctx.fill();
      if(n===2) v.label(ctx,`тело ${i+1}`,r.x,r.y,10,-12,cols[i]);
    }
    // событие
    if(s.event&&(s.event.type==='hit'||s.event.type==='land')){
      ctx.strokeStyle=v.c('--measure'); ctx.lineWidth=v.lw(1.8);
      ctx.beginPath(); ctx.arc(s.event.x,s.event.y||0,v.lw(11),0,7); ctx.stroke();
      if(s.event.type==='hit')
        v.label(ctx,`попадание: t = ${s.event.t.toFixed(2)} с`,s.event.x,s.event.y,14,-16,v.c('--measure'));
    }
  }
}
,

/* ---------------- ПЕРЕПРАВА ЧЕРЕЗ РЕКУ: СЛОЖЕНИЕ СКОРОСТЕЙ ---------------- */
river:{
  title:'Переправа через реку: снос',
  params:[
    {type:'group',label:'Река'},
    {key:'d',  label:'Ширина реки d',        unit:'м',  min:5,  max:2000,step:1,  default:200},
    {key:'u',  label:'Скорость течения u',   unit:'м/с',min:0,  max:20,  step:0.1,default:2},
    {type:'group',label:'Лодка'},
    {key:'vb', label:'Скорость лодки (отн. воды) v',unit:'м/с',min:0.1,max:30,step:0.1,default:4},
    {key:'ang',label:'Угол носа θ (от оси x)',unit:'°', min:0,  max:360, step:1,  default:90},
    {type:'group',label:'Показывать'},
    {key:'comp', label:'Параллелограмм скоростей',type:'check',default:true},
    {key:'trail',label:'Траекторию',type:'check',default:true},
    {type:'group',label:'Остановка таймера'},
    {key:'stopBank',label:'Останавливать у берега',type:'check',default:true},
    {key:'tStop',   label:'Остановить в момент t (0 — не останавливать)',unit:'с',min:0,max:6000,step:0.5,default:0}
  ],
  presets:[
    {name:'Нос строго поперёк: минимальное время',
     values:{d:200,u:2,vb:4,ang:90,stopBank:true,tStop:0}},
    {name:'Переправа без сноса (θ = arccos(−u/v))',
     values:{d:200,u:2,vb:4,ang:120,stopBank:true,tStop:0}},
    {name:'Течение сильнее лодки: снос неизбежен',
     values:{d:200,u:6,vb:3,ang:90,stopBank:true,tStop:0}}
  ],
  warn(p){
    const th=p.ang*Math.PI/180;
    if(p.vb*Math.sin(th)<=0) return 'При таком угле лодка не идёт к противоположному берегу: поперечная проекция скорости ≤ 0.';
    if(p.vb<=p.u) return 'Скорость лодки не больше скорости течения: переправа без сноса невозможна ни при каком угле.';
    return null;
  },
  vel(p){
    const th=p.ang*Math.PI/180;
    const bx=p.vb*Math.cos(th), by=p.vb*Math.sin(th);
    return {bx,by, vx:bx+p.u, vy:by};                     // v_берег = v_лодки + v_течения
  },
  tCross(p){ const {vy}=this.vel(p); return vy>1e-9 ? p.d/vy : Infinity; },
  init(p){ return {t:0,x:0,y:0,trail:[[0,0]],event:null,__stop:null}; },
  put(s,p,t){
    const V=this.vel(p);
    s.t=t; s.x=V.vx*t; s.y=clamp(V.vy*t,0,p.d);
    const l=s.trail[s.trail.length-1];
    if(Math.hypot(s.x-l[0],s.y-l[1])>p.d/400) s.trail.push([s.x,s.y]);
  },
  step(s,dt,p){
    if(s.event) return;
    const t=s.t+dt, V=this.vel(p);
    if(p.tStop>0&&t>=p.tStop&&!(s.done&&s.done.time)){ this.put(s,p,p.tStop);
      s.event={t:p.tStop,type:'time'}; s.__stop=`Остановка по времени: t = ${p.tStop.toFixed(2)} с`; return; }
    const tc=this.tCross(p);
    if(p.stopBank && V.vy>0 && t>=tc){
      this.put(s,p,tc); s.y=p.d;
      s.event={t:tc,type:'cross',x:s.x,y:p.d};
      s.__stop=`Переправа: t = ${tc.toFixed(2)} с, снос Δx = ${s.x.toFixed(2)} м`;
      return;
    }
    if(p.stopBank && V.vy<0 && t*Math.abs(V.vy)>=0 && s.y<=0 && t>0.05){
      this.put(s,p,t); s.y=0;
      s.event={t,type:'back',x:s.x,y:0};
      s.__stop=`Лодка вернулась к своему берегу: t = ${t.toFixed(2)} с`; return;
    }
    this.put(s,p,t);
  },
  anchors(s,p){
    const V=this.vel(p), tc=this.tCross(p);
    const out=[{x:0,y:0},{x:s.x,y:s.y},{x:0,y:p.d}];
    if(isFinite(tc)) out.push({x:V.vx*tc,y:p.d});
    return out;
  },
  readouts(s,p){
    const V=this.vel(p), tc=this.tCross(p);
    const vres=Math.hypot(V.vx,V.vy);
    const ang=vres>1e-9?(Math.atan2(V.vy,V.vx)*180/Math.PI+360)%360:0;
    const need=(p.vb>p.u)?Math.acos(-p.u/p.vb)*180/Math.PI:NaN;   // cosθ = −u/v
    return [['t',s.t,'с'],
            ['v лодки',p.vb,'м/с'],['течение u',p.u,'м/с'],
            ['v результ.',vres,'м/с'],['угол v',ang,'°'],
            ['vx',V.vx,'м/с'],['vy',V.vy,'м/с'],
            ['x (снос)',s.x,'м'],['y',s.y,'м'],
            ['ширина d',p.d,'м'],
            ['t переправы',tc,isFinite(tc)?'с':'лодка идёт вдоль берега и не переправится'],
            ['снос итог',isFinite(tc)?V.vx*tc:NaN,isFinite(tc)?'м':'переправы нет — сносить нечего'],
            ['θ без сноса',need,isFinite(need)?'°':'течение быстрее лодки — снос не убрать']];
  },
  graphs:[
    {label:'x(t) — снос вдоль течения', unit:'м', series:['лодка'], get:s=>[s.x,null]},
    {label:'y(t) — продвижение поперёк', unit:'м', series:['лодка'], get:s=>[s.y,null]}
  ],
  fit(p,vp){
    const V=this.vel(p), tc=this.tCross(p);
    const X=isFinite(tc)?V.vx*tc:V.vx*20;
    const x0=Math.min(0,X)-p.d*0.1, x1=Math.max(0,X)+p.d*0.1;
    const spanX=Math.max(x1-x0,p.d*0.6), spanY=p.d*1.3;
    const W=(vp&&vp.W)||460, H=(vp&&vp.H)||320;
    const scale=clamp(Math.min((W-60)/(spanX*PX_PER_M),(H-50)/(spanY*PX_PER_M)),0.002,30);
    return {x:(x0+x1)/2, y:p.d/2, scale};
  },
  draw(ctx,s,v,p){
    const V=this.vel(p), tc=this.tCross(p);
    const X=isFinite(tc)?V.vx*tc:V.vx*20;
    const L=Math.max(Math.abs(X),p.d)*1.5;
    // вода и берега
    ctx.fillStyle=v.c('--accent-soft'); ctx.fillRect(-L,0,3*L,p.d);
    ctx.strokeStyle=v.c('--ink-2'); ctx.lineWidth=v.lw(2);
    ctx.beginPath(); ctx.moveTo(-L,0); ctx.lineTo(2*L,0); ctx.moveTo(-L,p.d); ctx.lineTo(2*L,p.d); ctx.stroke();
    v.label(ctx,'свой берег',-L*0.35,0,0,16,v.c('--ink-3'));
    v.label(ctx,'противоположный берег',-L*0.35,p.d,0,-14,v.c('--ink-3'));
    // стрелки течения
    for(let k=1;k<=3;k++){
      const yy=p.d*k/4;
      if(p.u>0) v.arrow(ctx,-L*0.3,yy,-L*0.3+p.d*0.18,yy,v.c('--ink-3'));
    }
    v.label(ctx,`u = ${p.u} м/с`,-L*0.3,p.d/2,0,-14,v.c('--ink-3'));
    // ширина
    ctx.strokeStyle=v.c('--line'); ctx.lineWidth=v.lw(1); ctx.setLineDash([v.lw(4),v.lw(4)]);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,p.d); ctx.stroke(); ctx.setLineDash([]);
    v.label(ctx,`d = ${p.d} м`,0,p.d/2,-58,0,v.c('--ink-3'));
    // траектория и снос
    if(p.trail&&s.trail.length>1){
      ctx.strokeStyle=v.c('--accent'); ctx.lineWidth=v.lw(1.8); ctx.beginPath();
      s.trail.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.stroke();
    }
    if(isFinite(tc)){
      ctx.strokeStyle=v.c('--line'); ctx.lineWidth=v.lw(1); ctx.setLineDash([v.lw(4),v.lw(4)]);
      ctx.beginPath(); ctx.moveTo(0,p.d); ctx.lineTo(X,p.d); ctx.stroke(); ctx.setLineDash([]);
      v.arrow(ctx,0,p.d*1.12,X,p.d*1.12,v.c('--measure'));
      v.label(ctx,`снос Δx = ${X.toFixed(1)} м`,X/2,p.d*1.12,-30,-12,v.c('--measure'));
    }
    // параллелограмм скоростей
    const k=Math.max(p.d/(Math.max(p.vb+p.u,1)*4),0.05);
    if(p.comp){
      ctx.strokeStyle=v.c('--line'); ctx.lineWidth=v.lw(1); ctx.setLineDash([v.lw(3),v.lw(3)]);
      ctx.beginPath();
      ctx.moveTo(s.x+V.bx*k,s.y+V.by*k); ctx.lineTo(s.x+V.vx*k,s.y+V.vy*k);
      ctx.lineTo(s.x+p.u*k,s.y); ctx.stroke(); ctx.setLineDash([]);
      v.arrow(ctx,s.x,s.y,s.x+V.bx*k,s.y+V.by*k,v.c('--second'));
      v.label(ctx,`v = ${p.vb} м/с`,s.x+V.bx*k,s.y+V.by*k,6,-10,v.c('--second'));
      v.arrow(ctx,s.x,s.y,s.x+p.u*k,s.y,v.c('--ink-3'));
      v.label(ctx,`u`,s.x+p.u*k,s.y,6,12,v.c('--ink-3'));
    }
    v.arrow(ctx,s.x,s.y,s.x+V.vx*k,s.y+V.vy*k,v.c('--measure'));
    v.label(ctx,`v рез = ${Math.hypot(V.vx,V.vy).toFixed(2)} м/с`,s.x+V.vx*k,s.y+V.vy*k,8,-10,v.c('--measure'));
    // угол носа
    const rr=p.d*0.09;
    ctx.strokeStyle=v.c('--second'); ctx.lineWidth=v.lw(1.3);
    ctx.beginPath(); ctx.arc(s.x,s.y,rr,0,p.ang*Math.PI/180); ctx.stroke();
    v.label(ctx,`θ = ${p.ang}°`,s.x+rr,s.y+rr*0.4,8,0,v.c('--second'));
    // лодка
    ctx.fillStyle=v.c('--accent'); ctx.beginPath(); ctx.arc(s.x,s.y,v.lw(6),0,7); ctx.fill();
  }
},

/* ---------------- РАВНОМЕРНОЕ ДВИЖЕНИЕ ПО ОКРУЖНОСТИ ---------------- */
circular:{
  title:'Равномерное движение по окружности',
  params:[
    {key:'mode',label:'Задавать движение',type:'select',default:'v',
     options:[{v:'v',t:'через скорость v'},{v:'T',t:'через период T'}]},
    /* Верхние пределы подняты так, чтобы помещались и планетные масштабы
       (пример «Экватор Земли»). Ползунка нет — только числовое поле с шагом,
       поэтому широкий диапазон не мешает точной установке обычных значений. */
    {key:'R',  label:'Радиус R',   unit:'м',  min:0.2,max:1e7,  step:0.1,default:5},
    {key:'v',  label:'Скорость v', unit:'м/с',min:0.1,max:1000, step:0.1,default:10},
    {key:'T',  label:'Период T',   unit:'с',  min:0.1,max:1e5,  step:0.1,default:3.14},
    {key:'dir',label:'Направление',type:'select',default:'ccw',
     options:[{v:'ccw',t:'против часовой'},{v:'cw',t:'по часовой'}]},
    {type:'group',label:'Показывать'},
    {key:'showA',label:'Центростремительное ускорение',type:'check',default:true},
    {key:'showR',label:'Радиус-вектор и угол',type:'check',default:true},
    {key:'trail',label:'След',type:'check',default:true},
    {type:'group',label:'Остановка таймера'},
    {key:'turns',label:'Остановить через N оборотов (0 — не останавливать)',min:0,max:100,step:0.25,default:0},
    {key:'tStop',label:'Остановить в момент t (0 — не останавливать)',unit:'с',min:0,max:6000,step:0.1,default:0}
  ],
  presets:[
    {name:'Экватор Земли (ускорение ≈ 0,034 м/с²)',
     values:{mode:'T',R:6.37e6,T:8.64e4,v:463,dir:'ccw',turns:0,tStop:0}},
    {name:'Карусель: R = 5 м, v = 10 м/с',
     values:{mode:'v',R:5,v:10,dir:'ccw',turns:0,tStop:0}},
    {name:'Один оборот и стоп',
     values:{mode:'v',R:5,v:10,dir:'ccw',turns:1,tStop:0}}
  ],
  kin(p){                                   // согласованные v, T, ω, a_c
    const v = p.mode==='v' ? p.v : 2*Math.PI*p.R/p.T;
    const T = 2*Math.PI*p.R/Math.max(v,1e-9);
    return {v, T, w:v/p.R, ac:v*v/p.R, sgn:p.dir==='cw'?-1:1};
  },
  init(p){ return {t:0,phi:0,trail:[],event:null,__stop:null}; },
  put(s,p,t){
    const K=this.kin(p);
    s.t=t; s.phi=K.sgn*K.w*t;
    if(p.trail){ s.trail.push([p.R*Math.cos(s.phi),p.R*Math.sin(s.phi)]);
      if(s.trail.length>4000) s.trail.shift(); }
  },
  step(s,dt,p){
    if(s.event) return;
    const K=this.kin(p), t=s.t+dt;
    if(p.tStop>0&&t>=p.tStop&&!(s.done&&s.done.time)){ this.put(s,p,p.tStop);
      s.event={t:p.tStop,type:'time'}; s.__stop=`Остановка по времени: t = ${p.tStop.toFixed(2)} с`; return; }
    if(p.turns>0){
      const te=p.turns*K.T;
      if(t>=te&&!(s.done&&s.done.turns)){ this.put(s,p,te);
        s.event={t:te,type:'turns'};
        s.__stop=`Пройдено ${p.turns} оборот(а): t = ${te.toFixed(3)} с`; return; }
    }
    this.put(s,p,t);
  },
  pos(s,p){
    const K=this.kin(p);
    const x=p.R*Math.cos(s.phi), y=p.R*Math.sin(s.phi);
    const vx=-K.sgn*K.v*Math.sin(s.phi), vy=K.sgn*K.v*Math.cos(s.phi);
    const ax=-K.ac*Math.cos(s.phi), ay=-K.ac*Math.sin(s.phi);
    return {x,y,vx,vy,ax,ay,K};
  },
  anchors(s,p){
    const r=this.pos(s,p);
    return [{x:0,y:0},{x:r.x,y:r.y},{x:p.R,y:0},{x:-p.R,y:0},{x:0,y:p.R},{x:0,y:-p.R}];
  },
  readouts(s,p){
    const r=this.pos(s,p), K=r.K;
    return [['t',s.t,'с'],['R',p.R,'м'],['v',K.v,'м/с'],['период T',K.T,'с'],
            ['частота ν',1/K.T,'Гц'],['ω',K.w,'рад/с'],['aц = v²/R',K.ac,'м/с²'],
            ['угол φ',(s.phi*180/Math.PI)%360,'°'],['обороты',s.t/K.T,''],
            ['x',r.x,'м'],['y',r.y,'м'],['vx',r.vx,'м/с'],['vy',r.vy,'м/с']];
  },
  graphs:[
    {label:'x(t) и y(t) — координаты',unit:'м',series:['x','y'],
     get(s,p){ const r=SIMS.circular.pos(s,p); return [r.x,r.y]; }},
    {label:'v<sub>x</sub>(t) и v<sub>y</sub>(t) — проекции скорости',unit:'м/с',series:['vx','vy'],
     get(s,p){ const r=SIMS.circular.pos(s,p); return [r.vx,r.vy]; }},
    {label:'a<sub>x</sub>(t) и a<sub>y</sub>(t) — проекции ускорения',unit:'м/с²',series:['ax','ay'],
     get(s,p){ const r=SIMS.circular.pos(s,p); return [r.ax,r.ay]; }}
  ],
  fit(p,vp){
    const W=(vp&&vp.W)||460, H=(vp&&vp.H)||320;
    const scale=clamp(Math.min((W-70)/(2.6*p.R*PX_PER_M),(H-50)/(2.6*p.R*PX_PER_M)),0.002,30);
    return {x:0,y:0,scale};
  },
  draw(ctx,s,p1,p){
    const v=p1, r=this.pos(s,p), K=r.K;
    // окружность
    ctx.strokeStyle=v.c('--line'); ctx.lineWidth=v.lw(1.4);
    ctx.beginPath(); ctx.arc(0,0,p.R,0,7); ctx.stroke();
    // центр
    ctx.fillStyle=v.c('--ink-3'); ctx.beginPath(); ctx.arc(0,0,v.lw(3),0,7); ctx.fill();
    v.label(ctx,'O',0,0,-14,10,v.c('--ink-3'));
    // след
    if(p.trail&&s.trail.length>1&&v.quality!=='low'){
      ctx.strokeStyle=v.c('--accent'); ctx.globalAlpha=.55; ctx.lineWidth=v.lw(2.4);
      ctx.beginPath(); s.trail.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));
      ctx.stroke(); ctx.globalAlpha=1;
    }
    // радиус и угол
    if(p.showR){
      ctx.strokeStyle=v.c('--ink-3'); ctx.lineWidth=v.lw(1.2); ctx.setLineDash([v.lw(4),v.lw(4)]);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(r.x,r.y); ctx.stroke(); ctx.setLineDash([]);
      v.label(ctx,`R = ${p.R} м`,r.x/2,r.y/2,6,-8,v.c('--ink-3'));
      ctx.strokeStyle=v.c('--second'); ctx.lineWidth=v.lw(1.3);
      ctx.beginPath(); ctx.arc(0,0,p.R*0.22,0,s.phi,s.phi<0); ctx.stroke();
      v.label(ctx,`φ = ${((s.phi*180/Math.PI)%360).toFixed(0)}°`,
        p.R*0.28*Math.cos(s.phi/2),p.R*0.28*Math.sin(s.phi/2),6,-4,v.c('--second'));
    }
    // векторы: v — по касательной, a_c — к центру
    const kv=p.R/Math.max(K.v,1e-6)*0.55, ka=p.R/Math.max(K.ac,1e-6)*0.55;
    v.arrow(ctx,r.x,r.y,r.x+r.vx*kv,r.y+r.vy*kv,v.c('--measure'));
    v.label(ctx,`v = ${K.v.toFixed(2)} м/с`,r.x+r.vx*kv,r.y+r.vy*kv,8,-10,v.c('--measure'));
    if(p.showA){
      v.arrow(ctx,r.x,r.y,r.x+r.ax*ka,r.y+r.ay*ka,v.c('--danger'));
      v.label(ctx,`aц = ${K.ac.toFixed(2)} м/с²`,r.x+r.ax*ka*0.9,r.y+r.ay*ka*0.9,8,12,v.c('--danger'));
    }
    // тело
    ctx.fillStyle=v.c('--accent'); ctx.beginPath(); ctx.arc(r.x,r.y,v.lw(7),0,7); ctx.fill();
    v.label(ctx,`T = ${K.T.toFixed(2)} с   ω = ${K.w.toFixed(2)} рад/с`,-p.R,-p.R*1.22,0,0,v.c('--ink-3'));
  }
}
,

newton2:{

    {key:'stopSlip',label:'При срыве / проскальзывании',type:'check',default:true},
    {key:'stopRest',label:'Когда всё остановится',type:'check',default:false},
    {key:'tStop',   label:'В момент t (0 — выкл)',unit:'с',min:0,max:600,step:0.1,default:0}
  ],
  N(p){ return Math.min(3,Math.max(1,p.n|0)); },
  rough(p,i){ return [p.r1,p.r2,p.r3][i]; },
  mass(p,i){ return [p.m1,p.m2,p.m3][i]; },
  half(p,i){ return 0.25+0.12*Math.cbrt(this.mass(p,i)/10); },
  warn(p){
    if(p.mud>p.mus) return 'μd > μs: трение скольжения не может быть больше трения покоя.';
    const al=p.alpha*Math.PI/180;
    if(p.F*Math.sin(al)>=this.mass(p,p.applyTo-1)*p.g && p.F>0)
      return 'Вертикальная составляющая силы больше веса: тело отрывается от поверхности.';
    if(this.N(p)>1){
      const xs=[p.x1,p.x2,p.x3].slice(0,this.N(p));
      for(let i=1;i<xs.length;i++) if(xs[i]<=xs[i-1]) return 'Тела заданы в перекрывающихся координатах: расставьте их по возрастанию x.';
    }
    return null;
  },
  init(p){
    const n=this.N(p);
    const b=[0,1,2].map(i=>({x:[p.x1,p.x2,p.x3][i], v:[p.v1,p.v2,p.v3][i], a:0, fr:0, N:0,
      x0:[p.x1,p.x2,p.x3][i], path:0}));   // x0 — старт, path — пройденный путь
    return {t:0,b,n,hits:0,dE:0,p0:this.mom(p,b,n),slip:false,event:null,__stop:null};
  },
  mom(p,b,n){ let s=0; for(let i=0;i<n;i++) s+=this.mass(p,i)*b[i].v; return s; },
  kin(p,b,n){ let s=0; for(let i=0;i<n;i++) s+=0.5*this.mass(p,i)*b[i].v**2; return s; },

  step(s,dt,p){
    if(s.event) return;
    const t=s.t+dt, n=this.N(p), g=p.g, al=p.alpha*Math.PI/180;
    if(p.tStop>0&&t>=p.tStop&&!(s.done&&s.done.time)){ s.t=p.tStop;
      s.event={t:p.tStop,type:'time'}; s.__stop=`Остановка по времени: t = ${p.tStop.toFixed(2)} с`; return; }
    s.t=t;
    const Fx=p.F*Math.cos(al), Fy=p.F*Math.sin(al);

    {
      /* --- независимые тела на поверхности + удары --- */
      for(let i=0;i<n;i++){
        const b=s.b[i], m=this.mass(p,i);
        const mine=(p.applyTo===i+1);
        const fx=mine?Fx:0, fy=mine?Fy:0;
        const N=Math.max(0,m*g-fy);
        const muS=this.rough(p,i)?p.mus:0, muD=this.rough(p,i)?p.mud:0;
        let fr,a;
        if(Math.abs(b.v)<1e-6){
          if(Math.abs(fx)<=muS*N){ fr=-fx; a=0; }
