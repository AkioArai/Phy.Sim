    {name:'Куб: ровно 45°',values:{w:1,h:1,mu:1.2,ang:40}},
    {name:'Гладкий склон: скользит почти сразу',values:{w:0.8,h:2,mu:0.05,ang:5}},
    {name:'На грани опрокидывания',values:{w:0.8,h:2,mu:1.2,ang:21.8}}
  ],
  fit(p,vp){
    const W=(vp&&vp.W)||460,H=(vp&&vp.H)||320;
    const span=Math.max(6,p.h*2.2);
    const scale=clamp(Math.min((W-60)/(8*PX_PER_M),(H-60)/(span*PX_PER_M)),0.002,30);
    return {x:0,y:0.2,scale};
  },
  draw(ctx,s,v,p){
    const acc=v.c('--accent'), meas=v.c('--measure'), dang=v.c('--danger'),
          sec=v.c('--second'), ink=v.c('--ink-2'), ink3=v.c('--ink-3');
    const a=p.ang*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);
    const w=p.w, h=p.h, verd=this.verdict(p);
    // склон
    ctx.save();
    ctx.strokeStyle=ink; ctx.lineWidth=v.lw(2.2);
    ctx.beginPath(); ctx.moveTo(-4.2*ca,-4.2*(-sa)); ctx.lineTo(4.2*ca,4.2*(-sa));
    // штриховка под склоном
    ctx.stroke();
    ctx.strokeStyle=ink3; ctx.globalAlpha=.45; ctx.lineWidth=v.lw(1);
    for(let u=-4;u<=4;u+=0.32){
      const bx=u*ca, by=-u*sa;
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx-0.18,by-0.22); ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.restore();
    // угол наклона
    {
      const rad=1.5;
      ctx.strokeStyle=ink3; ctx.globalAlpha=.6; ctx.lineWidth=v.lw(1.2);
      ctx.beginPath();
      for(let i=0;i<=28;i++){ const t=-a*i/28;
        const x=rad*Math.cos(t), y=rad*Math.sin(t);
        i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
      ctx.stroke(); ctx.globalAlpha=1;
      v.label(ctx,`α = ${p.ang}°`,rad*1.2*Math.cos(-a/2),rad*1.2*Math.sin(-a/2),-14,4,ink3);
    }
    // тело: ставим на склон; сползание сдвигает его вдоль плоскости
    const ux=[ca,-sa], uy=[sa,ca];            // вдоль склона и по нормали
    const slid=s.slide||0;
    const P0=(u,n)=>[(u+slid)*ux[0]+n*uy[0], (u+slid)*ux[1]+n*uy[1]];
    /* ОПРОКИДЫВАНИЕ: всё тело поворачивается вокруг НИЖНЕГО ПРАВОГО ребра.
       Ребро остаётся на месте, остальные углы описывают вокруг него дугу. */
    const piv=P0(w/2,0), phi=s.phi||0, cf=Math.cos(-phi), sf=Math.sin(-phi);
    const P=(u,n)=>{
      const q=P0(u,n), dx=q[0]-piv[0], dy=q[1]-piv[1];
      return [piv[0]+dx*cf-dy*sf, piv[1]+dx*sf+dy*cf];
    };
    const c0=P(-w/2,0), c1=P(w/2,0), c2=P(w/2,h), c3=P(-w/2,h);
    ctx.fillStyle=acc; ctx.globalAlpha=.16;
    ctx.beginPath(); ctx.moveTo(c0[0],c0[1]); ctx.lineTo(c1[0],c1[1]);
    ctx.lineTo(c2[0],c2[1]); ctx.lineTo(c3[0],c3[1]); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle=verd==='стоит'?acc:dang; ctx.lineWidth=v.lw(2.2);
    ctx.beginPath(); ctx.moveTo(c0[0],c0[1]); ctx.lineTo(c1[0],c1[1]);
    ctx.lineTo(c2[0],c2[1]); ctx.lineTo(c3[0],c3[1]); ctx.closePath(); ctx.stroke();
    // ребро, вокруг которого идёт опрокидывание
    if(this.verdict(p)==='опрокидывается'){
      ctx.strokeStyle=dang; ctx.lineWidth=v.lw(2.2);
      ctx.beginPath(); ctx.arc(piv[0],piv[1],0.10,0,7); ctx.stroke();
      v.label(ctx,'ось поворота',piv[0],piv[1],10,20,dang);
    }
    // центр масс
    const cm=P(0,h/2);
    ctx.fillStyle=meas; ctx.beginPath(); ctx.arc(cm[0],cm[1],v.lw(3.4),0,7); ctx.fill();
    v.label(ctx,'центр масс',cm[0],cm[1],10,-6,meas);
    // отвес: где вертикаль из центра масс встречает основание
    if(p.vert){
      ctx.strokeStyle=meas; ctx.globalAlpha=.65; ctx.setLineDash([v.lw(4),v.lw(4)]); ctx.lineWidth=v.lw(1.4);
      ctx.beginPath(); ctx.moveTo(cm[0],cm[1]); ctx.lineTo(cm[0],cm[1]-h*1.15); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
      // точка пересечения отвеса с линией основания
      const t=(cm[0]*uy[1]-cm[1]*uy[0])/(ux[0]*uy[1]-ux[1]*uy[0]);
      const foot=P(t,0);
      const inside=Math.abs(t)<=w/2+1e-9;
      ctx.fillStyle=inside?acc:dang;
      ctx.beginPath(); ctx.arc(foot[0],foot[1],v.lw(3),0,7); ctx.fill();
      v.label(ctx,inside?'отвес внутри основания':'отвес вышел за ребро',
        foot[0],foot[1],-42,20,inside?acc:dang);
    }
    // силы
    if(p.forces){
      const W=p.m*p.g, sc=1.1/Math.max(W,1);
      v.arrow(ctx,cm[0],cm[1],cm[0],cm[1]-W*sc,dang);
      v.label(ctx,'mg',cm[0],cm[1]-W*sc,-16,14,dang);
      const N=W*ca, sh=clamp(this.shift(p),-w/2,w/2);
      const np=P(sh,0);
      v.arrow(ctx,np[0],np[1],np[0]+N*sc*uy[0],np[1]+N*sc*uy[1],acc);
      v.label(ctx,'N',np[0]+N*sc*uy[0],np[1]+N*sc*uy[1],8,-4,acc);
      const F=Math.min(W*sa,p.mu*N);
      if(F>1e-6){
        v.arrow(ctx,c0[0],c0[1],c0[0]+F*sc*ux[0],c0[1]+F*sc*ux[1],sec);
        v.label(ctx,'трение',c0[0]+F*sc*ux[0],c0[1]+F*sc*ux[1],-38,16,sec);
      }
    }
    // итог
    const t=this.tipAngle(p), sl=this.slipAngle(p), yb=-2.9;
    const col=verd==='стоит'?acc:dang;
    v.label(ctx,`опрокидывание при ${t.toFixed(1)}°, скольжение при ${sl.toFixed(1)}°`,-4.6,yb,0,0,ink3);
    v.label(ctx, verd==='стоит' ? `α = ${p.ang}° меньше обоих пределов — тело стоит`
              : (verd==='скользит' ? `α = ${p.ang}° ≥ ${sl.toFixed(1)}° — трения не хватило, тело едет вниз`
                                   : (s.fallen ? `тело опрокинулось через нижнее ребро и легло`
                                               : `α = ${p.ang}° ≥ ${t.toFixed(1)}° — отвес вышел за ребро, тело валится`)),
      -4.6,yb,0,17,col);
    v.label(ctx, sl<t ? 'узкое высокое тело опрокидывается, широкое низкое — скользит: здесь раньше наступит скольжение'
                      : 'здесь раньше наступит опрокидывание: тело слишком высокое для своей ширины',
      -4.6,yb,0,34,ink3);
  }
},

statics:{
  title:'Статика: равновесие тел',
  params:[
    {key:'sys',label:'Система',type:'select',default:'lever',
     options:[{v:'lever', t:'Рычаг: две массы на опоре'},
              {v:'beam',  t:'Балка на двух опорах'},
              {v:'ladder',t:'Лестница у стены'},
              {v:'bracket',t:'Кронштейн: вывеска на стене'}]},
    {key:'g', label:'Ускорение g',unit:'м/с²',min:0.5,max:30,step:0.1,default:9.8},

    {type:'group',label:'Рычаг'},
    {key:'m1', label:'Масса слева m₁',unit:'кг',min:0.1,max:200,step:0.5,default:20},
    {key:'m2', label:'Масса справа m₂',unit:'кг',min:0.1,max:200,step:0.5,default:30},
    {key:'L',  label:'Длина стержня L',unit:'м',min:1,max:10,step:0.1,default:4},
    {key:'piv',label:'Положение опоры от левого конца',unit:'м',min:0.1,max:9.9,step:0.05,default:2.4},

    {type:'group',label:'Балка на двух опорах'},
    {key:'Lb', label:'Длина балки',unit:'м',min:2,max:12,step:0.1,default:6},
    {key:'mb', label:'Масса балки',unit:'кг',min:0,max:500,step:1,default:40},
    {key:'load',label:'Груз на балке',unit:'кг',min:0,max:1000,step:1,default:100},
    {key:'lpos',label:'Положение груза от левой опоры',unit:'м',min:0,max:12,step:0.1,default:2},

    {type:'group',label:'Лестница'},
    {key:'Ll', label:'Длина лестницы',unit:'м',min:2,max:10,step:0.1,default:5},
    {key:'ang',label:'Угол к полу θ',unit:'°',min:20,max:85,step:1,default:60},
    {key:'mL', label:'Масса лестницы',unit:'кг',min:1,max:50,step:0.5,default:10},
    {key:'mMan',label:'Масса человека',unit:'кг',min:0,max:150,step:1,default:70},
    {key:'sMan',label:'Положение человека (доля длины)',min:0,max:1,step:0.05,default:0.5},
    {key:'muF',label:'Трение о пол μ',min:0,max:1.5,step:0.05,default:0.4},

    {type:'group',label:'Кронштейн'},
    {key:'Lbr',label:'Вылет кронштейна',unit:'м',min:0.5,max:4,step:0.1,default:1.5},
    {key:'mSign',label:'Масса вывески',unit:'кг',min:1,max:200,step:1,default:25},
    {key:'braceA',label:'Угол растяжки к стене',unit:'°',min:15,max:75,step:1,default:40}
  ],
  /* каждая система возвращает силы реакции и признак равновесия */
  solve(p){
    if(p.sys==='lever'){
      const W1=p.m1*p.g, W2=p.m2*p.g, a=p.piv, b=p.L-p.piv;
      const tau=W2*b - W1*a;                       // момент относительно опоры (+ по часовой = вниз справа)
      const N=W1+W2;                               // реакция опоры
      const balancedPiv=p.m2*p.L/(p.m1+p.m2);      // m1·a = m2·(L−a) ⇒ a = m2·L/(m1+m2)
      return {W1,W2,N,tau,a,b,balanced:Math.abs(tau)<0.5,balancedPiv};
    }
    if(p.sys==='beam'){
      const Wb=p.mb*p.g, Wl=p.load*p.g, L=p.Lb, d=p.lpos;    // груз может быть и за опорой
      // опоры на концах: R1 (левая), R2 (правая). ΣF=0, Στ=0 относительно левой
      const R2=(Wb*(L/2)+Wl*d)/L;
      const R1=Wb+Wl-R2;
      // опора умеет только подпирать: если реакция вышла отрицательной, балка задирается и опрокидывается
      const tipL=R1<0, tipR=R2<0;
      // момент опрокидывания относительно ближней опоры
      const tipTau = tipR ? (Wl*(0-d)-Wb*(L/2))    // груз левее левой опоры
                   : (tipL ? (Wl*(d-L)-Wb*(L/2)) : 0);
      return {Wb,Wl,R1,R2,L,d,tipL,tipR,tipTau,balanced:!tipL&&!tipR};
    }
    if(p.sys==='ladder'){
      const th=p.ang*Math.PI/180, W=p.mL*p.g, Wm=p.mMan*p.g, L=p.Ll;
      const N=W+Wm;                                // реакция пола (верт.)
      // момент относительно нижней опоры: стена даёт горизонт. реакцию Fw
      // W на L/2, Wm на sMan·L; Fw·L·sinθ = W·(L/2)cosθ + Wm·(sMan·L)cosθ
      const Fw=(W*(L/2)*Math.cos(th)+Wm*(p.sMan*L)*Math.cos(th))/(L*Math.sin(th));
      const need=Fw, avail=p.muF*N;                // трение о пол должно удержать Fw
      return {th,W,Wm,N,Fw,need,avail,L,slips:need>avail};
    }
    // bracket: горизонтальный стержень к стене + растяжка (трос) под углом
    const th=p.braceA*Math.PI/180, W=p.mSign*p.g, Lr=p.Lbr;
    // трос крепится к концу стержня и к стене выше; вертикальная составляющая держит вес
    // момент относительно крепления стержня к стене: T·sinθ·Lr = W·Lr → T=W/sinθ
    const T=W/Math.sin(th);

  init(p){ return {t:0,rot:0,vrot:0,event:null,__stop:null}; },
  step(s,dt,p){
    s.t+=dt;
    // показательное (не гиперточное) вращение неуравновешенных систем
    const d=this.solve(p);
    let drive=0;
    if(p.sys==='lever')  drive = -d.tau*0.00002;               // момент → угловое ускорение (условный масштаб)
    else if(p.sys==='ladder' && d.slips) drive = -0.15;        // низ уезжает, угол падает: rot < 0
    else if(p.sys==='beam' && !d.balanced)                      // груз вынесен за опору — балка опрокидывается
      drive = (d.tipR? 1:-1)*0.05;

      s.sway = (s.sway||0) + dt*1.6;

      s.vrot += drive*dt*60;

      s.rot  += s.vrot*dt;

        // лестница валится, пока не ляжет на пол: угол не может стать меньше нуля
        const th0=p.ang*Math.PI/180;
        if(s.rot<=-th0){ s.rot=-th0; s.vrot=0; }
        if(s.rot>0){ s.rot=0; s.vrot=0; }
      }
      if(p.sys==='beam'){ s.rot=Math.max(-0.5,Math.min(0.5,s.rot)); }   // балка кренится до упора в пол
      if(p.sys==='lever'){
        // концы стержня упираются в пол: тяжёлый конец не проваливается ниже уровня опоры.
        // максимальный угол наклона — когда более длинное плечо коснулось пола (высота опоры ≈ 0.6 м).
        const armL=Math.max(p.piv,p.L-p.piv);
        const maxTilt=Math.min(0.6, Math.asin(Math.min(1,0.6/Math.max(armL,0.01))));
        if(s.rot> maxTilt){ s.rot= maxTilt; s.vrot=0; }         // левый конец лёг на пол
        if(s.rot<-maxTilt){ s.rot=-maxTilt; s.vrot=0; }         // правый конец лёг на пол
      }
    } else { s.vrot*=0.9; }                                     // уравновешено — успокаивается
  },
  warn(p){
    const d=this.solve(p);

      return `Рычаг не уравновешен: момент ${d.tau>0?'вращает по часовой':'против часовой'} (${Math.abs(d.tau).toFixed(0)} Н·м). Опора для равновесия — на ${d.balancedPiv.toFixed(2)} м от левого конца.`;

  anchors(s,p){

  graphs:[],
  presets:[
    {name:'Рычаг: уравновешен',values:{sys:'lever',m1:20,m2:30,L:4,piv:2.4,g:9.8}},
    {name:'Рычаг: перевешивает правая',values:{sys:'lever',m1:20,m2:30,L:4,piv:2.0,g:9.8}},
    {name:'Балка: груз вынесен за опору — опрокидывается',values:{sys:'beam',Lb:6,mb:40,load:300,lpos:8.5,g:9.8}},
    {name:'Балка: груз ближе к левой опоре',values:{sys:'beam',Lb:6,mb:40,load:100,lpos:2,g:9.8}},

    {name:'Лестница: человек слишком высоко — скользит',values:{sys:'ladder',Ll:5,ang:60,mL:10,mMan:70,sMan:0.9,muF:0.4,g:9.8}},

  fit(p,vp){
    const W=(vp&&vp.W)||460,H=(vp&&vp.H)||320;
    let spanX,spanY,cx,cy;
    if(p.sys==='lever'){ spanX=p.L*1.5; spanY=p.L*0.9; cx=p.L/2; cy=0.3; }
    else if(p.sys==='beam'){ spanX=p.Lb*1.4; spanY=p.Lb*0.7; cx=p.Lb/2; cy=0.5; }
    else if(p.sys==='ladder'){ const th=p.ang*Math.PI/180; spanX=Math.max(p.Ll*Math.cos(th),p.Ll*Math.sin(th))*2.2; spanY=p.Ll*1.2; cx=p.Ll*Math.cos(th)/2; cy=p.Ll*Math.sin(th)/2; }
    else { spanX=p.Lbr*2.6; spanY=p.Lbr*2.2; cx=p.Lbr*0.3; cy=0; }
    const scale=clamp(Math.min((W-70)/(spanX*PX_PER_M),(H-70)/(spanY*PX_PER_M)),0.002,30);

  draw(ctx,s,v,p){

          dang=v.c('--danger'), ink=v.c('--ink-2'), ink3=v.c('--ink-3');

      }

    {type:'group',label:'Показывать'},
    {key:'dx',   label:'Отметка смещения Δx',type:'check',default:true},
    {key:'ampl', label:'Границы амплитуды',type:'check',default:true},
    {key:'force',label:'Сила упругости',type:'check',default:true},
    {key:'damp', label:'Затухание (реалистичнее)',type:'check',default:false},

    {type:'group',label:'Остановка таймера'},
    {key:'periods',label:'Через N полных колебаний (0 — выкл)',min:0,max:50,step:0.5,default:0},
    {key:'tStop',label:'В момент t (0 — выкл)',unit:'с',min:0,max:600,step:0.1,default:0}
  ],
  /* собственная частота: ω = √(k/m), период T = 2π√(m/k) */
  w(p){ return Math.sqrt(p.k/p.m); },
  T(p){ return 2*Math.PI/this.w(p); },
  init(p){ return {t:0,q:p.A,v:0,periods:0,event:null,__stop:null}; },
  step(s,dt,p){
    if(s.event) return;
    const t=s.t+dt, w=this.w(p);
    if(p.tStop>0&&t>=p.tStop){ s.t=p.tStop; s.event={t:p.tStop,type:'time'};
      s.__stop=`Остановка по времени: t = ${p.tStop.toFixed(2)} с`; return; }
    const g=p.damp?0.06:0;
    const acc=(q,vv)=>-w*w*q - g*vv;
    const a1=acc(s.q,s.v);
    s.q+=s.v*dt+0.5*a1*dt*dt;
    const a2=acc(s.q,s.v+a1*dt);
    s.v+=0.5*(a1+a2)*dt;
    s.t=t; s.periods=s.t/this.T(p);
    if(p.periods>0 && s.periods>=p.periods){
      s.event={t:s.t,type:'periods'};
      s.__stop=`Пройдено ${p.periods} колебан. : t = ${s.t.toFixed(2)} с (период T = ${this.T(p).toFixed(3)} с)`;
    }
  },
  anchors(s,p){ return [{x:s.q,y:0},{x:0,y:0}]; },
  energies(s,p){ const Ek=0.5*p.m*s.v*s.v, Eel=0.5*p.k*s.q*s.q; return {Ek,Ep:0,Eel,Eth:0,tot:Ek+Eel}; },
  readouts(s,p){
    const E=this.energies(s,p);
    return [['t',s.t,'с'],
      ['период T = 2π√(m/k)',this.T(p),'с'],
      ['частота ν',1/this.T(p),'Гц'],
      ['круговая частота ω',this.w(p),'рад/с'],
      ['смещение Δx',s.q,'м'],
      ['скорость v',s.v,'м/с'],
      ['сила упругости −kx',-p.k*s.q,'Н'],
      ['кинетическая энергия',E.Ek,'Дж'],
      ['потенциальная энергия пружины',E.Eel,'Дж'],
      ['полная энергия',E.tot,'Дж'],
      ['колебаний пройдено',s.periods,'']];
  },
  graphs:[
    {label:'Смещение Δx во времени',unit:'м',series:['x'],get:s=>[s.q,null]},
    {label:'Скорость',unit:'м/с',series:['v'],get:s=>[s.v,null]},
    {label:'Энергия: кинетическая и упругая',unit:'Дж',series:['K','U'],
     get(s,p){ const E=SIMS.spring.energies(s,p); return [E.Ek,E.Eel]; }}
  ],
  presets:[
    {name:'Пружина m = 1 кг, k = 20 Н/м',values:{m:1,k:20,A:2,periods:0,tStop:0}},
    {name:'Жёстче пружина — чаще колебания',values:{m:1,k:100,A:2,tStop:0}},
    {name:'Тяжелее груз — медленнее',values:{m:8,k:20,A:2,tStop:0}},
    {name:'Малая амплитуда — период тот же',values:{m:1,k:20,A:0.5,tStop:0}},
    {name:'Затухающие колебания',values:{m:1,k:20,A:2,damp:true,tStop:0}}
  ],
  fit(p,vp){
    const W=(vp&&vp.W)||460,H=(vp&&vp.H)||320;
    const spanX=Math.max(p.A*3.2,4.5), spanY=spanX*H/W;
    const scale=clamp(Math.min((W-60)/(spanX*PX_PER_M),(H-60)/(spanY*PX_PER_M)),0.002,30);
    return {x:0,y:0,scale};
  },
  draw(ctx,s,v,p){
    const acc=v.c('--accent'), sec=v.c('--second'), meas=v.c('--measure'), dang=v.c('--danger'), ink=v.c('--ink-2'), ink3=v.c('--ink-3');
    const wall=-Math.max(p.A*2,2.5), sz=0.28+0.06*Math.cbrt(p.m), yb=0.5;
    // стена и опора
    ctx.strokeStyle=ink; ctx.lineWidth=v.lw(2);
    ctx.beginPath(); ctx.moveTo(wall,-1.4); ctx.lineTo(wall,1.5); ctx.moveTo(wall,0); ctx.lineTo(Math.max(p.A,s.q)+1.2,0); ctx.stroke();
    // штриховка стены
    ctx.strokeStyle=ink3; ctx.globalAlpha=.6; ctx.lineWidth=v.lw(1);
    for(let i=0;i<9;i++){ const y=-1.3+i*0.34;
      ctx.beginPath(); ctx.moveTo(wall,y); ctx.lineTo(wall-0.22,y+0.18); ctx.stroke(); }
    ctx.globalAlpha=1;
    // пружина: витки сжимаются и растягиваются вместе с грузом
    const coils=16, x2=s.q-sz;
    ctx.strokeStyle=sec; ctx.lineWidth=v.lw(1.8); ctx.beginPath(); ctx.moveTo(wall,yb);
    for(let i=0;i<=coils;i++) ctx.lineTo(wall+(x2-wall)*i/coils, yb+(i%2?0.24:-0.24));
    ctx.lineTo(x2,yb); ctx.stroke();
    // положение равновесия
    ctx.strokeStyle=v.c('--line'); ctx.lineWidth=v.lw(1); ctx.setLineDash([v.lw(3),v.lw(3)]);
    ctx.beginPath(); ctx.moveTo(0,-1.5); ctx.lineTo(0,1.4); ctx.stroke(); ctx.setLineDash([]);
    v.label(ctx,'равновесие',0,1.4,-30,-2,ink3);
    // границы амплитуды
    if(p.ampl){
      ctx.strokeStyle=sec; ctx.globalAlpha=.5; ctx.setLineDash([v.lw(2),v.lw(4)]); ctx.lineWidth=v.lw(1);
      for(const sgn of [1,-1]){
        ctx.beginPath(); ctx.moveTo(sgn*p.A,-1.2); ctx.lineTo(sgn*p.A,1.2); ctx.stroke();
      }
      ctx.setLineDash([]); ctx.globalAlpha=1;
      v.label(ctx,'−x₀',-p.A,1.2,-8,-4,sec);
      v.label(ctx,'+x₀',p.A,1.2,-8,-4,sec);
    }
    // груз
    ctx.fillStyle=acc; ctx.fillRect(s.q-sz,yb-sz,2*sz,2*sz);
    // ЛИНИЯ СМЕЩЕНИЯ Δx — от положения равновесия до груза
    if(p.dx){
      const yd=-1.05;
      ctx.strokeStyle=meas; ctx.lineWidth=v.lw(1.6);
      ctx.beginPath(); ctx.moveTo(0,yd); ctx.lineTo(s.q,yd); ctx.stroke();
      // засечки на концах
      ctx.beginPath(); ctx.moveTo(0,yd-0.14); ctx.lineTo(0,yd+0.14);
      ctx.moveTo(s.q,yd-0.14); ctx.lineTo(s.q,yd+0.14); ctx.stroke();
      if(Math.abs(s.q)>0.12) v.arrow(ctx,0,yd,s.q,yd,meas);
      v.label(ctx,`Δx = ${s.q.toFixed(2)} м`,s.q/2,yd,-24,-10,meas);
      // связь груза с отметкой
      ctx.strokeStyle=meas; ctx.globalAlpha=.35; ctx.setLineDash([v.lw(2),v.lw(3)]); ctx.lineWidth=v.lw(1);
      ctx.beginPath(); ctx.moveTo(s.q,yb-sz); ctx.lineTo(s.q,yd); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
    }
    // сила упругости
    if(p.force && Math.abs(s.q)>0.05){
      const F=-p.k*s.q, len=clamp(Math.abs(F)*0.02,0.2,1.8);
      v.arrow(ctx,s.q,yb,s.q+Math.sign(F)*len,yb,dang);
      v.label(ctx,`F = −kx = ${F.toFixed(1)} Н`,s.q+Math.sign(F)*len,yb,Math.sign(F)>0?6:-90,-8,dang);
    }
    v.label(ctx,`T = 2π√(m/k) = ${this.T(p).toFixed(2)} с`,wall,1.5,10,0,ink3);
    v.label(ctx,'период не зависит от амплитуды',wall,1.5,10,16,ink3);
  }
},

/* ================= КОЛЕБАНИЯ: МАТЕМАТИЧЕСКИЙ МАЯТНИК ================= */
pendulum:{
  title:'Математический маятник',
  params:[
    {key:'L',  label:'Длина нити L',unit:'м',min:0.2,max:20,step:0.1,default:1},
    {key:'th0',label:'Начальный угол θ₀',unit:'°',min:1,max:80,step:1,default:20},
    {key:'m',  label:'Масса груза m',unit:'кг',min:0.1,max:20,step:0.1,default:1},
    {key:'g',  label:'Ускорение g',unit:'м/с²',min:0.5,max:30,step:0.1,default:9.8},

    {type:'group',label:'Показывать'},
    {key:'arc',  label:'Дуга угла и траектория',type:'check',default:true},
    {key:'forces',label:'Возвращающая сила',type:'check',default:true},
    {key:'exact',label:'Точное уравнение (не малые углы)',type:'check',default:true},
    {key:'damp', label:'Затухание',type:'check',default:false},

    {type:'group',label:'Остановка таймера'},
    {key:'periods',label:'Через N полных колебаний (0 — выкл)',min:0,max:50,step:0.5,default:0},
    {key:'tStop',label:'В момент t (0 — выкл)',unit:'с',min:0,max:600,step:0.1,default:0}
  ],
  /* малые колебания: T = 2π√(L/g) */
  w(p){ return Math.sqrt(p.g/p.L); },
  T(p){ return 2*Math.PI*Math.sqrt(p.L/p.g); },
  /* поправка на конечную амплитуду (первый член ряда) */
  Texact(p){ const a=p.th0*Math.PI/180; return this.T(p)*(1+a*a/16); },
  init(p){ return {t:0,q:p.th0*Math.PI/180,v:0,periods:0,event:null,__stop:null}; },
  step(s,dt,p){
    if(s.event) return;
    const t=s.t+dt, w=this.w(p);
    if(p.tStop>0&&t>=p.tStop){ s.t=p.tStop; s.event={t:p.tStop,type:'time'};
      s.__stop=`Остановка по времени: t = ${p.tStop.toFixed(2)} с`; return; }
    const g=p.damp?0.06:0;
    // точное уравнение маятника: θ'' = −(g/L)·sinθ; приближённое: θ'' = −(g/L)·θ
    const acc=(q,vv)=>-w*w*(p.exact?Math.sin(q):q) - g*vv;
    const a1=acc(s.q,s.v);
    s.q+=s.v*dt+0.5*a1*dt*dt;
    const a2=acc(s.q,s.v+a1*dt);
    s.v+=0.5*(a1+a2)*dt;
    s.t=t; s.periods=s.t/this.T(p);
    if(p.periods>0 && s.periods>=p.periods){
      s.event={t:s.t,type:'periods'};
      s.__stop=`Пройдено ${p.periods} колебан. : t = ${s.t.toFixed(2)} с (период T = ${this.T(p).toFixed(3)} с)`;
    }
  },
  pos(s,p){ return {x:p.L*Math.sin(s.q), y:-p.L*Math.cos(s.q)}; },
  anchors(s,p){ const c=this.pos(s,p); return [{x:0,y:0},{x:c.x,y:c.y}]; },
  energies(s,p){
    const I=p.m*p.L*p.L, Ek=0.5*I*s.v*s.v, Ep=p.m*p.g*p.L*(1-Math.cos(s.q));
    return {Ek,Ep,Eel:0,Eth:0,tot:Ek+Ep};
  },
  readouts(s,p){
    const E=this.energies(s,p);
    return [['t',s.t,'с'],
      ['период T = 2π√(L/g)',this.T(p),'с'],
      ['с поправкой на амплитуду',this.Texact(p),'с'],
      ['частота ν',1/this.T(p),'Гц'],
      ['угол θ',s.q*180/Math.PI,'°'],
      ['угловая скорость',s.v,'рад/с'],
      ['скорость груза',Math.abs(s.v)*p.L,'м/с'],
      ['высота подъёма',p.L*(1-Math.cos(s.q)),'м'],
      ['кинетическая энергия',E.Ek,'Дж'],
      ['потенциальная энергия',E.Ep,'Дж'],
      ['полная энергия',E.tot,'Дж'],
      ['колебаний пройдено',s.periods,''],
      ['период не зависит от массы',1,'проверьте, меняя m']];
  },
  graphs:[
    {label:'Угол во времени',unit:'°',series:['θ'],get:s=>[s.q*180/Math.PI,null]},
    {label:'Угловая скорость',unit:'рад/с',series:['ω'],get:s=>[s.v,null]},
    {label:'Энергия: кинетическая и потенциальная',unit:'Дж',series:['K','U'],
     get(s,p){ const E=SIMS.pendulum.energies(s,p); return [E.Ek,E.Ep]; }}
  ],
  presets:[
    {name:'Маятник L = 1 м (T ≈ 2 с)',values:{L:1,th0:20,m:1,g:9.8,tStop:0}},
    {name:'Длиннее нить — медленнее',values:{L:4,th0:20,m:1,g:9.8,tStop:0}},
    {name:'Другая масса — период тот же',values:{L:1,th0:20,m:10,g:9.8,tStop:0}},
    {name:'Часы: период ровно 2 с',values:{L:0.994,th0:10,m:1,g:9.8,tStop:0}},
    {name:'Большой угол — формула уже врёт',values:{L:1,th0:70,m:1,g:9.8,exact:true,tStop:0}},
    {name:'Маятник на Луне',values:{L:1,th0:20,m:1,g:1.62,tStop:0}}
  ],
  fit(p,vp){
    const W=(vp&&vp.W)||460,H=(vp&&vp.H)||320;
    const spanX=p.L*2.6, spanY=p.L*2.3;
    const scale=clamp(Math.min((W-60)/(spanX*PX_PER_M),(H-60)/(spanY*PX_PER_M)),0.002,30);
    return {x:0,y:-p.L*0.5,scale};
  },
  draw(ctx,s,v,p){
    const acc=v.c('--accent'), sec=v.c('--second'), meas=v.c('--measure'), dang=v.c('--danger'), ink=v.c('--ink-2'), ink3=v.c('--ink-3');
    const c=this.pos(s,p), L=p.L;
    // потолок
    ctx.strokeStyle=ink; ctx.lineWidth=v.lw(2.4);
    ctx.beginPath(); ctx.moveTo(-L*0.5,0); ctx.lineTo(L*0.5,0); ctx.stroke();
    ctx.strokeStyle=ink3; ctx.globalAlpha=.6; ctx.lineWidth=v.lw(1);
    for(let i=0;i<7;i++){ const x=-L*0.45+i*L*0.15;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x-L*0.06,L*0.08); ctx.stroke(); }
    ctx.globalAlpha=1;
    // вертикаль равновесия
    ctx.strokeStyle=v.c('--line'); ctx.lineWidth=v.lw(1); ctx.setLineDash([v.lw(3),v.lw(3)]);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-L*1.15); ctx.stroke(); ctx.setLineDash([]);
    // траектория
    if(p.arc){
      const a0=p.th0*Math.PI/180;
      ctx.strokeStyle=sec; ctx.globalAlpha=.35; ctx.setLineDash([v.lw(2),v.lw(3)]); ctx.lineWidth=v.lw(1.2);
      ctx.beginPath(); ctx.arc(0,0,L,-Math.PI/2-a0,-Math.PI/2+a0); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
    }
    // нить и груз
    ctx.strokeStyle=ink; ctx.lineWidth=v.lw(1.8);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(c.x,c.y); ctx.stroke();
    ctx.fillStyle=ink; ctx.beginPath(); ctx.arc(0,0,v.lw(3),0,7); ctx.fill();
    const R=v.lw(8)+p.m*0.2;
    ctx.fillStyle=acc; ctx.beginPath(); ctx.arc(c.x,c.y,Math.max(v.lw(8),L*0.09),0,7); ctx.fill();
    v.label(ctx,`m = ${p.m} кг`,c.x,c.y,12,0,acc);
    // дуга угла
    if(p.arc){
      ctx.strokeStyle=sec; ctx.lineWidth=v.lw(1.4);
      ctx.beginPath(); ctx.arc(0,0,L*0.32,-Math.PI/2,-Math.PI/2+s.q,s.q<0); ctx.stroke();
      v.label(ctx,`θ = ${(s.q*180/Math.PI).toFixed(1)}°`,0,-L*0.38,12,0,sec);
    }
    // возвращающая сила: составляющая тяжести вдоль дуги
    if(p.forces && Math.abs(s.q)>0.02){
      const F=-p.m*p.g*Math.sin(s.q);
      const tx=Math.cos(s.q), ty=Math.sin(s.q);      // касательная к траектории
      const len=clamp(Math.abs(F)*0.05,0.15,L*0.5);
      v.arrow(ctx,c.x,c.y,c.x+Math.sign(F)*tx*len,c.y+Math.sign(F)*ty*len,dang);
      v.label(ctx,`mg·sinθ = ${Math.abs(F).toFixed(2)} Н`,c.x,c.y,-40,L*0.14*20+14,dang);
      // сила тяжести
      ctx.strokeStyle=ink3; ctx.globalAlpha=.5; ctx.lineWidth=v.lw(1.2);
      ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(c.x,c.y-L*0.3); ctx.stroke(); ctx.globalAlpha=1;
    }
    v.label(ctx,`T = 2π√(L/g) = ${this.T(p).toFixed(2)} с`,0,-L*1.2,-52,0,ink3);
    if(p.th0>25) v.label(ctx,`при θ₀ = ${p.th0}° точный период уже ${this.Texact(p).toFixed(2)} с`,0,-L*1.2,-70,16,dang);
    else v.label(ctx,'период не зависит ни от массы, ни от амплитуды',0,-L*1.2,-90,16,ink3);
  }
},

/* ================= КОЛЕБАНИЯ: ФИЗИЧЕСКИЙ МАЯТНИК ================= */

  },
  pos(s,p){ return {x:this.d(p)*Math.sin(s.q), y:-this.d(p)*Math.cos(s.q)}; },
  anchors(s,p){ const c=this.pos(s,p); return [{x:0,y:0},{x:c.x,y:c.y}]; },
  energies(s,p){
    const Ek=0.5*this.I(p)*s.v*s.v, Ep=p.mr*p.g*this.d(p)*(1-Math.cos(s.q));
    return {Ek,Ep,Eel:0,Eth:0,tot:Ek+Ep};
  },
  readouts(s,p){
    const E=this.energies(s,p);
    return [['t',s.t,'с'],
      ['период T = 2π√(I/mgd)',this.T(p),'с'],
      ['момент инерции I = mL²/3',this.I(p),'кг·м²'],
      ['до центра масс d = L/2',this.d(p),'м'],
      ['приведённая длина 2L/3',this.Lred(p),'м'],
      ['период нитяного той же длины',2*Math.PI*Math.sqrt(p.Lr/p.g),'с'],
      ['угол θ',s.q*180/Math.PI,'°'],
      ['угловая скорость',s.v,'рад/с'],
      ['кинетическая энергия',E.Ek,'Дж'],
      ['потенциальная энергия',E.Ep,'Дж'],
      ['полная энергия',E.tot,'Дж'],
      ['колебаний пройдено',s.periods,'']];
  },
  graphs:[
    {label:'Угол во времени',unit:'°',series:['θ'],get:s=>[s.q*180/Math.PI,null]},
    {label:'Угловая скорость',unit:'рад/с',series:['ω'],get:s=>[s.v,null]},
    {label:'Энергия: кинетическая и потенциальная',unit:'Дж',series:['K','U'],
     get(s,p){ const E=SIMS.physpend.energies(s,p); return [E.Ek,E.Ep]; }}
  ],
  presets:[
    {name:'Стержень 2 м',values:{Lr:2,mr:1,thR:25,g:9.8,tStop:0}},
    {name:'Короткий стержень — чаще колебания',values:{Lr:0.6,mr:1,thR:25,g:9.8,tStop:0}},
    {name:'Другая масса — период тот же',values:{Lr:2,mr:12,thR:25,g:9.8,tStop:0}},
    {name:'Сравнение с нитяным маятником',values:{Lr:3,mr:1,thR:20,compare:true,g:9.8,tStop:0}}
  ],
  fit(p,vp){
    const W=(vp&&vp.W)||460,H=(vp&&vp.H)||320;
    const spanX=p.Lr*2.4, spanY=p.Lr*2.1;
    const scale=clamp(Math.min((W-60)/(spanX*PX_PER_M),(H-60)/(spanY*PX_PER_M)),0.002,30);
    return {x:0,y:-p.Lr*0.45,scale};
  },
  draw(ctx,s,v,p){
    const acc=v.c('--accent'), sec=v.c('--second'), meas=v.c('--measure'), dang=v.c('--danger'), ink=v.c('--ink-2'), ink3=v.c('--ink-3');
    const L=p.Lr, c=this.pos(s,p);
    const ex=L*Math.sin(s.q), ey=-L*Math.cos(s.q);
    // потолок
    ctx.strokeStyle=ink; ctx.lineWidth=v.lw(2.4);
    ctx.beginPath(); ctx.moveTo(-L*0.4,0); ctx.lineTo(L*0.4,0); ctx.stroke();
    ctx.strokeStyle=ink3; ctx.globalAlpha=.6; ctx.lineWidth=v.lw(1);
    for(let i=0;i<6;i++){ const x=-L*0.36+i*L*0.14;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x-L*0.05,L*0.07); ctx.stroke(); }
    ctx.globalAlpha=1;
    // вертикаль
    ctx.strokeStyle=v.c('--line'); ctx.lineWidth=v.lw(1); ctx.setLineDash([v.lw(3),v.lw(3)]);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-L*1.1); ctx.stroke(); ctx.setLineDash([]);
    // сравнение: нитяной маятник приведённой длины качается в такт
    if(p.compare){
      const Lr2=this.Lred(p);
      ctx.strokeStyle=sec; ctx.globalAlpha=.5; ctx.lineWidth=v.lw(1.4);
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.lineTo(Lr2*Math.sin(s.q),-Lr2*Math.cos(s.q)); ctx.stroke();
      ctx.fillStyle=sec; ctx.beginPath();
      ctx.arc(Lr2*Math.sin(s.q),-Lr2*Math.cos(s.q),v.lw(5),0,7); ctx.fill();
      ctx.globalAlpha=1;
      v.label(ctx,`нитяной маятник длиной 2L/3 = ${Lr2.toFixed(2)} м`,
        Lr2*Math.sin(s.q),-Lr2*Math.cos(s.q),12,0,sec);
      v.label(ctx,'качается совершенно в такт',Lr2*Math.sin(s.q),-Lr2*Math.cos(s.q),12,16,ink3);
    }
    // стержень
    ctx.strokeStyle=acc; ctx.lineWidth=v.lw(6); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(ex,ey); ctx.stroke(); ctx.lineCap='butt';
    // ось
    ctx.fillStyle=ink; ctx.beginPath(); ctx.arc(0,0,v.lw(4),0,7); ctx.fill();
    v.label(ctx,'ось',0,0,-22,-6,ink3);
    // центр масс
    if(p.cm){
      ctx.fillStyle=meas; ctx.beginPath(); ctx.arc(c.x,c.y,v.lw(5),0,7); ctx.fill();
      ctx.strokeStyle=meas; ctx.lineWidth=v.lw(1.2);
      ctx.beginPath(); ctx.arc(c.x,c.y,v.lw(8),0,7); ctx.stroke();
      v.label(ctx,'центр масс (L/2)',c.x,c.y,12,0,meas);
      // плечо силы тяжести
      ctx.strokeStyle=dang; ctx.globalAlpha=.6; ctx.setLineDash([v.lw(3),v.lw(3)]); ctx.lineWidth=v.lw(1.2);
      ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(c.x,c.y-L*0.25); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
      v.arrow(ctx,c.x,c.y,c.x,c.y-L*0.22,dang);
      v.label(ctx,'mg',c.x,c.y-L*0.22,6,0,dang);
    }
    // дуга угла
    ctx.strokeStyle=sec; ctx.lineWidth=v.lw(1.4);
    ctx.beginPath(); ctx.arc(0,0,L*0.28,-Math.PI/2,-Math.PI/2+s.q,s.q<0); ctx.stroke();
    v.label(ctx,`θ = ${(s.q*180/Math.PI).toFixed(1)}°`,0,-L*0.34,12,0,sec);
    v.label(ctx,`T = 2π√(I/mgd) = ${this.T(p).toFixed(2)} с`,0,-L*1.15,-56,0,ink3);
    v.label(ctx,`нитяной той же длины дал бы ${(2*Math.PI*Math.sqrt(L/p.g)).toFixed(2)} с — стержень быстрее`,
      0,-L*1.15,-116,16,ink3);
  }
}
,

Object.assign(SIMS,{
/* ================== КИНЕТИЧЕСКАЯ ТЕОРИЯ: ГАЗ В ЯЩИКЕ ================= */
gas:{
  title:'Газ: молекулы, давление, температура',
  params:[
    {key:'N',   label:'Число молекул N',min:5,max:400,step:5,default:120},
    {key:'T',   label:'Температура T',unit:'K',min:20,max:1200,step:10,default:300},
    {key:'Lx',  label:'Ширина сосуда',unit:'усл.ед.',min:4,max:20,step:0.5,default:12},
    {key:'Ly',  label:'Высота сосуда',unit:'усл.ед.',min:4,max:20,step:0.5,default:9},
    {key:'mMol',label:'Относит. масса молекул',min:0.2,max:8,step:0.1,default:1},

    {type:'group',label:'Показывать'},
    {key:'trails',label:'Следы молекул',type:'check',default:false},
    {key:'histo', label:'Гистограмма скоростей (Максвелл)',type:'check',default:true},
    {key:'fast',  label:'Подсветить быстрые молекулы',type:'check',default:true},

    {type:'group',label:'Нагреватель / охладитель'},
    {key:'heater',label:'Включить',type:'check',default:false},
    {key:'Tset', label:'Довести температуру до',unit:'K',min:20,max:1200,step:10,default:600},
    {key:'theat',label:'За время',unit:'с',min:0.5,max:30,step:0.5,default:5},

    {type:'group',label:'Поршень (демонстрация закона Бойля)'},
    {key:'piston',label:'Сжимать поршнем',type:'check',default:false},
    {key:'pistonX',label:'Положение поршня (доля ширины)',min:0.3,max:1,step:0.05,default:1},

    {type:'group',label:'Остановка таймера'},
    {key:'tStop',label:'В момент t (0 — выкл)',unit:'с',min:0,max:600,step:0.1,default:0}
  ],
  kB:1.0,                                        // условная постоянная Больцмана (модельные единицы)
  /* среднеквадратичная скорость из T: ½m⟨v²⟩ = (в 2D) kT → v_rms = √(2kT/m) */
  vrms(p){ return Math.sqrt(2*this.kB*p.T/p.mMol)*0.02; },   // масштаб под сцену
  init(p){
    const mol=[], v=this.vrms(p), wx=p.Lx*(p.piston?p.pistonX:1);
    for(let i=0;i<p.N;i++){
      const ang=Math.random()*2*Math.PI;
      // распределение скоростей: разброс вокруг v_rms
      const speed=v*(0.5+Math.random());
      mol.push({x:0.3+Math.random()*(wx-0.6), y:0.3+Math.random()*(p.Ly-0.6),
                vx:speed*Math.cos(ang), vy:speed*Math.sin(ang),
                trail:[]});
    }
    return {t:0, mol, wallHits:0, impulse:0, pressAcc:0, pressN:0, Pema:null,
            Tstart:p.T, Tnow:p.T, event:null, __stop:null};
  },
  step(s,dt,p){
    if(s.event) return;
    const t=s.t+dt;
    if(p.tStop>0&&t>=p.tStop&&!(s.done&&s.done.time)){ s.t=p.tStop; s.event={t:p.tStop,type:'time'};
      s.__stop=`Остановка по времени: t = ${p.tStop.toFixed(2)} с`; return; }
    s.t=t;
    const wx=p.Lx*(p.piston?p.pistonX:1), r=0.12*Math.sqrt(p.mMol);
    let imp=0;                                    // импульс, переданный стенкам за шаг
    const sub=3, h=dt/sub;
    for(let k=0;k<sub;k++){
      for(const m of s.mol){
        m.x+=m.vx*h*60; m.y+=m.vy*h*60;
        if(m.x<r){ m.x=r; m.vx=Math.abs(m.vx); imp+=2*p.mMol*Math.abs(m.vx); }
        if(m.x>wx-r){ m.x=wx-r; m.vx=-Math.abs(m.vx); imp+=2*p.mMol*Math.abs(m.vx); }
        if(m.y<r){ m.y=r; m.vy=Math.abs(m.vy); imp+=2*p.mMol*Math.abs(m.vy); }
        if(m.y>p.Ly-r){ m.y=p.Ly-r; m.vy=-Math.abs(m.vy); imp+=2*p.mMol*Math.abs(m.vy); }
      }
    }
    // давление ≈ импульс на стенки / (периметр · время)
    const perim=2*(wx+p.Ly);
    const Pinst=imp/(perim*dt);
    s.pressAcc+=Pinst; s.pressN++;
    /* скользящее среднее с постоянной времени ~0,4 с: давление успевает
       откликнуться и на сдвиг поршня, и на работу нагревателя, но не дрожит */
    const alpha=clamp(dt/0.4,0,1);
    s.Pema = (s.Pema==null) ? Pinst : s.Pema + (Pinst - s.Pema)*alpha;
    if(p.trails){ for(const m of s.mol){ m.trail.push([m.x,m.y]); if(m.trail.length>25) m.trail.shift(); } }
    s.wallHits++;
    /* НАГРЕВАТЕЛЬ / ОХЛАДИТЕЛЬ.
       Физику не ломаем: это внешний тепловой резервуар. Он плавно подводит (или отводит)
       энергию, равномерно масштабируя скорости всех молекул. Форма максвелловского
       распределения при таком масштабировании сохраняется, а давление меняется само
       собой — просто потому, что молекулы начинают бить по стенкам сильнее. */
    if(p.heater){
      const frac=clamp(s.t/Math.max(p.theat,1e-6),0,1);
      const Twant=(s.Tstart!=null?s.Tstart:p.T)+(p.Tset-(s.Tstart!=null?s.Tstart:p.T))*frac;
      const M=this.measure(s,p), Tnow=M.Tkin;
      s.Tnow=Tnow; s.Twant=Twant;
      if(Tnow>1e-9){
        // за один шаг подтягиваем не более чем на несколько процентов — иначе рывок
        const lamFull=Math.sqrt(Twant/Tnow);
        const lam=clamp(lamFull,1-6*dt,1+6*dt);
        for(const m of s.mol){ m.vx*=lam; m.vy*=lam; }
      }
    } else { s.Tnow=this.measure(s,p).Tkin; s.Twant=null; }
  },
  /* измеренные величины */
  measure(s,p){
    let sumV2=0; for(const m of s.mol) sumV2+=m.vx*m.vx+m.vy*m.vy;
    const meanV2=sumV2/Math.max(s.mol.length,1);
    const vrms=Math.sqrt(meanV2);
    const wx=p.Lx*(p.piston?p.pistonX:1), V=wx*p.Ly;
    const P=(s.Pema!=null)?s.Pema:(s.pressN>0?s.pressAcc/s.pressN:0);
    // кинетическая температура: ½m⟨v²⟩ = kT (2D) → T = m⟨v²⟩/2k, обратный масштаб
    const Tkin=p.mMol*meanV2/(2*this.kB)/(0.02*0.02);
    return {vrms,meanV2,V,P,Tkin,wx,PV:P*V};
  },
  anchors(s,p){ return [{x:0,y:0},{x:p.Lx,y:p.Ly}]; },
  /* поршень можно двигать левой кнопкой мыши */
  dragPoints(p){
    if(!p.piston) return [];
    return [{x:p.Lx*p.pistonX, y:p.Ly/2}];
  },
  dragMove(p,idx,x,y){
    const f=clamp(x/Math.max(p.Lx,1e-6),0.3,1);
    p.pistonX=Math.round(f*100)/100;
  },
  readouts(s,p){
    const M=this.measure(s,p);
    return [['t',s.t,'с'],['число молекул N',p.N,''],['температура T',p.T,'K'],
            ['объём V',M.V,'усл.ед.²'],['давление P',M.P,'усл.ед.'],
            ['P·V',M.PV,'усл.ед.'],['P·V / N',M.PV/p.N,'≈ kT'],
            ['средне-квадр. скорость',M.vrms,'усл.ед.'],
            ['⟨v²⟩',M.meanV2,'усл.ед.²'],['ударов о стенки',s.wallHits,''],
            ['измеренная температура газа',M.Tkin,'K'],
            ...(p.heater?[
              ['нагреватель',0,p.Tset>(s.Tstart||p.T)?'нагревает':'охлаждает'],
              ['цель',p.Tset,'K'],
              ['время выхода',p.theat,'с'],
              ['прогресс',clamp(s.t/Math.max(p.theat,1e-6),0,1)*100,'%'],
              ['сейчас требуется',s.Twant!=null?s.Twant:p.T,'K'],
              ['расхождение с целью',Math.abs(M.Tkin-(s.Twant!=null?s.Twant:p.T)),'K']
            ]:[])];
  },
  graphs:[
    {label:'Давление во времени',unit:'усл.ед.',series:['P'],
     get(s,p){ const M=SIMS.gas.measure(s,p); return [M.P,null]; }},
    {label:'P·V (закон Бойля: постоянно при T=const)',unit:'усл.ед.',series:['PV'],
     get(s,p){ return [SIMS.gas.measure(s,p).PV,null]; }}
  ],
  presets:[
    {name:'Комнатная температура',values:{N:120,T:300,Lx:12,Ly:9,mMol:1,piston:false,tStop:0}},
    {name:'Нагрев: молекулы быстрее',values:{N:120,T:900,Lx:12,Ly:9,mMol:1,piston:false,tStop:0}},
    {name:'Охлаждение: молекулы медленнее',values:{N:120,T:80,Lx:12,Ly:9,mMol:1,piston:false,tStop:0}},
    {name:'Мало молекул — виден хаос',values:{N:20,T:300,Lx:12,Ly:9,mMol:1,piston:false,tStop:0}},
    {name:'Тяжёлые молекулы медленнее лёгких',values:{N:120,T:300,Lx:12,Ly:9,mMol:6,piston:false,tStop:0}},
    {name:'Закон Бойля: сжатие поршнем',values:{N:120,T:300,Lx:12,Ly:9,mMol:1,piston:true,pistonX:0.55,tStop:0}},
    {name:'Нагреватель: 300 → 900 K за 5 с',values:{N:120,T:300,Lx:12,Ly:9,mMol:1,heater:true,Tset:900,theat:5,piston:false,tStop:0}},
    {name:'Охладитель: 600 → 100 K за 8 с',values:{N:120,T:600,Lx:12,Ly:9,mMol:1,heater:true,Tset:100,theat:8,piston:false,tStop:0}}
  ],
  fit(p,vp){
    const W=(vp&&vp.W)||460,H=(vp&&vp.H)||320;
    const spanX=p.Lx*1.15, spanY=p.Ly*1.35;
    const scale=clamp(Math.min((W-60)/(spanX*PX_PER_M),(H-60)/(spanY*PX_PER_M)),0.002,30);
    return {x:p.Lx/2,y:p.Ly/2,scale};
  },
  draw(ctx,s,v,p){
    const wx=p.Lx*(p.piston?p.pistonX:1), r=0.12*Math.sqrt(p.mMol);
    const acc=v.c('--accent'), meas=v.c('--measure'), dang=v.c('--danger'), ink=v.c('--ink-2');
    // сосуд
    ctx.strokeStyle=ink; ctx.lineWidth=v.lw(2.5);
    ctx.strokeRect(0,0,wx,p.Ly);
    // поршень
    if(p.piston && p.pistonX<1){
      ctx.fillStyle=v.c('--second'); ctx.globalAlpha=.5;
      ctx.fillRect(wx,0,p.Lx-wx,p.Ly); ctx.globalAlpha=1;
      ctx.strokeStyle=v.c('--second'); ctx.lineWidth=v.lw(4);
      ctx.beginPath(); ctx.moveTo(wx,0); ctx.lineTo(wx,p.Ly); ctx.stroke();
      // рукоятка: за неё поршень тянут мышью
      ctx.fillStyle=v.c('--second');
      ctx.beginPath(); ctx.arc(wx,p.Ly/2,0.28,0,7); ctx.fill();
      ctx.strokeStyle=v.c('--panel'); ctx.lineWidth=v.lw(1.6);
      ctx.beginPath(); ctx.moveTo(wx-0.1,p.Ly/2-0.1); ctx.lineTo(wx-0.1,p.Ly/2+0.1);
      ctx.moveTo(wx+0.1,p.Ly/2-0.1); ctx.lineTo(wx+0.1,p.Ly/2+0.1); ctx.stroke();
      v.label(ctx,'поршень — тяните мышью',wx,p.Ly/2,12,0,v.c('--second'));
    }
    // средняя скорость для подсветки быстрых
    const M=this.measure(s,p), vr=M.vrms;
    // следы
    if(p.trails&&v.quality!=='low'){
      ctx.strokeStyle=acc; ctx.globalAlpha=.2; ctx.lineWidth=v.lw(1);
      for(const m of s.mol){ if(m.trail.length>1){ ctx.beginPath();
        m.trail.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.stroke(); } }
      ctx.globalAlpha=1;
    }
    // молекулы
    for(const m of s.mol){
      const sp=Math.hypot(m.vx,m.vy);
      ctx.fillStyle = (p.fast && sp>vr*1.3) ? dang : acc;
      ctx.beginPath(); ctx.arc(m.x,m.y,r,0,7); ctx.fill();
    }
        v.label(ctx,`T = ${p.T} K   v_ср.кв = ${vr.toFixed(3)}`,0,-0.3,0,0,v.c('--ink-3'));
  }
}

thermo:{

  ],
  R:8.314,
  /* состояние газа как функция прогресса u∈[0,1] от V0 к Vend */
  stateAt(p,u){
    const V=p.V0+(p.Vend-p.V0)*u;                 // объём линейно (л)
    const V0=p.V0/1000, Vm=V/1000;                // в м³
    const P0=p.n*this.R*p.T0/V0;                  // начальное давление (Па)
    let P,T;
    if(p.proc==='iso'){ P=P0*V0/Vm; T=p.T0; }
    else if(p.proc==='isobar'){ P=P0; T=p.T0*Vm/V0; }
    else if(p.proc==='isochor'){
      // объём заперт: греем газ нагревателем от T₀ до T. Тогда P = νRT/V (закон Шарля)
      const Vfix=p.V0/1000;
      T=p.T0+(p.Tend-p.T0)*u;
      P=p.n*this.R*T/Vfix;
      return {V:p.V0, Vm:Vfix, P, T, P0, V0};
    }
    else { P=P0*Math.pow(V0/Vm,p.gamma); T=p.T0*Math.pow(V0/Vm,p.gamma-1); }
    return {V, Vm, P, T, P0, V0};
  },
  /* работа газа = ∫P dV от V0 до текущего V */
  workTo(p,u){
    if(p.proc==='isochor') return 0;
    const N=60; let W=0, du=u/N;
    for(let i=0;i<N;i++){ const a=this.stateAt(p,i*du), b=this.stateAt(p,(i+1)*du);
      W+=(a.P+b.P)/2*(b.Vm-a.Vm); }
    return W;
  },
  init(p){
    const mol=[];
    for(let i=0;i<40;i++) mol.push({x:Math.random(),y:Math.random(),vx:(Math.random()-0.5),vy:(Math.random()-0.5)});
    return {t:0,u:0,dir:1,mol,event:null,__stop:null};
  },
  step(s,dt,p){
    if(s.event) return;
    const t=s.t+dt;
    if(p.tStop>0&&t>=p.tStop&&!(s.done&&s.done.time)){ s.t=p.tStop; s.event={t:p.tStop,type:'time'};
      s.__stop=`Остановка по времени: t = ${p.tStop.toFixed(2)} с`; return; }
    s.t=t;
    // прогресс процесса туда-обратно
    s.u+=s.dir*dt*0.25;
    if(s.u>=1){ s.u=1; s.dir=-1; } if(s.u<=0){ s.u=0; s.dir=1; }
    // молекулы движутся (для наглядности), скорость растёт с температурой
    const st=this.stateAt(p,s.u), vsc=Math.sqrt(st.T/p.T0)*0.6;
    for(const m of s.mol){
      m.x+=m.vx*vsc*dt*2; m.y+=m.vy*vsc*dt*2;
      if(m.x<0){m.x=0;m.vx=Math.abs(m.vx);} if(m.x>1){m.x=1;m.vx=-Math.abs(m.vx);}
      if(m.y<0){m.y=0;m.vy=Math.abs(m.vy);} if(m.y>1){m.y=1;m.vy=-Math.abs(m.vy);}
    }
  },
  anchors(s,p){ return [{x:0,y:0}]; },
  readouts(s,p){
    const st=this.stateAt(p,s.u), W=this.workTo(p,s.u);
    const dU=p.proc==='iso'?0 : (3/2)*p.n*this.R*(st.T-p.T0);   // для одноатомного ≈; берём Cv=3/2R
    const Q=dU+W;                                                // первый закон: Q=ΔU+W
    const out=[['t',s.t,'с'],['процесс',0,{iso:'изотерма',isobar:'изобара',isochor:'изохора',adiab:'адиабата'}[p.proc]],
            ['объём V',st.V,'л'],['давление P',st.P/1000,'кПа'],['температура T',st.T,'K'],
            ['работа газа W',W,'Дж'],['ΔU внутр. энергия',dU,'Дж'],['теплота Q = ΔU + W',Q,'Дж'],
            ['P·V',st.P*st.Vm,'Дж'],['νRT',p.n*this.R*st.T,'Дж']];
    if(p.proc==='isochor'){
      out.push(['нагреватель: от T₀ до T',p.Tend,'K'],
        ['работа при V = const',0,'газ не двигает поршень'],
        ['вся теплота идёт в ΔU',dU,'Дж'],
        ['P/T постоянно (закон Шарля)',st.P/st.T,'Па/К']);
    }
    return out;
  },
  graphs:[
    {label:'P(t) — давление',unit:'кПа',series:['P'],get(s,p){ return [SIMS.thermo.stateAt(p,s.u).P/1000,null]; }},
    {label:'T(t) — температура',unit:'K',series:['T'],get(s,p){ return [SIMS.thermo.stateAt(p,s.u).T,null]; }}
  ],
  presets:[
    {name:'Изотермическое расширение (закон Бойля)',values:{proc:'iso',n:1,T0:300,V0:10,Vend:25,tStop:0}},
    {name:'Изобарическое нагревание',values:{proc:'isobar',n:1,T0:300,V0:10,Vend:25,tStop:0}},
    {name:'Изохорический нагрев: 300 → 600 K',values:{proc:'isochor',n:1,T0:300,Tend:600,V0:15,Vend:15,tStop:0}},
    {name:'Изохорическое охлаждение: 600 → 200 K',values:{proc:'isochor',n:1,T0:600,Tend:200,V0:15,Vend:15,tStop:0}},
    {name:'Адиабатическое расширение (Q = 0)',values:{proc:'adiab',n:1,T0:600,V0:8,Vend:25,gamma:1.4,tStop:0}},
    {name:'Адиабата одноатомного газа γ=1.67',values:{proc:'adiab',n:1,T0:600,V0:8,Vend:25,gamma:1.67,tStop:0}}
  ],
  fit(p,vp){
    const W=(vp&&vp.W)||460,H=(vp&&vp.H)||320;
    const scale=clamp(Math.min((W-80)/(6*PX_PER_M),(H-80)/(8*PX_PER_M)),0.002,30);
    return {x:0,y:0,scale};
  },
  draw(ctx,s,v,p){
    const acc=v.c('--accent'), sec=v.c('--second'), ink=v.c('--ink-2'), ink3=v.c('--ink-3');
    const st=this.stateAt(p,s.u);
    // диапазон объёма для положения поршня
    let Vmin=1e18,Vmax=-1e18;
    for(let u=0;u<=1;u+=0.05){ const q=this.stateAt(p,u); Vmin=Math.min(Vmin,q.V);Vmax=Math.max(Vmax,q.V); }
    if(p.proc==='isochor'){ Vmin=p.V0-2; Vmax=p.V0+2; }
    const uV=(st.V-Vmin)/(Vmax-Vmin+1e-9);
    // цилиндр по центру сцены
    const cx=-1.4, cyTop=-3, cyH=6, cw=2.8;
    const pistonY=cyTop+cyH*(1-clamp(uV,0.08,0.95));
    // стенки
    ctx.strokeStyle=ink; ctx.lineWidth=v.lw(2.5);
    ctx.beginPath(); ctx.moveTo(cx,cyTop); ctx.lineTo(cx,cyTop+cyH); ctx.lineTo(cx+cw,cyTop+cyH); ctx.lineTo(cx+cw,cyTop); ctx.stroke();
    // газ
    ctx.fillStyle=acc; ctx.globalAlpha=.12; ctx.fillRect(cx,pistonY,cw,cyTop+cyH-pistonY); ctx.globalAlpha=1;
    // молекулы
    if(p.showMol){
      ctx.fillStyle=acc;
      for(const m of s.mol){ const mx=cx+0.15+m.x*(cw-0.3), my=pistonY+0.15+m.y*(cyTop+cyH-pistonY-0.3);
        ctx.beginPath(); ctx.arc(mx,my,v.lw(3),0,7); ctx.fill(); }
    }
    // поршень + шток
    ctx.fillStyle=sec; ctx.fillRect(cx,pistonY-0.22,cw,0.22);
    ctx.strokeStyle=sec; ctx.lineWidth=v.lw(2.5); ctx.beginPath(); ctx.moveTo(cx+cw/2,pistonY-0.22); ctx.lineTo(cx+cw/2,cyTop-1); ctx.stroke();
    v.label(ctx,'поршень',cx+cw,pistonY,8,0,sec);
    // подписи состояния
    v.label(ctx,`V = ${st.V.toFixed(1)} л`,cx+cw/2,cyTop+cyH,-16,20,ink3);
    v.label(ctx,`P = ${(st.P/1000).toFixed(0)} кПа`,cx+cw/2,cyTop+cyH,-16,34,ink3);
    v.label(ctx,`T = ${st.T.toFixed(0)} K`,cx+cw/2,cyTop+cyH,-16,48,ink3);
    const nm={iso:'изотермический',isobar:'изобарический',isochor:'изохорический',adiab:'адиабатический'}[p.proc];
    v.label(ctx,nm+' процесс',cx+cw/2,cyTop,-40,-10,ink3);
    v.label(ctx,'PV-диаграмма — на панели справа →',cx+cw/2,cyTop,-70,-26,ink3);
  }
}

carnot:{
  title:'Второй закон: цикл Карно и энтропия',
  params:[
    {key:'T1', label:'Температура нагревателя T₁',unit:'K',min:300,max:1200,step:10,default:500},
    {key:'T2', label:'Температура холодильника T₂',unit:'K',min:100,max:500,step:10,default:350},

    {key:'ratio',label:'Степень изотермического расширения (Vᴮ/Vᴬ)',min:1.2,max:3,step:0.1,default:1.6},
    {key:'gamma',label:'Показатель адиабаты γ',min:1.1,max:1.67,step:0.01,default:1.5},

    {type:'group',label:'Показывать'},
    {key:'showArea',label:'Площадь цикла = работа',type:'check',default:true},
    {key:'showRes', label:'Резервуары (нагреватель/холодильник)',type:'check',default:true},

    {type:'group',label:'Остановка таймера'},
    {key:'cycles',label:'Через N циклов (0 — выкл)',min:0,max:20,step:0.5,default:0},
    {key:'tStop', label:'В момент t (0 — выкл)',unit:'с',min:0,max:600,step:0.1,default:0}
  ],
  R:8.314,
  /* Четыре точки цикла Карно:
     A→B изотерма при T₁ (расширение), B→C адиабата (T₁→T₂),
     C→D изотерма при T₂ (сжатие),   D→A адиабата (T₂→T₁).            */
  points(p){
    const R=this.R, VA=p.Va/1000, VB=VA*p.ratio;
    const PA=p.n*R*p.T1/VA, PB=p.n*R*p.T1/VB;
    // адиабата B→C: T₁ VB^(γ-1) = T₂ VC^(γ-1)
    const VC=VB*Math.pow(p.T1/p.T2, 1/(p.gamma-1));
    const PC=p.n*R*p.T2/VC;
    // адиабата D→A: T₂ VD^(γ-1) = T₁ VA^(γ-1)
    const VD=VA*Math.pow(p.T1/p.T2, 1/(p.gamma-1));
    const PD=p.n*R*p.T2/VD;
    return {VA,VB,VC,VD,PA,PB,PC,PD};
  },
  /* состояние на цикле по фазе f∈[0,4): 0-1 A→B, 1-2 B→C, 2-3 C→D, 3-4 D→A */
  stateAt(p,f){
    const R=this.R, pt=this.points(p);
    f=((f%4)+4)%4; const seg=Math.floor(f), u=f-seg;
    let V,P,T;
    if(seg===0){ T=p.T1; V=pt.VA+(pt.VB-pt.VA)*u; P=p.n*R*T/V; }
    else if(seg===1){ V=pt.VB+(pt.VC-pt.VB)*u; P=pt.PB*Math.pow(pt.VB/V,p.gamma); T=P*V/(p.n*R); }
    else if(seg===2){ T=p.T2; V=pt.VC+(pt.VD-pt.VC)*u; P=p.n*R*T/V; }
    else { V=pt.VD+(pt.VA-pt.VD)*u; P=pt.PD*Math.pow(pt.VD/V,p.gamma); T=P*V/(p.n*R); }
    return {V:V*1000, Vm:V, P, T};
  },
  /* КПД и теплоты */
  perf(p){
    const R=this.R, pt=this.points(p);
    const Q1=p.n*R*p.T1*Math.log(pt.VB/pt.VA);      // тепло от нагревателя (изотерма A→B)
    const Q2=p.n*R*p.T2*Math.log(pt.VC/pt.VD);      // тепло холодильнику (изотерма C→D)
    const W=Q1-Q2;                                   // работа за цикл
    const eff=1-p.T2/p.T1;                           // КПД Карно
    return {Q1,Q2,W,eff,effReal:W/Q1};
  },
  init(p){ return {t:0,f:0,cycles:0,event:null,__stop:null}; },
  step(s,dt,p){
    if(s.event) return;
    const t=s.t+dt;
    if(p.tStop>0&&t>=p.tStop&&!(s.done&&s.done.time)){ s.t=p.tStop; s.event={t:p.tStop,type:'time'};
      s.__stop=`Остановка по времени: t = ${p.tStop.toFixed(2)} с`; return; }
    s.t=t;
    s.f+=dt*0.8; s.cycles=s.f/4;
    if(p.cycles>0 && s.cycles>=p.cycles && !(s.done&&s.done.cyc)){
      s.event={t:s.t,type:'cycles'};
      s.__stop=`Пройдено ${p.cycles} цикл(ов): совершена работа ${(this.perf(p).W*p.cycles).toFixed(0)} Дж`;
    }
  },
  anchors(s,p){ return [{x:0,y:0}]; },
  readouts(s,p){
    const pf=this.perf(p), st=this.stateAt(p,s.f);
    const seg=Math.floor(((s.f%4)+4)%4);
    const phase=['A→B: изотерм. расширение (T₁)','B→C: адиабат. расширение','C→D: изотерм. сжатие (T₂)','D→A: адиабат. сжатие'][seg];
    return [['t',s.t,'с'],['фаза',0,phase],
            ['объём V',st.V,'л'],['давление P',st.P/1000,'кПа'],['температура T',st.T,'K'],
            ['Q₁ от нагревателя',pf.Q1,'Дж'],['Q₂ холодильнику',pf.Q2,'Дж'],
            ['работа за цикл W',pf.W,'Дж'],
            ['КПД Карно = 1−T₂/T₁',pf.eff*100,'%'],
            ['проверка W/Q₁',pf.effReal*100,'%'],
            ['циклов пройдено',s.cycles,'']];
  },
  graphs:[
    {label:'Температура во времени',unit:'K',series:['T'],get(s,p){ return [SIMS.carnot.stateAt(p,s.f).T,null]; }},
    {label:'Давление во времени',unit:'кПа',series:['P'],get(s,p){ return [SIMS.carnot.stateAt(p,s.f).P/1000,null]; }}
  ],
  presets:[
    {name:'Карно T₁=500, T₂=350 (КПД 30%)',values:{T1:500,T2:350,n:1,Va:8,ratio:1.6,gamma:1.5,cycles:0,tStop:0}},
    {name:'Высокий КПД: T₁=600, T₂=300',values:{T1:600,T2:300,n:1,Va:8,ratio:1.5,gamma:1.5,cycles:0,tStop:0}},
    {name:'Низкий КПД: T₁=400, T₂=360',values:{T1:400,T2:360,n:1,Va:8,ratio:1.6,gamma:1.5,cycles:0,tStop:0}},
    {name:'Один полный цикл',values:{T1:500,T2:350,n:1,Va:8,ratio:1.6,gamma:1.5,cycles:1,tStop:0}}
  ],
  fit(p,vp){ return {x:0,y:0,scale:1}; },       // сцена рисует резервуары; PV — в панели
  draw(ctx,s,v,p){
    const acc=v.c('--accent'), sec=v.c('--second'), meas=v.c('--measure'), dang=v.c('--danger'), ink=v.c('--ink-2'), ink3=v.c('--ink-3');
    const st=this.stateAt(p,s.f), seg=Math.floor(((s.f%4)+4)%4);
    // цилиндр по центру

    const pt=this.points(p);
    const Vmin=Math.min(pt.VA,pt.VB,pt.VC,pt.VD)*1000, Vmax=Math.max(pt.VA,pt.VB,pt.VC,pt.VD)*1000;
    const uV=(st.V-Vmin)/(Vmax-Vmin+1e-9);
    const pistonY=cyTop+cyH*(1-clamp(uV,0.08,0.95));

    if(p.showRes){
      // нагреватель снизу (красный), когда контакт на изотерме T1 (seg 0)

      ctx.fillRect(cx-0.3,cyTop+cyH+0.15,cw+0.6,0.5); ctx.globalAlpha=1;
      v.label(ctx,`нагреватель T₁ = ${p.T1} K`,cx+cw/2,cyTop+cyH+0.65,-50,10,seg===0?dang:ink3);
      // холодильник сверху (синий), контакт на изотерме T2 (seg 2)
      ctx.fillStyle=sec; ctx.globalAlpha=seg===2?0.5:0.15;
      ctx.fillRect(cx-0.3,cyTop-0.9,cw+0.6,0.5); ctx.globalAlpha=1;
      v.label(ctx,`холодильник T₂ = ${p.T2} K`,cx+cw/2,cyTop-0.9,-50,-4,seg===2?sec:ink3);
    }

    ctx.strokeStyle=ink; ctx.lineWidth=v.lw(2.5);
    ctx.beginPath(); ctx.moveTo(cx,cyTop); ctx.lineTo(cx,cyTop+cyH); ctx.lineTo(cx+cw,cyTop+cyH); ctx.lineTo(cx+cw,cyTop); ctx.stroke();
    ctx.fillStyle=acc; ctx.globalAlpha=.12; ctx.fillRect(cx,pistonY,cw,cyTop+cyH-pistonY); ctx.globalAlpha=1;
    ctx.fillStyle=sec; ctx.fillRect(cx,pistonY-0.22,cw,0.22);
    ctx.strokeStyle=sec; ctx.lineWidth=v.lw(2.5); ctx.beginPath(); ctx.moveTo(cx+cw/2,pistonY-0.22); ctx.lineTo(cx+cw/2,cyTop-1.4); ctx.stroke();
    const phase=['A→B изотерм. расширение','B→C адиабат. расширение','C→D изотерм. сжатие','D→A адиабат. сжатие'][seg];
    v.label(ctx,phase,cx+cw/2,cyTop,-46,-30,ink3);
    v.label(ctx,`T = ${st.T.toFixed(0)} K`,cx+cw/2,pistonY,cw*20+6,0,ink3);
    v.label(ctx,'цикл Карно — на панели справа →',cx+cw/2,cyTop+cyH,-64,26,ink3);
  }
}
,
