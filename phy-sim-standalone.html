const T_dyn={
  id:'mech.dyn', ch:'3', title:'Динамика',
  theory:`
  <p>Кинематика описывала движение, ничего не спрашивая о его причине. Динамика отвечает на вопрос
  <strong>почему</strong> тело движется именно так. Весь ответ умещается в одну строчку — второй закон Ньютона —
  но вся сложность в том, чтобы честно перечислить силы.</p>

  <h3 class="sub">Три закона</h3>
  <ul>
    <li><strong>Первый.</strong> Свободное тело движется равномерно и прямолинейно. Это не частный случай второго
    закона, а определение <em>инерциальной системы отсчёта</em> — той, в которой второй закон вообще имеет силу.</li>
    <li><strong>Второй.</strong> $\\vec F_{\\text{рез}}=m\\vec a$. Важно каждое слово: <em>результирующая</em>
    (векторная сумма всех сил), <em>масса</em> (мера инертности, а не «количество вещества») и <em>ускорение</em>
    (а не скорость!). Тело может лететь быстро и не иметь ускорения — тогда сумма сил равна нулю.</li>
    <li><strong>Третий.</strong> Силы всегда парны: если стол давит на брусок, брусок давит на стол. Ключ к
    решению задач: <strong>эти две силы приложены к разным телам</strong> и потому никогда не сокращаются
    в одном уравнении.</li>
  </ul>
  <p>Единица силы следует из второго закона: $1\\ \\text{Н}=1\\ \\text{кг}\\cdot\\text{м/с}^2$ — сила, сообщающая
  килограмму ускорение $1$ м/с².</p>

  <h3 class="sub">Контактные силы: реакция опоры и трение</h3>
  <p>Когда брусок лежит на столе, атомы поверхностей отталкиваются — возникает <strong>сила реакции $\\vec N$</strong>,
  перпендикулярная поверхности. Она не «всегда равна $mg$»: она равна ровно тому, что нужно, чтобы тело не
  провалилось. Потяните брусок за верёвку под углом вверх — и $N$ уменьшится: $N=mg-F\\sin\\alpha$.</p>
  <p>Вдоль поверхности действует <strong>трение</strong>, и оно бывает двух сортов:</p>
  <ul>
    <li><strong>Трение покоя</strong> подстраивается под внешнюю силу и держит тело, пока хватает сил:
    $F_{\\text{тр}}\\le\\mu_s N$. Это неравенство, а не равенство — вот главная ловушка.</li>
    <li><strong>Трение скольжения</strong> постоянно и всегда направлено против скорости: $F_{\\text{тр}}=\\mu_d N$.
    Обычно $\\mu_d<\\mu_s$ — поэтому сдвинуть тело труднее, чем везти, и поэтому сорвавшееся тело резко дёргается.</li>
  </ul>
  <div class="callout"><strong>Проверьте в симуляции «Второй закон и трение».</strong> Ставьте $m=10$ кг,
  $\\mu_s=0{,}5$ и увеличивайте $F$ по 1 Н. До $F=49$ Н ничего не происходит — трение покоя гасит тягу целиком.
  На пороге тело срывается, и таймер останавливает событие «срыв с места».</div>

  <h3 class="sub">Импульс и его сохранение</h3>
  <p>Второй закон Ньютона можно записать иначе. Раз $\\vec a=d\\vec v/dt$, то
  $\\vec F=m\,d\\vec v/dt=d(m\\vec v)/dt$. Величина $\\vec p=m\\vec v$ называется <strong>импульсом</strong>
  (количеством движения), и закон принимает вид: <em>сила есть скорость изменения импульса</em>.
  Это более глубокая формулировка — она работает даже там, где масса меняется.</p>
  <p>Теперь возьмём систему из нескольких тел. Силы делятся на <strong>внутренние</strong> (тела действуют
  друг на друга) и <strong>внешние</strong>. По третьему закону внутренние силы идут парами
  $\\vec F_{12}=-\\vec F_{21}$ и при сложении по всей системе <strong>взаимно уничтожаются</strong>. Остаётся:</p>
  <div class="callout"><strong>Закон сохранения импульса.</strong> Если сумма внешних сил равна нулю
  (система замкнута), суммарный импульс не меняется: $\\sum m_i\\vec v_i=\\text{const}$.
  Внутренние силы — какими бы страшными они ни были — перераспределяют импульс между телами, но не меняют
  его сумму. Именно поэтому удар можно рассчитать, ничего не зная о силах в момент удара.</div>
  <p>Обратите внимание на условие: <em>внешние силы равны нулю</em>. Трение о поверхность — внешняя сила,
  и она импульс уносит. Поэтому в симуляции для чистого опыта нужно поставить телам «гладкие» поверхности:
  тогда график $\\Sigma p(t)$ — идеально горизонтальная линия, что бы ни творилось при ударе.</p>

  <h3 class="sub">Удары: что сохраняется, а что нет</h3>
  <p>Импульс сохраняется в любом ударе. Кинетическая энергия — <strong>только в абсолютно упругом</strong>.
  Меру «упругости» задаёт коэффициент восстановления
  $e=-\\dfrac{v_2'-v_1'}{v_2-v_1}$ (относительная скорость разлёта, делённая на относительную скорость сближения):</p>
  <ul>
    <li>$e=1$ — <strong>абсолютно упругий</strong> удар: энергия сохраняется. При равных массах тела просто
    обмениваются скоростями — налетающее останавливается, покоившееся уезжает.</li>
    <li>$e=0$ — <strong>абсолютно неупругий</strong>: тела слипаются и едут вместе со скоростью центра масс.
    Потери энергии максимальны, но импульс — снова тот же.</li>
    <li>$0<e<1$ — реальный удар, часть энергии уходит в тепло и деформацию.</li>
  </ul>
  <div class="callout">Загрузите пресет «Абсолютно упругий удар»: посмотрите на графики. $\\Sigma p$ — прямая,
  $\\Sigma E$ — прямая. Переключите $e=0$ — $\\Sigma p$ по-прежнему прямая, а $\\Sigma E$ падает ступенькой.
  Вот эта картинка и есть весь смысл главы.</div>

  <h3 class="sub">Как решать задачи по динамике (алгоритм Орира)</h3>
  <ol style="margin:0 0 12px 20px;line-height:1.65">
    <li>Выбрать <strong>одно</strong> тело и мысленно вырезать его из мира.</li>
    <li>Нарисовать <strong>все</strong> силы, действующие на него, — и ни одной лишней (сила «инерции» или сила,
    с которой тело действует на опору, сюда не входят).</li>
    <li>Выбрать оси. Разумно направить одну ось вдоль ускорения.</li>
    <li>Записать $\\sum F_x=ma_x$ и $\\sum F_y=ma_y$. Если тело не ускоряется по оси — сумма равна нулю.</li>
    <li>Если тел несколько — повторить для каждого и связать их уравнением связи (нить нерастяжима: ускорения равны).</li>
  </ol>
  <p>Именно диаграмму из пункта 2 (её называют диаграммой свободного тела) рисуют все симуляции этой главы:
  вы видите $\\vec F_g$, $\\vec N$, $\\vec F_{\\text{тр}}$, $\\vec T$ и пунктиром — их сумму. Рядом строится
  многоугольник сил: если тело покоится, он замыкается в нуль.</p>

  <h3 class="sub">Наклонная плоскость</h3>
  <p>Разложим вес на составляющие вдоль плоскости ($mg\\sin\\theta$ — скатывает) и поперёк неё ($mg\\cos\\theta$ —
  прижимает). Тогда $N=mg\\cos\\theta$, и условие покоя $mg\\sin\\theta\\le\\mu_s\\,mg\\cos\\theta$ превращается в
  красивое: <strong>$\\tan\\theta\\le\\mu_s$</strong>. Масса выпала!</p>
  <div class="callout"><strong>Пример 3 (Орир).</strong> Плоскость медленно наклоняют; брусок трогается при
  $\\theta=20^\\circ$. Значит $\\mu_s=\\tan 20^\\circ\\approx0{,}36$. Так измеряют коэффициент трения — без динамометра.
  Загрузите пресет «Пример 3» и посмотрите, как симуляция сама поймает момент срыва.</div>

  <h3 class="sub">Связанные тела и машина Атвуда</h3>
  <p>Два груза на нити через блок: нить нерастяжима, поэтому ускорения одинаковы по модулю, а натяжение $T$
  одинаково по всей нити (блок и нить считаем невесомыми). Пишем второй закон для каждого груза, складываем — $T$
  сокращается:</p>
  <p>Смысл машины Атвуда в том, что она <strong>искусственно замедляет свободное падение</strong>: при близких
  массах ускорение мало, и его удобно измерять секундомером. Так во времена Атвуда и проверяли законы Ньютона.</p>

  <h3 class="sub">Подвижный блок и полиспаст</h3>
  <p>Неподвижный блок ничего не выигрывает — он только меняет направление силы. А вот <strong>подвижный блок</strong>
  висит на двух нитях, и каждая держит половину груза: чтобы поднять $m_2$, нужно тянуть с силой $m_2g/2$.
  Плата — путь: чтобы поднять груз на 1 м, нужно вытянуть 2 м нити. Золотое правило механики: во сколько раз
  выигрываем в силе, во столько же проигрываем в пути.</p>
  <p>Если груз висит на $k$ нитях ($k=2n$ для $n$ подвижных блоков), то $a_1=k\,a_2$, и второй закон для обоих тел даёт</p>
  <div class="callout">Проверьте: поставьте один подвижный блок и $m_2=2m_1$ — система будет в равновесии,
  хотя массы различаются вдвое. Именно это и есть выигрыш в силе.</div>

  <h3 class="sub">Конический маятник</h3>
  <p>Груз на нити описывает горизонтальную окружность. На него действуют всего две силы: вес и натяжение.
  По вертикали ускорения нет: $T\\cos\\theta=mg$. По горизонтали ускорение — центростремительное:
  $T\\sin\\theta=ma_c=mv^2/R$. Разделив второе на первое, получаем $a_c=g\\tan\\theta$ — и снова масса выпала.</p>
  <p>Здесь смыкаются главы 3 и 4: кинематика дала $a_c=v^2/R$, а динамика говорит, какая сила его создаёт.
  Обратите внимание на натяжение: при $\\theta\\to90^\\circ$ оно уходит в бесконечность — раскрутить маятник
  «строго горизонтально» нельзя ни при какой скорости.</p>`,
  formulas:[
    {tex:'\\vec F_{\\text{рез}}=m\\vec a,\\qquad \\sum F_x=ma_x,\\quad \\sum F_y=ma_y',
     note:'Второй закон Ньютона. Складываются <em>все</em> силы, действующие на <em>одно</em> тело.', sim:'newton2'},
    {tex:'F_g=mg,\\qquad N=mg-F\\sin\\alpha',
     note:'Вес и реакция опоры. Реакция не равна весу, если силу прикладывают под углом.', sim:'newton2'},
    {tex:'F_{\\text{тр}}\\le\\mu_s N\\quad(\\text{покой}),\\qquad F_{\\text{тр}}=\\mu_d N\\quad(\\text{скольжение})',
     note:'Трение покоя — неравенство: оно подстраивается под тягу, пока хватает сил.', sim:'newton2'},
    {tex:'\\vec p=m\\vec v,\\qquad \\vec F=\\dfrac{d\\vec p}{dt}',
     note:'Импульс и вторая формулировка второго закона.', sim:'newton2'},
    {tex:'\\sum_i m_i\\vec v_i=\\text{const}\\quad(\\text{если }\\sum \\vec F_{\\text{внеш}}=0)',
     note:'Закон сохранения импульса: внутренние силы взаимно уничтожаются по третьему закону.', sim:'newton2'},
    {tex:"v_1'=\\dfrac{(m_1-e\\,m_2)v_1+(1+e)m_2v_2}{m_1+m_2},\\qquad v_2'=\\dfrac{(m_2-e\\,m_1)v_2+(1+e)m_1v_1}{m_1+m_2}",
     note:'Скорости после удара с коэффициентом восстановления $e$.', sim:'newton2'},
    {tex:'\\Delta E=\\dfrac{1-e^2}{2}\\cdot\\dfrac{m_1m_2}{m_1+m_2}\\,(v_1-v_2)^2',
     note:'Потеря кинетической энергии при ударе. При $e=1$ она равна нулю.', sim:'newton2'},

    {tex:'T_{\\text{низ}}=2T,\\qquad a_{\\text{оси}}=\\dfrac{a_1+a_2}{2}',

const T_grav={
  id:'mech.grav', ch:'4', title:'Гравитация',
  theory:`
  <p>В уравнении $\\vec F=m\\vec a$ сила может быть любой природы. В этой главе речь об одной, самой универсальной —
  <strong>силе тяготения</strong>, которая действует между любыми двумя телами во Вселенной.</p>

  <h3 class="sub">Закон всемирного тяготения</h3>
  <p>Летом 1665 года Ньютон, глядя на падающее яблоко, задался вопросом: если Земля притягивает яблоко, то,
  наверное, такая же сила действует между любыми двумя телами. Раз сила пропорциональна массе яблока, она должна
  быть пропорциональна и каждой из масс по отдельности: $F\\sim m_1m_2$.</p>
  <p>Дальше Ньютон спросил, слабеет ли притяжение с расстоянием. Он рассудил так: если поднять яблоко до Луны,
  оно должно двигаться с тем же ускорением, что и Луна. Ускорение Луны (через $a_c=4\\pi^2R/T^2$) оказалось
  в 3600 раз меньше $g$, а расстояние до Луны — в 60 раз больше радиуса Земли. Поскольку $3600=60^2$, сила убывает
  <strong>обратно пропорционально квадрату расстояния</strong>. Так родился закон:</p>
  <div class="callout">Здесь $G=6{,}67\\cdot10^{-11}$ Н·м²/кг² — гравитационная постоянная. Она крохотная: два тела
  по 1 кг на расстоянии 10 см притягиваются с силой $6{,}67\\cdot10^{-9}$ Н — миллиардные доли веса. Именно поэтому
  тяготение мы замечаем только рядом с огромными массами вроде планет.</div>
  <p>Ньютон доказал (и это заняло у него 20 лет и потребовало создания интегрального исчисления), что однородный
  шар притягивает так, <strong>как если бы вся его масса была в центре</strong>. Поэтому в формулу подставляют
  расстояние до центра тела, а не до поверхности.</p>

  <h3 class="sub">Опыт Кавендиша: «взвешивание» Земли</h3>
  <p>Сам Ньютон вычислил $G$, лишь угадав среднюю плотность Земли. В 1797 году Генри Кавендиш измерил $G$ напрямую:
  он подвесил на тонкой кварцевой нити лёгкий стержень с двумя свинцовыми шариками и по закручиванию нити измерил
  ничтожную силу притяжения к двум большим шарам. Зная $G$, из $g=GM_3/R_3^2$ он вычислил массу Земли:</p>
  <p>Тем же способом Кавендиш «взвесил» Солнце, Юпитер и все планеты, у которых есть спутники: для тела массой $m$,
  обращающегося вокруг тела массой $M$, из $GMm/R^2=m\\cdot4\\pi^2R/T^2$ следует $M=4\\pi^2R^3/GT^2$ — достаточно знать
  радиус орбиты и период.</p>

  <h3 class="sub">Законы Кеплера</h3>
  <p>Ещё до Ньютона Иоганн Кеплер, разбирая многолетние наблюдения Марса, вывел три закона движения планет.
  Они укрепили гипотезу Коперника — за что Джордано Бруно был сожжён, а Галилей осуждён инквизицией.</p>
  <ul>
    <li><strong>Первый закон.</strong> Каждая планета движется по эллипсу, в одном из фокусов которого — Солнце.</li>
    <li><strong>Второй закон (закон равных площадей).</strong> Прямая Солнце — планета заметает равные площади за
    равные времена. У перигелия планета летит быстрее, у афелия — медленнее. Это прямое следствие
    <em>сохранения момента импульса</em>.</li>
    <li><strong>Третий закон.</strong> Кубы больших полуосей относятся как квадраты периодов: для круговых орбит
    $R_1^3/R_2^3=T_1^2/T_2^2$.</li>
  </ul>
  <p>Ньютон доказал обратное и куда более сильное утверждение: все три закона Кеплера — <strong>следствия</strong>
  закона обратных квадратов. Эллиптические орбиты получаются тогда и только тогда, когда сила убывает как $1/r^2$.
  Это считается окончательным подтверждением ньютоновской механики. Третий закон легко вывести для круговой орбиты:
  приравняв $M=4\\pi^2R_1^3/GT_1^2=4\\pi^2R_2^3/GT_2^2$, сразу получаем $R_1^3/R_2^3=T_1^2/T_2^2$.</p>
  <div class="callout"><strong>Круговая и вторая космическая скорости.</strong> Чтобы удержаться на круговой орбите
  радиуса $r$, нужна скорость $v_{\\text{кр}}=\\sqrt{GM/r}$: тяготение целиком идёт на центростремительное ускорение.
  Разгонишь спутник слабее — он пойдёт по эллипсу вниз и может упасть; сильнее — эллипс вытянется вверх. При
  $v=\\sqrt{2GM/r}$ (вторая космическая) орбита размыкается в параболу, и тело улетает навсегда. Всё это видно
  в симуляции: меняйте $v_0$ вокруг подсказанной круговой скорости.</div>

  <h3 class="sub">Вес и кажущийся вес</h3>
  <p>Вес — это не масса. Вес обычно определяют как силу тяжести, действующую на тело; у поверхности Земли он равен
  $mg$. На Луне та же масса весит вшестеро меньше: $F_{\\text{л}}/F_{\\text{з}}=(M_{\\text{л}}/M_{\\text{з}})(R_{\\text{з}}/R_{\\text{л}})^2\\approx0{,}165$.</p>
  <p>Но у ускоренно движущихся тел это определение подводит. Вводят <strong>кажущийся вес</strong> — показание
  пружинных весов, то есть силу, с которой тело давит на опору. Для человека в лифте с ускорением
  $\\vec F_w=m(\\vec g-\\vec a)$:</p>
  <ul>
    <li>лифт разгоняется вверх — весы показывают $m(g+a)$, вес «тяжелеет»;</li>
    <li>лифт тормозит или падает вниз — вес «легчает», $m(g-a)$;</li>
    <li>свободное падение ($a=g$) — кажущийся вес равен нулю, <strong>невесомость</strong>.</li>
  </ul>
  <div class="callout">Космонавт на орбите невесом не потому, что там «нет тяготения» — оно там почти такое же, как
  у поверхности. Он вместе со станцией находится в постоянном <strong>свободном падении</strong>: падает по орбите,
  всё время «промахиваясь» мимо Земли. Поэтому весы показали бы ноль.</div>`,
  formulas:[
    {tex:'F=G\\dfrac{m_1m_2}{r^2}',
     note:'Закон всемирного тяготения. $G=6{,}67\\cdot10^{-11}$ Н·м²/кг². Сила убывает как квадрат расстояния.', sim:'orbit'},
    {tex:'g=\\dfrac{GM}{R^2}\\quad\\Rightarrow\\quad M=\\dfrac{gR^2}{G}',
     note:'Ускорение свободного падения у поверхности и «взвешивание» планеты (Кавендиш).', sim:'orbit'},
    {tex:'v_{\\text{кр}}=\\sqrt{\\dfrac{GM}{r}},\\qquad v_2=\\sqrt{\\dfrac{2GM}{r}}',
     note:'Круговая скорость на орбите радиуса $r$ и вторая космическая (скорость убегания).', sim:'orbit'},
    {tex:'T=2\\pi\\sqrt{\\dfrac{r^3}{GM}},\\qquad M=\\dfrac{4\\pi^2R^3}{GT^2}',
     note:'Период обращения и масса центрального тела через радиус орбиты и период.', sim:'orbit'},
    {tex:'\\dfrac{R_1^3}{R_2^3}=\\dfrac{T_1^2}{T_2^2}',
     note:'Третий закон Кеплера (для круговых орбит; для эллипсов $R$ — большая полуось).', sim:'orbit'},
    {tex:'\\dfrac{dA}{dt}=\\text{const}',
     note:'Второй закон Кеплера: секторная скорость постоянна — следствие сохранения момента импульса.', sim:'orbit'},
    {tex:'\\vec F_w=m\\,(\\vec g-\\vec a)',

  ],

const T_work={
  id:'mech.work', ch:'5', title:'Работа и энергия',
  theory:`
  <p>Иногда решать задачу через $\\vec F=m\\vec a$ и траекторию слишком долго. Понятие <strong>энергии</strong>
  даёт обходной путь: часто ответ можно получить, вообще не вычисляя, как движется тело со временем —
  достаточно сравнить энергию в начале и в конце. В этом сила энергетического подхода.</p>

  <h3 class="sub">Работа</h3>
  <p>Когда сила $\\vec F$ перемещает тело на $\\vec s$, она совершает <strong>работу</strong>. Важно: работу
  совершает только та часть силы, что направлена вдоль перемещения. Если сила приложена под углом $\\alpha$
  к направлению движения, то работает лишь проекция $F\\cos\\alpha$:</p>
  <p>Работа — <strong>скаляр</strong> (число, а не вектор), и она может быть отрицательной. Сила трения всегда
  направлена против движения ($\\alpha=180^\\circ$, $\\cos\\alpha=-1$), поэтому её работа отрицательна — она
  <em>отнимает</em> энергию. Единица работы и энергии — <strong>джоуль</strong>: $1\\text{ Дж}=1\\text{ Н}\\cdot1\\text{ м}$.</p>
  <div class="callout"><strong>Пример 1 (Орир).</strong> Человек тянет санки под углом $30^\\circ$ с постоянной
  скоростью 1,5 м/с и совершает 100 Дж работы в секунду. Тогда $F=W/(s\\cos\\alpha)=100/(1{,}5\\cdot0{,}866)\\approx77$ Н.
  Это уже тяжёлая работа — примерно как ежесекундно поднимать 10 кг на метр.</div>

  <h3 class="sub">Мощность</h3>
  <p>Скорость передачи энергии называют <strong>мощностью</strong>: $P=dE/dt$. Единица — <strong>ватт</strong>
  ($1\\text{ Вт}=1\\text{ Дж/с}$). Лампочка 100 Вт расходует 100 Дж в секунду. Подставив $dE=F\,ds\\cos\\alpha$,
  получаем удобную форму $P=Fv\\cos\\alpha$ — мощность равна силе на скорость. Одна лошадиная сила — это 746 Вт.</p>

  <h3 class="sub">Кинетическая энергия и теорема о связи работы и энергии</h3>
  <p>Подсчитаем работу результирующей силы, заменив в интеграле $F_{\\text{рез}}=m\,dv/dt$ и $ds=v\,dt$.
  Интеграл сворачивается в разность величин $\\tfrac12mv^2$ в конце и в начале. Эту величину называют
  <strong>кинетической энергией</strong> $K=\\tfrac12mv^2$, а результат — теоремой:</p>
  <div class="callout"><strong>Теорема о связи работы и энергии.</strong> Работа результирующей силы равна
  приращению кинетической энергии: $W_{\\text{рез}}=K_B-K_A$. Разгоняем тело — работа положительна и $K$ растёт;
  тормозим — работа отрицательна и $K$ убывает. Это позволяет находить скорость, не зная времени движения.</div>
  <p><strong>Пример 6 (Орир): водопад.</strong> 30-метровый водопад сбрасывает 10 кг воды в секунду. Каждую секунду
  вода приобретает $K=mgh=10\\cdot9{,}8\\cdot30\\approx2{,}9$ кДж. Значит, идеальная ГЭС на нём давала бы около 2,9 кВт —
  примерно потребность одного дома.</p>

  <h3 class="sub">Потенциальная энергия</h3>
  <p>Работу некоторых сил удобно посчитать заранее и запасти как <strong>потенциальную энергию</strong> $U$ —
  «энергию, запасённую для дальнейшего использования». По определению изменение потенциальной энергии равно
  взятой с минусом работе силы взаимодействия: $U_B-U_A=-\\int_A^B \\vec F\\cdot d\\vec s$.</p>
  <p>Для тела у поверхности Земли работа силы тяжести при подъёме на высоту $h$ равна $-mgh$, поэтому
  <strong>гравитационная потенциальная энергия</strong> равна $U=mgh$. Для пружины, растянутой на $x$, сила равна
  $F=-kx$, и, проинтегрировав, получаем <strong>упругую энергию</strong> $U=\\tfrac12kx^2$.</p>
  <p>Обратная задача — найти силу по известной потенциальной энергии — решается через производную:
  $F_s=-dU/ds$. Сила всегда направлена туда, где потенциальная энергия убывает: мяч скатывается «под горку».</p>

  <h3 class="sub">Консервативные и неконсервативные силы</h3>
  <p>Потенциальную энергию можно ввести <strong>не для любой силы</strong>, а только для <strong>консервативной</strong> —
  такой, работа которой не зависит от пути, а только от начальной и конечной точек. Эквивалентно: работа
  консервативной силы по любому замкнутому пути равна нулю. Тяготение и упругость — консервативны.</p>
  <p><strong>Трение — неконсервативно.</strong> Его работа зависит от длины пути (чем длиннее путь, тем больше
  потеряно) и всегда отрицательна. Энергия при этом не исчезает: на микроуровне трение передаёт энергию
  беспорядочному движению частиц тела — тело <strong>нагревается</strong>. То, что мы называем «потерей энергии»,
  на самом деле её переход в тепло. Это увидим в главе о теплоте.</p>
  <div class="callout"><strong>Что показывает симуляция.</strong> Столбики сбоку — это формы энергии в данный момент.
  На гладкой горке кинетическая перетекает в потенциальную и обратно, а их <em>сумма постоянна</em>. Включите трение —
  и часть суммы начнёт уходить в красный столбик «тепло», а полная механическая энергия поползёт вниз. На пружине
  энергия колеблется между упругой и кинетической. При чистом трении вся кинетическая энергия целиком уходит в тепло —
  и это в точности работа силы трения $A=Fs$.</div>`,
  formulas:[
    {tex:'W=F\\,s\\cos\\alpha',
     note:'Работа силы. Работает только проекция вдоль перемещения. Работа — скаляр, может быть отрицательной.', sim:'energy'},
    {tex:'P=\\dfrac{dE}{dt}=F\\,v\\cos\\alpha',
     note:'Мощность — скорость передачи энергии. $1$ Вт $=1$ Дж/с, $1$ л.с. $=746$ Вт.', sim:'energy'},
    {tex:'K=\\tfrac12 m v^2',
     note:'Кинетическая энергия — энергия движения.', sim:'energy'},
    {tex:'W_{\\text{рез}}=K_B-K_A',
     note:'Теорема о связи работы и энергии: работа результирующей силы равна приращению кинетической энергии.', sim:'energy'},
    {tex:'U_{\\text{тяж}}=mgh,\\qquad U_{\\text{упр}}=\\tfrac12 k x^2',
     note:'Потенциальная энергия: гравитационная и упругая (пружина).', sim:'energy'},
    {tex:'U_B-U_A=-\\int_A^B \\vec F\\cdot d\\vec s,\\qquad F_s=-\\dfrac{dU}{ds}',
     note:'Определение потенциальной энергии и обратный переход: сила равна минус градиенту $U$.', sim:'energy'},
    {tex:'\\oint \\vec F\\cdot d\\vec s = 0',
     note:'Признак консервативной силы: работа по замкнутому пути равна нулю (тяготение, упругость). У трения — нет.', sim:'energy'}
  ],
  problems:[]

const T_econs={
  id:'mech.energy', ch:'6', title:'Закон сохранения энергии',
  theory:`
  <p>В прошлой главе энергия была удобным инструментом. Здесь она становится <strong>законом</strong> — одним из
  самых глубоких в физике. Если сложить все формы энергии замкнутой системы, сумма не меняется никогда: энергия

  <h3 class="sub">Импульс силы и удары</h3>
  <p>При соударении сила действует очень короткое время, и вычислять её напрямую тяжело. Зато легко посчитать её
  суммарное действие — <strong>импульс силы</strong> $\\vec I=\\int \\vec F\,dt$. Подставив $\\vec F=d\\vec p/dt$, получаем
  простую связь: импульс силы равен изменению импульса тела, $\\vec I=\\vec p_2-\\vec p_1$.</p>
  <div class="callout"><strong>Пример 5 (Орир).</strong> Автомобиль массой 1,5 т на скорости 20 м/с врезается в
  дерево и останавливается за 0,03 с. Средняя сила $F=\\dfrac{mv}{\\Delta t}=\\dfrac{1{,}5\\cdot10^3\\cdot20}{0{,}03}=10^6$ Н —
  в 70 раз больше веса машины. Отсюда виден смысл ремней и подушек: они <em>растягивают время</em> удара, а значит
  во столько же раз уменьшают силу.</p></div>

  <h3 class="sub">Полная механическая энергия</h3>
  <p>Сумму кинетической и потенциальной энергии называют <strong>полной механической энергией</strong> $E=K+U$.
  Пока действуют только консервативные силы (тяготение, упругость), она постоянна. Для спутника на орбите, например,
  полная энергия равна по величине кинетической, но отрицательна: $E=-\\dfrac{GMm}{2r}$ — связанное состояние
  «сидит в потенциальной яме» и не может улететь.</p>

  <h3 class="sub">Диаграммы потенциальной энергии</h3>
  <p>Это главный приём главы. Нарисуем кривую $U(x)$ и проведём горизонтальную линию на уровне полной энергии $E$.
  Тогда <strong>кинетическая энергия в каждой точке — это вертикальный отрезок между кривой и линией</strong>:
  $K=E-U$. Там, где линия $E$ пересекает кривую $U$, кинетическая энергия обращается в ноль — это
  <strong>точки поворота</strong>, дальше частице хода нет: область $U>E$ запрещена.</p>
  <div class="callout">Откройте симуляцию. Двигая уровень $E$, вы увидите главное:
  <ul style="margin:6px 0 0 18px">
    <li>в параболе пружины частица колеблется между двумя точками поворота — это и есть колебание;</li>
    <li>в гравитационной яме при $E<0$ движение финитно (орбита), при $E\\ge0$ — частица уходит на бесконечность;</li>
    <li>у барьера: если $E$ ниже вершины — частица отражается, если выше — проходит. Так работает энергия
    активации в химии и вылет из ядра в физике.</li>
  </ul></div>
  <p>Форма кривой сразу говорит о силе: $F=-\\dfrac{dU}{dx}$. Там, где кривая круче, сила больше; в минимуме
  потенциала сила равна нулю — это положение устойчивого равновесия.</p>

  <h3 class="sub">Когда есть трение и внешние силы</h3>
  <p>Трение — не консервативная сила: работа по замкнутому пути не равна нулю, механическая энергия «теряется».
  Но она не исчезает — переходит в тепло. Полный баланс, с учётом внешней силы, записывается так:</p>
  <p>Здесь $\\Delta U_{\\text{внутр}}$ — приращение тепловой, химической и прочей внутренней энергии. Механическая
  энергия сохраняется лишь как частный случай, когда трения и внешних сил нет.</p>
  <div class="callout"><strong>Пример (Орир).</strong> Прыгун в воду теряет всю кинетическую энергию на
  сопротивление воды $F\\approx\\rho A v^2/2$. Расчёт показывает безопасную глубину около 15 м — при большем прыжке
  нужно уменьшать площадь входа (входить «солдатиком»), иначе энергия торможения травмоопасна. Это тот же закон
  сохранения, просто одна из форм энергии — работа силы сопротивления.</div>

  <h3 class="sub">Почему закон сохранения так важен</h3>
  <p>Ценность закона в том, что он связывает <em>начало и конец</em>, не требуя знать, что происходило между ними.
  Не нужно интегрировать уравнения движения — достаточно приравнять энергию до и после. Именно так выводится
  вторая космическая скорость: приравняв полную энергию у поверхности к нулю (энергия на бесконечности),
  $\\dfrac12 mv_0^2-\\dfrac{GMm}{R}=0$, сразу получаем $v_0=\\sqrt{2GM/R}$.</p>`,
  formulas:[
    {tex:'\\vec I=\\int_{t_1}^{t_2}\\vec F\\,dt=\\vec p_2-\\vec p_1',

const T_rot={
  id:'mech.rot', ch:'7', title:'Статика: равновесие тел',
  theory:`
  <p>До сих пор мы рассматривали тела как точки. Но мост, лестница или подъёмный кран — это протяжённые тела,
  и для них мало потребовать «сумма сил равна нулю»: тело может не двигаться как целое, но при этом
  <strong>вращаться</strong>. Статика изучает, при каких условиях твёрдое тело остаётся в полном покое.</p>

  <h3 class="sub">Момент силы</h3>
  <p>Вращающее действие силы зависит не только от её величины, но и от того, где она приложена.Момент силы
  (крутящий момент) равен произведению силы на <strong>плечо</strong> — кратчайшее расстояние от оси вращения до
  линии действия силы: $\\tau=rF\\sin\\theta$, где $\\theta$ — угол между радиус-вектором и силой.</p>
  <div class="callout">Именно поэтому дверь легче открыть, толкая за край, а не у петель: там больше плечо.
  И поэтому длинным гаечным ключом отвернуть болт проще — тот же момент достигается меньшей силой.</div>
  <p>Момент считают положительным при вращении против часовой стрелки и отрицательным — по часовой.</p>

  <h3 class="sub">Два условия равновесия</h3>
  <p>Чтобы твёрдое тело покоилось, по Ориру необходимо и достаточно выполнения <strong>двух</strong> условий:</p>
  <ul>
    <li><strong>Условие I.</strong> Векторная сумма всех сил равна нулю: $\\sum\\vec F=0$. Это следствие первого
    закона Ньютона — тело не движется поступательно. В плоскости даёт два уравнения: $\\sum F_x=0$, $\\sum F_y=0$.</li>
    <li><strong>Условие II.</strong> Сумма моментов всех сил равна нулю: $\\sum\\tau=0$. Это следует из
    $\\vec\\tau_{\\text{рез}}=d\\vec L/dt$: если момент импульса не меняется, тело не раскручивается.</li>
  </ul>
  <p>Вместе это система из трёх уравнений — можно найти три неизвестных (обычно силы реакции опор). Хитрость
  решения: <strong>ось для моментов выбирают там, где приложена неизвестная сила</strong> — тогда её плечо равно
  нулю и она выпадает из уравнения моментов.</p>

  <h3 class="sub">Рычаг</h3>
  <p>Простейшая система — стержень с двумя грузами на опоре (пример 11 Орира). Тело не вращается, когда моменты
  весов относительно опоры равны: $m_1g\\cdot a=m_2g\\cdot b$. Отсюда золотое правило рычага: во сколько раз больше
  плечо, во столько раз меньше нужна сила.</p>
  <div class="callout">В симуляции подвигайте опору: панель показывает моменты слева и справа и точку, где
  наступает равновесие ($a=\\dfrac{m_2L}{m_1+m_2}$ от левого конца — это точка, где моменты весов равны).</div>

  <h3 class="sub">Балка на двух опорах</h3>
  <p>Мост или полка лежат на двух опорах. Реакции опор находят из двух условий: сумма реакций равна суммарному
  весу, а моменты относительно одной опоры дают распределение нагрузки. Чем ближе груз к опоре, тем большую долю
  веса она несёт, — это основа расчёта мостов.</p>

  <h3 class="sub">Лестница у стены</h3>
  <p>Классическая задача Орира (пример с рис. 10-17). Лестница опирается на гладкую стену и шершавый пол. Стена
  даёт только горизонтальную реакцию, пол — вертикальную и трение. Из уравнения моментов относительно низа находят
  силу давления на стену; лестница не соскользнёт, пока трения пола хватает её удержать.</p>
  <div class="callout">Орир показывает: при $\\mu=0{,}4$ и $\\theta=60^\\circ$ человек может подняться лишь до $0{,}69$
  длины лестницы — выше она начнёт скользить. Проверьте это в симуляции, двигая человека вверх: при некотором
  положении появится предупреждение «скользит».</div>

  <h3 class="sub">Кронштейн</h3>
  <p>Вывеска на горизонтальном стержне, подкреплённом тросом-растяжкой. Момент веса относительно крепления к стене

const T_osc={
  id:'mech.osc', ch:'8', title:'Колебательное движение',
  theory:`
  <p>До сих пор мы изучали движение с постоянным ускорением или под действием тяготения. Здесь речь пойдёт о
  движении, которое повторяется во времени по <strong>синусоидальному закону</strong>. Такие колебания —
  едва ли не самая распространённая форма движения в природе: от маятника часов до атомов в кристалле.</p>

  <h3 class="sub">Гармоническая сила и закон Гука</h3>
  <p>Если сила пропорциональна смещению из положения равновесия и всегда направлена <em>к</em> нему, её называют
  <strong>гармонической</strong>. Именно такова сила упругой пружины (закон Гука): $F=-kx$, где $x$ — смещение из
  равновесия, а знак минус означает «возвращает назад». Чем дальше оттянули — тем сильнее тянет обратно.</p>
  <p>Подставив эту силу во второй закон Ньютона, получаем $m\\ddot x=-kx$. Решение этого уравнения — синусоида:
  тело колеблется по закону $x=A\\cos(\\omega t)$, где $A$ — амплитуда (наибольшее отклонение), а $\\omega$ —
  циклическая частота.</p>

  <h3 class="sub">Период, частота, амплитуда</h3>
  <p><strong>Период</strong> $T$ — время одного полного колебания. <strong>Частота</strong> $\\nu=1/T$ — число
  колебаний в секунду (в герцах). <strong>Циклическая частота</strong> $\\omega=2\\pi\\nu=2\\pi/T$. Для пружины
  $\\omega=\\sqrt{k/m}$, откуда:</p>
  <div class="callout"><strong>Ключевая мысль.</strong> Период пружинного маятника <em>не зависит от амплитуды</em>:
  качнёте сильно или слабо — время одного колебания одинаково. Это свойство называется изохронностью, и именно оно
  делает колебания хорошими часами. Проверьте в симуляции: меняйте амплитуду — период на панели не изменится.</div>

  <h3 class="sub">Математический маятник</h3>
  <p>Груз на невесомой нити длиной $L$ при малых углах тоже совершает гармонические колебания. Возвращающая сила —
  составляющая тяжести вдоль дуги, $F\\approx-mg\\dfrac{x}{L}$ — снова пропорциональна смещению. Период:</p>
  <div class="callout"><strong>Пример 3 (Орир).</strong> Маятник старинных часов имеет период $T=2$ с. Его длина
  находится из формулы: $L=\\dfrac{gT^2}{4\\pi^2}\\approx0{,}99$ м — почти метр. Замечательно, что период
  <em>не зависит ни от массы, ни от амплитуды</em> (при малых углах) — только от длины и $g$. Поэтому маятником
  measure измеряют $g$.</div>

  <h3 class="sub">Физический маятник</h3>
  <p>Реальное тело (например, стержень), качающееся вокруг оси, — это физический маятник. Его период зависит от
  момента инерции $I$ и расстояния $d$ от оси до центра масс: $T=2\\pi\\sqrt{I/(mgd)}$. Для однородного стержня,
  подвешенного за конец, $I=\\dfrac{mL^2}{3}$, $d=\\dfrac{L}{2}$, и период получается таким, будто это математический
  маятник длиной $\\dfrac{2L}{3}$ — короче самого стержня.</p>

  <h3 class="sub">Энергия колебаний</h3>
  <p>При колебаниях энергия непрерывно перетекает между кинетической и потенциальной, а их сумма постоянна.
  Для пружины полная энергия равна $\\dfrac12 kA^2$ — она пропорциональна квадрату амплитуды. В крайних точках
  (при $x=\\pm A$) вся энергия потенциальная, скорость равна нулю; в положении равновесия вся энергия кинетическая,
  скорость максимальна.</p>
  <p>Отсюда следует красивая формула для скорости в любой точке: $v=\\omega\\sqrt{A^2-x^2}$. В симуляции график
  энергии показывает, как два столбика (K и U) обмениваются, оставаясь в сумме постоянными — если не включить
  затухание, при котором энергия медленно уходит в тепло и амплитуда спадает.</p>`,
  formulas:[
    {tex:'F=-kx',
     note:'Закон Гука: гармоническая сила пропорциональна смещению и направлена к равновесию.', sim:'spring'},
    {tex:'x=A\\cos(\\omega t),\\qquad \\omega=\\dfrac{2\\pi}{T}=2\\pi\\nu',
     note:'Синусоидальное колебание. $A$ — амплитуда, $\\omega$ — циклическая частота.', sim:'spring'},
    {tex:'T=2\\pi\\sqrt{\\dfrac{m}{k}}',
     note:'Период пружинного маятника. Не зависит от амплитуды (изохронность).', sim:'spring'},
    {tex:'T=2\\pi\\sqrt{\\dfrac{L}{g}}',
     note:'Период математического маятника. Не зависит ни от массы, ни от амплитуды (при малых углах).', sim:'pendulum'},
    {tex:'T=2\\pi\\sqrt{\\dfrac{I}{mgd}}',
     note:'Период физического маятника. $I$ — момент инерции, $d$ — расстояние от оси до центра масс.', sim:'physpend'},
    {tex:'E=\\tfrac12 kA^2=\\tfrac12 mv^2+\\tfrac12 kx^2',
     note:'Полная энергия колебаний постоянна и пропорциональна квадрату амплитуды.', sim:'spring'},
    {tex:'v=\\omega\\sqrt{A^2-x^2}',
     note:'Скорость в произвольной точке: максимальна в равновесии, ноль в точках поворота.', sim:'pendulum'}
  ],
  problems:[]
};

const T_gas={
  id:'th.kinetic', ch:'9', title:'Кинетическая теория',
  theory:`
  <p>Раньше мы имели дело с отдельными телами. Но кусок газа — это триллионы триллионов молекул, и следить за
  каждой невозможно. Кинетическая теория делает удивительную вещь: применяя законы Ньютона к <em>отдельной</em>
  молекуле и усредняя, она выводит <strong>макроскопические</strong> свойства — давление, температуру — из
  микроскопического движения. Это мост между механикой и термодинамикой.</p>

  <h3 class="sub">Давление и гидростатика</h3>
  <p>Давление — это сила, действующая на единицу площади: $P=\\dfrac{F}{A}$. В покоящейся жидкости давление растёт
  с глубиной: $P=\\rho g h$ — вес столба жидкости над площадкой. Это объясняет, почему у водопровода в доме ставят
  редуктор, а водолаз на глубине испытывает огромное давление.</p>
  <div class="callout"><strong>Пример 3 (Орир).</strong> Давление в центре Земли оценивается как $P=\\rho g R/2$
  (ускорение $g$ линейно спадает к центру, поэтому берут среднее). Подставив плотность и радиус Земли, получаем
  около $1{,}7\\cdot10^{11}$ Н/м² — колоссальная величина.</div>

  <h3 class="sub">Закон Архимеда</h3>
  <p>На тело, погружённое в жидкость или газ, действует выталкивающая сила, равная <strong>весу вытесненной
  жидкости</strong>: $F_A=\\rho g V$. Плавающее тело вытесняет ровно столько жидкости, сколько весит само.</p>
  <div class="callout">Классический вопрос Орира: изменится ли уровень воды в стакане, когда растает плавающий лёд?
  Нет — лёд вытесняет воду, равную своему весу, а растаяв, ровно заполняет этот объём. Уровень остаётся прежним.</div>

  <h3 class="sub">Давление газа как удары молекул</h3>
  <p>Молекулы газа беспорядочно летают и бьются о стенки сосуда. Каждый удар передаёт стенке импульс $2mv_x$;
  множество ударов в секунду создают постоянную силу, а сила на единицу площади — это и есть давление. Подсчитав
  импульс, передаваемый всеми $N$ молекулами, Орир получает:</p>
  <p>Здесь $\\langle v^2\\rangle$ — средний квадрат скорости. Уже из этой формулы видно: при постоянной кинетической
  энергии молекул произведение $PV$ не меняется — это <strong>закон Бойля</strong> ($PV=\\text{const}$ при
  постоянной температуре).</p>

  <h3 class="sub">Уравнение состояния идеального газа</h3>
  <p>Правая часть $\\frac13 Nm\\langle v^2\\rangle$ по определению температуры равна $NkT$, где $k=1{,}38\\cdot10^{-23}$
  Дж/К — постоянная Больцмана. Так рождается <strong>уравнение состояния идеального газа</strong>: $PV=NkT$.
  Мы вывели связь между тремя макровеличинами $P$, $V$, $T$, отталкиваясь от механики одной молекулы.</p>
  <div class="callout">В симуляции газа панель показывает $P\\cdot V$ и $\\dfrac{PV}{N}$. Меняйте объём поршнем при
  постоянной температуре — увидите, что $PV$ держится постоянным (закон Бойля). Нагрейте газ — $PV$ вырастет
  пропорционально $T$.</div>

  <h3 class="sub">Температура и скорость молекул</h3>
  <p>Абсолютную температуру определяют так, чтобы средняя кинетическая энергия молекулы была прямо пропорциональна
  ей: на каждую степень свободы приходится $\\frac12 kT$. Для одноатомного газа (три степени свободы)
  $\\langle E_k\\rangle=\\frac32 kT$. Отсюда <strong>среднеквадратичная скорость</strong>:</p>
  <p>Молекулы газа при комнатной температуре носятся со скоростями порядка сотен метров в секунду. При этом лёгкие
  молекулы (водород) быстрее тяжёлых (кислород) при той же температуре — в симуляции увеличьте массу молекул и
  увидите, как они замедляются.</p>
  <div class="callout">Скорости молекул не одинаковы — они распределены по <strong>закону Максвелла</strong>: мало
  очень медленных, мало очень быстрых, большинство — около среднего. Гистограмма в симуляции показывает это
  распределение вживую; при нагреве весь «колокол» сдвигается вправо, к бо́льшим скоростям.</div>`,
  formulas:[
    {tex:'P=\\dfrac{F}{A},\\qquad P=\\rho g h',
     note:'Давление и гидростатическое давление на глубине $h$.', sim:'gas'},
    {tex:'F_A=\\rho g V',
     note:'Закон Архимеда: выталкивающая сила равна весу вытесненной жидкости.', sim:'gas'},
    {tex:'PV=\\tfrac13 Nm\\langle v^2\\rangle',
     note:'Давление газа из ударов молекул о стенки (вывод Орира).', sim:'gas'},
    {tex:'PV=NkT',
     note:'Уравнение состояния идеального газа. $k=1{,}38\\cdot10^{-23}$ Дж/К — постоянная Больцмана.', sim:'gas'},
    {tex:'PV=\\text{const}\\quad(T=\\text{const})',
     note:'Закон Бойля: при постоянной температуре давление обратно пропорционально объёму.', sim:'gas'},
    {tex:'\\langle E_k\\rangle=\\tfrac32 kT',
     note:'Средняя кинетическая энергия молекулы пропорциональна абсолютной температуре.', sim:'gas'},
    {tex:'v_{\\text{ср.кв}}=\\sqrt{\\dfrac{3kT}{m}}',
     note:'Среднеквадратичная скорость. Лёгкие молекулы быстрее тяжёлых при той же температуре.', sim:'gas'}
  ],
  problems:[]

const T_thermo={
  id:'th.thermo', ch:'10', title:'Термодинамика',
  theory:`
  <p>В этой главе мы работаем с макроскопическими величинами — давлением, объёмом, температурой, теплотой и
  энергией. Термодинамика описывает, как теплота превращается в работу и обратно, и именно на ней держатся все
  тепловые двигатели.</p>

  <h3 class="sub">Первый закон термодинамики</h3>
  <p>Первый закон — это просто закон сохранения энергии, записанный для тепловых процессов. Всю энергию тела можно
  разделить на макроскопическую (механическую) и микроскопическую — <strong>внутреннюю энергию</strong> $U$
  (скрытая энергия движения частиц). Если системе сообщить теплоту $\\Delta Q$, она пойдёт на приращение внутренней
  энергии и на работу, которую система совершит над окружением:</p>
  <div class="callout"><strong>Знаки важны.</strong> $\\Delta Q$ — теплота, <em>полученная</em> системой; $\\Delta W$
  — работа, <em>совершённая</em> системой. Если газ расширяется, он совершает положительную работу; если его сжимают,
  работа газа отрицательна и теплота может отбираться.</div>

  <h3 class="sub">Работа газа</h3>
  <p>Когда газ давит на поршень с силой $F$ и двигает его на $ds$, он совершает работу $dW=F\,ds=P\,dV$. За весь
  процесс работа равна <strong>площади под кривой на PV-диаграмме</strong>. Это ключевая картинка всей главы —
  в симуляции она закрашена.</p>
  <p>Подставляя работу в первый закон, получаем его дифференциальную форму: $dU=dQ-P\,dV$.</p>

  <h3 class="sub">Изопроцессы</h3>
  <p>Четыре важных процесса, каждый со своей кривой на PV-диаграмме:</p>
  <ul>
    <li><strong>Изотермический</strong> ($T=\\text{const}$): $PV=\\text{const}$ (закон Бойля), кривая — гипербола.
    Вся полученная теплота идёт в работу, $\\Delta U=0$.</li>
    <li><strong>Изобарический</strong> ($P=\\text{const}$): при нагреве газ расширяется, кривая — горизонталь.
    Работа равна $P\\Delta V$.</li>
    <li><strong>Изохорический</strong> ($V=\\text{const}$): работа не совершается ($\\Delta W=0$), вся теплота идёт
    во внутреннюю энергию, кривая — вертикаль.</li>
    <li><strong>Адиабатический</strong> ($Q=0$): теплообмена нет, $PV^\\gamma=\\text{const}$. Газ расширяется за счёт
    внутренней энергии и охлаждается. Адиабата идёт круче изотермы.</li>
  </ul>
  <div class="callout">В симуляции переключайте процессы и следите за панелью: для изотермы $\\Delta U=0$, для
  изохоры $W=0$, для адиабаты теплота $Q=0$, а работа совершается за счёт падения температуры. Это первый закон
  в действии.</div>

  <h3 class="sub">Гипотеза Авогадро и уравнение состояния</h3>
  <p>Один моль любого вещества содержит $N_A=6{,}02\\cdot10^{23}$ частиц. Через количество вещества $\\nu$ (в молях)
  уравнение состояния записывают как $PV=\\nu RT$, где $R=8{,}31$ Дж/(моль·К) — универсальная газовая постоянная,
  связанная с постоянной Больцмана: $R=N_A k$.</p>

  <h3 class="sub">Тепловые двигатели и КПД</h3>
  <p>Тепловая машина забирает теплоту $Q_1$ от нагревателя, часть превращает в полезную работу $W$, а остаток
  $Q_2$ отдаёт холодильнику. Коэффициент полезного действия — доля теплоты, ставшая работой:
  $\\eta=\\dfrac{W}{Q_1}=1-\\dfrac{Q_2}{Q_1}$.</p>
  <div class="callout"><strong>Пример (Орир).</strong> В бензиновом двигателе газ адиабатически расширяется при
  степени сжатия $V_2/V_1$. Чем больше степень сжатия, тем выше КПД — поэтому конструкторы стремятся её увеличить,
  пока не начинается детонация. Полный цикл двигателя — это замкнутая петля на PV-диаграмме, и работа за цикл
  равна её площади.</div>`,
  formulas:[
    {tex:'\\Delta Q=\\Delta U+\\Delta W',
     note:'Первый закон термодинамики — закон сохранения энергии для тепловых процессов.', sim:'thermo'},
    {tex:'dW=P\\,dV\\quad\\Rightarrow\\quad W=\\int_{V_1}^{V_2}P\\,dV',
     note:'Работа газа равна площади под кривой на PV-диаграмме.', sim:'thermo'},
    {tex:'dU=dQ-P\\,dV',
     note:'Дифференциальная форма первого закона.', sim:'thermo'},
    {tex:'PV=\\text{const}\\ (T=\\text{const}),\\qquad PV^\\gamma=\\text{const}\\ (Q=0)',
     note:'Изотерма (закон Бойля) и адиабата. Адиабата круче изотермы, так как $\\gamma>1$.', sim:'thermo'},
    {tex:'PV=\\nu RT',
     note:'Уравнение состояния через количество вещества. $R=8{,}31$ Дж/(моль·К), $R=N_A k$.', sim:'thermo'},
    {tex:'\\eta=\\dfrac{W}{Q_1}=1-\\dfrac{Q_2}{Q_1}',

const T_efield={

  <h3 class="sub">Принцип суперпозиции</h3>

  <h3 class="sub">Электрическое поле</h3>

const T_current={
  id:'el.current', ch:'14', title:'Электрический ток и магнитная сила',
  theory:`
  <p>До сих пор заряды у нас покоились. Стоит им прийти в движение — возникает <strong>электрический ток</strong>,

  <h3 class="sub">Электрический ток</h3>

  <h3 class="sub">Закон Ома</h3>
  <p>Для большинства проводников ток пропорционален приложенному напряжению. Отношение напряжения к току называют
  <strong>сопротивлением</strong>: $R=\\dfrac{U}{I}$. Единица — <strong>ом</strong> (В/А). Отсюда закон Ома в
  привычной форме: $I=\\dfrac{U}{R}$. В симуляции резисторов график $I(U)$ — прямая линия, наклон которой задаёт
  сопротивление.</p>

  <h3 class="sub">Соединения резисторов</h3>
  <ul>
    <li><strong>Последовательное:</strong> через все резисторы течёт один ток, сопротивления складываются
    $R=R_1+R_2$, а напряжения делятся пропорционально им.</li>
    <li><strong>Параллельное:</strong> на всех резисторах одно напряжение, токи складываются, а обратные
    сопротивления суммируются: $\\dfrac1R=\\dfrac1{R_1}+\\dfrac1{R_2}$.</li>
  </ul>

  <h3 class="sub">Мощность тока</h3>
  <p>Ток, протекая через сопротивление, выделяет тепло. Мощность равна $P=UI=I^2R=\\dfrac{U^2}{R}$. Именно так
  работают электрообогреватели и лампы накаливания. В симуляции резисторы теплеют тем сильнее, чем больше на них
  выделяется мощность.</p>

  <h3 class="sub">Конденсатор в цепи: RC-цепи</h3>
  <p>Если в цепь с резистором включить конденсатор, ток не устанавливается мгновенно. Конденсатор заряжается
  постепенно, по экспоненте, с характерным временем $\\tau=RC$ — постоянной времени цепи. За время $\\tau$
  конденсатор заряжается примерно до 63% напряжения источника, за $5\\tau$ — практически полностью. В конструкторе
  цепей можно собрать RC-цепь, делитель или параллельное соединение и наблюдать, как течёт ток и заряжаются
  конденсаторы. Расчёт ведёт настоящий решатель методом узловых потенциалов — тот же метод, что в профессиональных
  программах моделирования схем.</p>

  <h3 class="sub">Магнитное поле</h3>
  <p>Движущийся заряд и ток создают вокруг себя <strong>магнитное поле</strong> $B$ (единица — тесла, Тл). Силовые
  линии поля прямого провода с током — концентрические окружности вокруг него; их направление задаётся правилом
  правой руки.</p>

  <h3 class="sub">Магнитная сила (сила Лоренца)</h3>
  <p>На заряд, движущийся в магнитном поле, действует сила, перпендикулярная и скорости, и полю:
  $F=qvB$ (когда скорость перпендикулярна полю). Эта сила не совершает работы — она лишь искривляет траекторию.
  Поэтому в однородном поле заряд движется по <strong>окружности</strong> радиусом:</p>
  <div class="callout">$R=\\dfrac{mv}{qB}$ — чем сильнее поле, тем круче закручивается частица. Знак заряда задаёт
  направление вращения. На этом принципе работают циклотроны, масс-спектрометры и магнитные ловушки. Проверьте в
  симуляции: увеличьте $B$ — радиус уменьшится; смените знак заряда — частица закрутится в другую сторону.</div>

  <h3 class="sub">Сила на проводник с током</h3>
  <p>Раз на каждый движущийся заряд действует сила, то и на проводник с током в магнитном поле действует
  результирующая сила: $F=BIL$ (для провода длиной $L$ перпендикулярно полю). Именно эта сила вращает ротор
  электродвигателя и отклоняет стрелку измерительных приборов.</p>`,

    {tex:'I=\\dfrac{\\Delta q}{\\Delta t}',

const T_magfields={
  id:'em.fields', ch:'15', title:'Магнитные поля',
  theory:`
  <p>В прошлой главе мы узнали, что магнитное поле действует на движущиеся заряды. Теперь ответим на обратный
  вопрос: <strong>как токи создают магнитное поле</strong>? Оказывается, здесь есть свой закон, столь же красивый
  и мощный, как теорема Гаусса в электростатике, — <strong>закон Ампера</strong>.</p>

  <h3 class="sub">Закон Ампера</h3>
  <p>Возьмём произвольный замкнутый контур и просуммируем вдоль него проекции магнитного поля на направление
  обхода. Такая сумма называется <strong>циркуляцией</strong>. Ампер обнаружил замечательный факт: она зависит
  только от полного тока, пронизывающего контур:</p>
  <div class="callout">Здесь $\\mu_0=4\\pi\\cdot10^{-7}$ Гн/м — магнитная постоянная. Обратите внимание на глубокую
  аналогию с теоремой Гаусса: там поток поля через замкнутую <em>поверхность</em> определялся зарядом внутри, здесь
  циркуляция поля по замкнутому <em>контуру</em> определяется током сквозь него. В симуляции меняйте радиус контура

  <h3 class="sub">Поле прямого провода</h3>
  <p>Для прямого провода закон Ампера сразу даёт ответ. Из симметрии поле одинаково по всей окружности радиуса $r$,
  поэтому $B\\cdot2\\pi r=\\mu_0 I$, откуда $B=\\dfrac{\\mu_0 I}{2\\pi r}$. Силовые линии — концентрические окружности
  вокруг провода, а их направление задаётся правилом правой руки.</p>

  <h3 class="sub">Взаимодействие токов</h3>
  <p>Раз один провод создаёт поле, а другой в этом поле испытывает силу $F=BIL$, то два провода с током
  взаимодействуют. Сила на единицу длины равна $\\dfrac{F}{L}=\\dfrac{\\mu_0 I_1 I_2}{2\\pi d}$.</p>
  <div class="callout"><strong>Сонаправленные токи притягиваются, встречные — отталкиваются.</strong> Это может
  показаться неожиданным: у зарядов всё наоборот, одноимённые отталкиваются. Именно через это взаимодействие
  исторически определяли ампер как единицу тока.</div>

  <h3 class="sub">Соленоид</h3>
  <p>Свернём провод в длинную катушку — получится <strong>соленоид</strong>. Закон Ампера показывает, что внутри
  него поле <strong>однородно</strong> и равно $B=\\mu_0 n I$, где $n=N/L$ — число витков на единицу длины, а
  снаружи практически отсутствует. Форма витков при этом неважна. Соленоид — магнитный аналог плоского
  конденсатора: простое устройство, создающее однородное поле.</p>

  <h3 class="sub">Закон Био–Савара</h3>
  <p>Закон Ампера удобен только при высокой симметрии. В общем случае поле находят суммированием вкладов от всех
  маленьких участков тока $d\\vec l$ — это и есть <strong>закон Био–Савара</strong>. Каждый элемент даёт вклад,
  убывающий как $1/r^2$ и направленный перпендикулярно и элементу, и радиус-вектору.</p>
  <p>Классический результат: в центре кругового витка радиуса $R$ поле равно $B=\\dfrac{\\mu_0 I}{2R}$, а на его оси
  на расстоянии $x$ — $B=\\dfrac{\\mu_0 I R^2}{2(R^2+x^2)^{3/2}}$. Во второй симуляции поле считается честным
  численным интегрированием по всему витку, и в центре результат в точности совпадает с формулой.</p>

  <h3 class="sub">Магнетизм вещества</h3>
  <p>Откуда магнетизм у постоянного магнита, где нет батарейки? Источник тот же — токи, только микроскопические:
  движение электронов в атомах. Каждый атом — крошечный магнитик. По поведению во внешнем поле вещества делят на:</p>
  <ul>
    <li><strong>Ферромагнетики</strong> (железо, никель, кобальт) — атомные магнитики выстраиваются целыми
    областями, <em>доменами</em>. Во внешнем поле домены поворачиваются согласованно, вещество намагничивается очень
    сильно и может остаться намагниченным — так получается постоянный магнит.</li>
    <li><strong>Парамагнетики</strong> — слабо намагничиваются вдоль поля.</li>
    <li><strong>Диамагнетики</strong> — слабо намагничиваются <em>против</em> поля и слегка выталкиваются из него.</li>
  </ul>
  <div class="callout">Тепловое движение разрушает упорядоченность: нагрейте образец в симуляции — домены снова
  начнут смотреть хаотично. У каждого ферромагнетика есть температура (точка Кюри), выше которой он теряет
  магнитные свойства.</div>

  <h3 class="sub">Уравнения Максвелла для статических полей</h3>
  <p>Подводя итог электричеству и магнетизму в статике, получаем красивую пару утверждений: поток электрического
  поля через замкнутую поверхность задаётся зарядом внутри, а циркуляция магнитного поля по замкнутому контуру —
  током сквозь него. При этом поток <em>магнитного</em> поля через любую замкнутую поверхность всегда равен нулю:
  <strong>магнитных зарядов не существует</strong>, силовые линии магнитного поля всегда замкнуты. Эти утверждения
  войдут в знаменитую систему уравнений Максвелла, которую мы дополним в следующих главах.</p>`,
  formulas:[
    {tex:'\\oint \\vec B\\cdot d\\vec s=\\mu_0 I_{\\text{полн}}',
     note:'Закон Ампера: циркуляция поля по замкнутому контуру равна току сквозь него. $\\mu_0=4\\pi\\cdot10^{-7}$ Гн/м.', sim:'ampere'},
    {tex:'B=\\dfrac{\\mu_0 I}{2\\pi r}',

const T_induction={

  <h3 class="sub">Закон Фарадея</h3>
  <p>Ток возникает не от самого поля, а от его <strong>изменения</strong>. Точнее — от изменения магнитного потока

  <h3 class="sub">ЭДС движения</h3>

  <h3 class="sub">Закон Ленца</h3>
  <p>Куда направлен индукционный ток? Ответ даёт правило Ленца, и оно вытекает прямо из закона сохранения энергии:</p>
  <div class="callout"><strong>Индукционный ток всегда направлен так, чтобы противодействовать причине, его

  электрической $\\mathcal{E}\\cdot I$. Если бы ток шёл в другую сторону, он разгонял бы стержень сам, и мы получили
  бы вечный двигатель.</div>

  <h3 class="sub">Генератор переменного тока</h3>
  <p>Заставим рамку из $N$ витков вращаться в однородном поле с угловой скоростью $\\omega$. Поток через неё
  меняется по косинусу, значит ЭДС — по синусу:</p>
  <p>Получается <strong>переменный ток</strong>: ЭДС плавно меняется от $+NBS\\omega$ до $-NBS\\omega$ с частотой
  $f=\\omega/2\\pi$. Так устроены все электростанции — гидро-, тепловые, атомные: они по-разному крутят турбину, но
  электричество рождается всегда одинаково, вращением рамки в магнитном поле.</p>

  <h3 class="sub">Индуктивность и самоиндукция</h3>
  <p>Ток создаёт поле, а меняющееся поле наводит ЭДС в том же самом контуре — это <strong>самоиндукция</strong>.
  Катушка сопротивляется изменению тока через себя: $\\mathcal{E}=-L\\dfrac{dI}{dt}$, где $L$ — индуктивность (генри).
  Поэтому в цепи с катушкой ток нарастает не мгновенно, а плавно, с постоянной времени $\\tau=L/R$ — за время
  $\\tau$ ток достигает примерно 63% предельного значения, за $5\\tau$ — практически всего.</p>

  <h3 class="sub">Энергия магнитного поля</h3>
  <p>Раз катушка сопротивляется нарастанию тока, на его установление приходится затратить работу. Она запасается в
  магнитном поле: $W=\\dfrac12 LI^2$ — полная аналогия с энергией конденсатора $\\frac12CU^2$.</p>

  <h3 class="sub">Трансформатор</h3>
  <p>Две обмотки на общем сердечнике пронизывает один и тот же переменный поток. По закону Фарадея на каждом витке
  наводится одинаковая ЭДС, поэтому напряжения относятся как числа витков:</p>

const T_optics={
  id:'op.optics', ch:'20', title:'Оптика',
  theory:`
  <p>Свет — электромагнитная волна, но когда препятствия и приборы намного больше длины волны, о волновой природе
  можно забыть и считать, что свет распространяется <strong>лучами</strong>. Этот раздел называют
  <strong>геометрической оптикой</strong>: в нём работают всего два закона — отражения и преломления, а из них
  выводится устройство очков, фотоаппарата, микроскопа и телескопа.</p>

  <h3 class="sub">Тонкая линза</h3>
  <p>Линзу называют тонкой, если её толщина мала по сравнению с фокусным расстоянием. У такой линзы есть
  <strong>оптический центр</strong> (луч через него не преломляется) и два <strong>фокуса</strong> на равных
  расстояниях по обе стороны. Собирающая линза сводит параллельный пучок в фокус, рассеивающая — разводит его так,
  будто лучи вышли из фокуса перед линзой.</p>
  <p>Величину, обратную фокусному расстоянию, называют <strong>оптической силой</strong>:
  $D=\\dfrac{1}{F}$, она измеряется в диоптриях (дптр); 1 дптр — это линза с фокусом 1 м. У собирающей линзы
  $F>0$ и $D>0$, у рассеивающей $F<0$ и $D<0$ — именно поэтому в рецепте на очки при близорукости стоит знак минус.</p>

  <h3 class="sub">Формула тонкой линзы</h3>
  <p>Расстояния от предмета и от изображения до линзы связаны:</p>
  <div class="callout">$\\dfrac{1}{d}+\\dfrac{1}{d'}=\\dfrac{1}{F}$, откуда $d'=\\dfrac{dF}{d-F}$. Если получилось
  $d'>0$ — изображение по другую сторону линзы и оно <em>действительное</em>; если $d'<0$ — изображение по ту же
  сторону, что и предмет, и оно <em>мнимое</em>.</div>

  <h3 class="sub">Построение изображения</h3>
  <p>Чтобы найти изображение точки, достаточно двух лучей из неё — там, где они пересекутся, и будет изображение:</p>
  <ul>
    <li><strong>Луч через оптический центр</strong> идёт напрямик, не меняя направления.</li>
    <li><strong>Луч, параллельный главной оптической оси</strong>, после линзы проходит через фокус (у
    рассеивающей — уходит так, будто вышел из ближнего фокуса).</li>
  </ul>
  <p>Иногда добавляют третий луч — через передний фокус: после линзы он идёт параллельно оси. Он не нужен для
  построения, но служит хорошей проверкой.</p>

  <h3 class="sub">Действительное и мнимое изображение</h3>
  <ul>
    <li><strong>Действительное</strong> — лучи после линзы реально сходятся в точке. Такое изображение можно
    поймать на экран: так работают проектор, фотоаппарат и глаз (на сетчатке). Оно всегда перевёрнутое.</li>
    <li><strong>Мнимое</strong> — лучи расходятся, а пересекаются лишь их <em>продолжения</em> назад (в симуляции
    они показаны пунктиром). На экран его не поймать, но глаз его прекрасно видит: так работает лупа. Такое
    изображение всегда прямое.</li>
    <li><strong>Перевёрнутое</strong> изображение — то, у которого верх и низ поменялись местами. В формулах это
    отражает знак увеличения.</li>
  </ul>

  <h3 class="sub">Увеличение</h3>
  <p>Отношение высоты изображения к высоте предмета называют увеличением:</p>
  <div class="callout">$\\Gamma=\\dfrac{H}{h}=-\\dfrac{d'}{d}$. Знак минус означает, что изображение перевёрнутое.
  Если $|\\Gamma|>1$ — изображение крупнее предмета, если $|\\Gamma|<1$ — мельче.</div>

  <h3 class="sub">Все случаи для собирающей линзы</h3>
  <ul>
    <li><strong>Предмет дальше 2F</strong> — изображение действительное, перевёрнутое, уменьшенное, лежит между F
    и 2F. Так работает фотоаппарат и глаз.</li>
    <li><strong>Предмет ровно в 2F</strong> — изображение действительное, перевёрнутое, ровно такой же величины
    ($\\Gamma=-1$), тоже в точке 2F.</li>
    <li><strong>Предмет между F и 2F</strong> — изображение действительное, перевёрнутое, увеличенное, дальше 2F.
    Это режим проектора и объектива микроскопа.</li>
    <li><strong>Предмет ровно в фокусе</strong> — лучи после линзы идут параллельно, изображения нет (говорят, что
    оно ушло в бесконечность). Так устроен прожектор.</li>
    <li><strong>Предмет ближе фокуса</strong> — изображение мнимое, прямое, увеличенное, с той же стороны. Это
    <strong>лупа</strong>.</li>
  </ul>
  <p>У <strong>рассеивающей линзы</strong> случай всегда один: изображение мнимое, прямое и уменьшенное, где бы ни
  стоял предмет.</p>

  <h3 class="sub">Оптические приборы</h3>
  <p>Орир обращает внимание, что вогнутое зеркало выполняет ту же роль, что и собирающая линза, — на этом построены
  все крупные телескопы. В телескопе большое зеркало (или объектив) даёт изображение, которое затем рассматривают в
  короткофокусный окуляр, и <strong>увеличение оказывается равным отношению фокусных расстояний</strong> объектива и
  окуляра. По той же схеме устроен микроскоп, только объект стоит близко к объективу.</p>
  <div class="callout">В симуляции переключайте готовые примеры — они проходят по всем случаям от фотоаппарата до
  лупы. Вершину предмета можно перетаскивать мышью: следите, как перестраиваются лучи, а изображение переходит из
  действительного в мнимое, когда предмет пересекает фокус.</div>`,
  formulas:[
    {tex:'\\dfrac{1}{d}+\\dfrac{1}{d\'}=\\dfrac{1}{F}',
     note:'Формула тонкой линзы. $d$ — до предмета, $d\'$ — до изображения, $F$ — фокусное расстояние.', sim:'lens'},

const T_matter={
  id:'op.matter', ch:'18', title:'Взаимодействие излучения с веществом',
  theory:`
  <p>Мы выяснили, как рождается электромагнитная волна. Теперь посмотрим, что происходит, когда она встречает
  вещество: почему свет давит на препятствие, почему в стекле он идёт медленнее и преломляется, и почему радиоволны
  возвращаются из-за горизонта, а спутниковый сигнал спокойно уходит в космос.</p>

  <h3 class="sub">Энергия излучения</h3>
  <p>Волна несёт энергию. Точечный источник мощностью $P$ распределяет её по сфере, поэтому интенсивность —
  энергия, приходящая за секунду на единицу площади, — падает по закону обратных квадратов:
  $I=\\dfrac{P}{4\\pi r^2}$. Через амплитуду поля она выражается как $I=\\frac12\\varepsilon_0cE_0^2$.</p>

  <h3 class="sub">Импульс излучения и световое давление</h3>
  <p>Волна несёт не только энергию, но и <strong>импульс</strong>. Орир получает это из простого рассуждения: поле
  $\\vec E$ раскачивает заряды поверхности, а поле $\\vec B$ действует на возникший ток силой, направленной вдоль
  распространения волны. Отсюда следует красивая связь:</p>
  <div class="callout">$p=\\dfrac{U}{c}$ — импульс порции излучения равен её энергии, делённой на скорость света.
  Поэтому свет <em>давит</em> на поверхность. Для поглощающей поверхности давление равно $\\dfrac{I}{c}$, а для
  <strong>зеркальной — вдвое больше</strong>, $\\dfrac{2I}{c}$: волна не просто отдаёт импульс, но и уносит его в
  обратную сторону.</div>
  <p>Именно на этом основан <strong>солнечный парус</strong>: давление света ничтожно (у Земли около 4,5 мкПа), но
  оно действует непрерывно и годами разгоняет аппарат без запаса топлива.</p>
  <div class="callout">Орир приводит поучительный пример — <strong>радиометр Крукса</strong>, вертушка с лопастями,
  зачернёнными с одной стороны и посеребрёнными с другой. По теории светового давления зеркальная сторона получает
  вдвое больший импульс, и вертушка должна крутиться в определённую сторону — а на деле она крутится <em>наоборот</em>!
  Причина в том, что остаточный газ у зачернённой (более горячей) стороны создаёт куда большее давление, чем свет.
  Только в глубоком вакууме проявляется настоящий световой эффект. Прекрасное напоминание: прежде чем объяснять
  наблюдение красивой теорией, стоит убедиться, что не действует эффект посильнее.</div>

  <h3 class="sub">Отражение от проводника</h3>
  <p>В хорошем проводнике много свободных электронов. Пришедшая волна раскачивает их, а колеблющиеся электроны сами
  излучают — и это переизлучение гасит волну внутри металла и складывается в отражённую волну снаружи. Поэтому
  металлы блестят, и поэтому зеркало делают из тонкого слоя серебра или алюминия.</p>

  <h3 class="sub">Показатель преломления</h3>
  <p>В диэлектрике электроны связаны и раскачиваются слабее, но тоже переизлучают. Сложение первичной волны с
  переизлучённой даёт волну, идущую <strong>медленнее</strong>. Отношение скоростей и называют показателем
  преломления:</p>
  <div class="callout">$n=\\dfrac{c}{v}$. Частота волны при переходе в среду <em>не меняется</em> (её задаёт источник),

  <p>Направление преломлённого луча даёт <strong>закон Снеллиуса</strong>: $n_1\\sin\\theta_1=n_2\\sin\\theta_2$.

  <h3 class="sub">Полное внутреннее отражение</h3>
  <p>Если свет идёт из более плотной среды в менее плотную, то при достаточно большом угле падения преломлённого

  <p>У алмаза показатель преломления велик (2,42), предельный угол мал — свет, попав внутрь, многократно отражается

  <h3 class="sub">Излучение в ионизованной среде</h3>
  <p>В плазме — ионосфере, межзвёздном газе — электроны свободны, и вещество ведёт себя совсем иначе. Возникает

  <p>Орир обращает внимание на кажущийся парадокс: раз $n<1$, то фазовая скорость $c/n$ <em>больше скорости света</em>.
  Противоречия с теорией относительности нет: сигнал и энергия переносятся групповой скоростью $v_g=cn$, которая

const T_interf={

  <p>До сих пор мы имели дело с одним источником волн. Теперь посмотрим, что будет, если источников несколько.

  <h3 class="sub">Стоячие волны</h3>
  <p>Пустим по струне две одинаковые волны навстречу друг другу — например, посылая волну и отражая её от

  <p>У струны с закреплёнными концами узлы обязаны быть на обоих концах, поэтому на её длине укладывается целое

  <div class="callout">$\\lambda_n=\\dfrac{2L}{n}$, а значит $f_n=\\dfrac{nv}{2L}$ — частоты образуют ряд кратных

  <h3 class="sub">Два источника: опыт Юнга</h3>
  <p>Два когерентных источника (колеблющихся согласованно) дают на экране чередование светлых и тёмных полос.
  Причина проста: до данной точки экрана волны проходят разные пути, и всё решает <strong>разность хода</strong>

  <ul>
    <li>Если разность хода равна целому числу длин волн, гребни встречают гребни — волны усиливают друг друга,

    <li>Если разность хода полуцелая, гребень встречает впадину — волны гасят друг друга, получается
    <strong>тёмная полоса</strong>: $d\\sin\\theta=(m+\\frac12)\\lambda$.</li>
  </ul>
  <p>Орир записывает результат в виде $I=2I_0\\left[1+\\cos(kd\\sin\\theta)\\right]$: в максимуме интенсивность

  <div class="callout">Расстояние между соседними полосами $\\Delta y=\\dfrac{\\lambda L}{d}$. Отсюда видно: чем ближе

  <h3 class="sub">Когерентность</h3>
  <p>Полосы возникают, только если источники сохраняют постоянную разность фаз — их называют
  <strong>когерентными</strong>. Обычные лампы излучают независимыми короткими цугами, фазы скачут случайно, и
  картина смазывается: интенсивности просто складываются, никаких полос. Поэтому в опыте Юнга свет от одного
  источника пропускают через две щели — так обе волны заведомо согласованы.</p>

  <h3 class="sub">Принцип Гюйгенса и дифракция</h3>
  <p>Гюйгенс предложил смотреть на волну так: каждая точка фронта — сама источник маленькой сферической волны, а

  препятствия и расходиться за щелью.</p>
  <p>Разбив щель шириной $a$ на множество вторичных источников и сложив их вклады, получаем условие минимумов:

  <h3 class="sub">Дифракционная решётка</h3>
  <p>Возьмём теперь не две щели, а $N$ одинаковых, идущих с периодом $d$. Направления максимумов те же самые,

  <div class="callout">Именно поэтому решётка — главный прибор спектроскопии. Угол максимума зависит от длины

    {tex:'\\lambda_n=\\dfrac{2L}{n},\\qquad f_n=\\dfrac{nv}{2L}',

const T_qwave={

  theory:`

  <p>Комптон проверил это напрямую: направил рентгеновские лучи на вещество и посмотрел на рассеянное излучение.

  <p>Заодно понятно, почему эффект не замечали раньше: для видимого света сдвиг в 2,43 пм на фоне 500 нм — это

  <h3 class="sub">Корпускулярно-волновой дуализм</h3>

  <h3 class="sub">Дифракция электронов</h3>

const T_qm={

  theory:`
